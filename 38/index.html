<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Веб-майстерня: від першого тегу до сайту з базою даних і AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F3; --paper:#fff; --ink:#1D1B26; --muted:#6B6878; --line:#E7E1D6; --soft:#F4EFE6;
  --c:#F0622E; --cs:#FFE3D6;
  --r:18px; --side:300px;
  --code-bg:#1D1B26;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 'Golos Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3,.brand{font-family:'Unbounded','Golos Text',sans-serif;letter-spacing:-.01em;line-height:1.2}
code,kbd,pre,textarea.ed{font-family:'JetBrains Mono',ui-monospace,monospace}
:not(pre)>code{background:var(--soft);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:.86em;white-space:nowrap}
kbd{background:#fff;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:.82em}

/* layout */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;z-index:20;padding:22px 16px 40px;transition:transform .25s}
.main{margin-left:var(--side);min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:40px 28px 100px}
.topbar{display:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;text-decoration:none;padding:4px 8px 18px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;font-family:'JetBrains Mono',monospace;font-weight:600}
.nav-links a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;font-weight:600;font-size:15px}
.nav-links a:hover{background:var(--soft)}
.nav-links a.on{background:var(--ink);color:#fff}
.prog{margin:14px 8px 6px;font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#F0622E,#2F6FEB,#D99A00,#18A058,#8B5CF6);border-radius:99px;transition:width .4s}
.nb{margin-top:18px}
.nb-h{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.nb-h span{width:10px;height:10px;border-radius:3px}
.nl{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;text-decoration:none;font-size:14.5px;line-height:1.3}
.nl:hover{background:var(--soft)}
.nl .num{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.nl.done .num{background:var(--bc);color:#fff}
.nl.on{background:var(--bcs)}
.nl.on .num{outline:2px solid var(--bc)}
.nl.test .num{background:transparent;font-size:15px}

/* hero */
.hero{position:relative;background:var(--ink);color:#fff;border-radius:28px;padding:46px 40px;overflow:hidden}
.hero h1{font-size:clamp(30px,5vw,50px);margin:0 0 14px;font-weight:800}
.hero p{font-size:19px;opacity:.85;max-width:560px;margin:0}
.hero .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.hero .tags b{padding:6px 14px;border-radius:99px;font-size:14px;font-weight:700}
.hero .deco{position:absolute;right:-20px;top:-10px;font:600 15px/1.5 'JetBrains Mono',monospace;opacity:.13;white-space:pre;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 34px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat b{display:block;font:800 28px 'Unbounded',sans-serif}
.stat span{font-size:14px;color:var(--muted)}
.road{display:grid;gap:14px}
.rb{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--bc);border-radius:var(--r);padding:18px 20px}
.rb h3{margin:0;font-size:18px;display:flex;gap:10px;align-items:center}
.rb small{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:99px;background:var(--bcs);text-decoration:none;font-size:14px;font-weight:500}
.chip i{font-style:normal;width:22px;height:22px;border-radius:99px;background:var(--bc);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.chip.t{background:var(--ink);color:#fff}
.chip.t i{background:#fff;color:var(--ink)}

/* lesson */
.crumb{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:99px;background:var(--cs);color:var(--c);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.lh h1{font-size:clamp(28px,4.2vw,42px);margin:16px 0 10px;font-weight:800}
.lh .sub{font-size:19px;color:var(--muted);margin:0}
.meta{display:flex;gap:16px;margin-top:14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.goals{margin:28px 0 10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px}
.goals h4{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.goals ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
.goals li{padding-left:26px;position:relative;font-size:15.5px}
.goals li:before{content:"✓";position:absolute;left:0;top:0;width:18px;height:18px;border-radius:6px;background:var(--c);color:#fff;font-size:11px;display:grid;place-items:center;margin-top:3px;font-weight:800}
.content h2{font-size:24px;margin:44px 0 12px;font-weight:700;display:flex;gap:12px;align-items:center}
.content h2:before{content:"";width:8px;height:26px;border-radius:4px;background:var(--c)}
.content p{margin:12px 0}
.content ul.list{padding-left:0;list-style:none}
.content ul.list li{padding:8px 0 8px 22px;position:relative;border-bottom:1px dashed var(--line)}
.content ul.list li:before{content:"";position:absolute;left:4px;top:18px;width:7px;height:7px;border-radius:99px;background:var(--c)}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:16px 0}
ol.steps li{counter-increment:s;position:relative;padding:12px 16px 12px 58px;background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
ol.steps li:before{content:counter(s);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:10px;background:var(--c);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
.cd{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.cd .i{font-size:28px}
.cd h4{margin:6px 0 4px;font-size:16px}
.cd p{margin:0;font-size:15px;color:var(--muted)}
.tbl{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{background:var(--soft);text-align:left;font-weight:700;padding:10px 14px;white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.call{display:flex;gap:14px;padding:16px 18px;border-radius:var(--r);margin:18px 0;font-size:16px}
.call .ci{font-size:22px;line-height:1.3}
.call p{margin:0}
.call.tip{background:#E8F1FF;border:1px solid #C9DBFF}
.call.warn{background:#FFF1E6;border:1px solid #FFD2B3}
.call.idea{background:#F1ECFF;border:1px solid #DCD0FF}
figure.fig{margin:22px 0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
figure.fig svg{width:100%;height:auto;display:block}
figure.fig figcaption{font-size:14px;color:var(--muted);text-align:center;margin-top:10px}

/* code */
.code{margin:18px 0;border-radius:16px;overflow:hidden;background:var(--code-bg);box-shadow:0 10px 30px rgba(29,27,38,.12)}
.ch{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 16px;background:#2A2835;color:#C9C5D6;font-size:13px}
.ch .dots{display:flex;gap:6px}.ch .dots i{width:10px;height:10px;border-radius:99px;background:#4A4757}
.ch .ttl{font-family:'JetBrains Mono',monospace;flex:1}
.ch .lang{text-transform:uppercase;font-size:11px;letter-spacing:.08em;font-weight:700;color:#8F8AA0}
.btn{border:none;cursor:pointer;font:600 13px 'Golos Text',sans-serif;border-radius:9px;padding:6px 12px;background:#3A3746;color:#fff;transition:.15s}
.btn:hover{background:#4A4757}
.btn.run{background:var(--c);color:#fff}
.btn.run:hover{filter:brightness(1.1)}
pre{margin:0;padding:16px 18px;overflow-x:auto;color:#EDEAF5;font-size:14px;line-height:1.6;tab-size:2}
pre code{font-family:inherit}
.note{font-size:14.5px;color:var(--muted);margin:-8px 4px 18px}
.out{background:#fff;border-top:3px solid var(--c)}
.out iframe{width:100%;height:240px;border:0;display:block;background:#fff}
.cons{background:#16151C;color:#C9F7D9;font:13px/1.6 'JetBrains Mono',monospace;padding:10px 16px;max-height:200px;overflow:auto;display:none}
.cons.has{display:block}
.cons div{white-space:pre-wrap;border-bottom:1px solid #2A2835;padding:2px 0}
.cons .e{color:#FF9B9B}.cons .w{color:#FFD58A}.cons .a{color:#A5C8FF}
.cons .lbl{color:#6B6878;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
/* playground */
.play{margin:22px 0;border:2px solid var(--c);border-radius:20px;overflow:hidden;background:var(--paper)}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--c);color:#fff;font-weight:700}
.ph span{flex:1}
.ph .btn{background:rgba(255,255,255,.22)}
.ph .btn:hover{background:rgba(255,255,255,.35)}
.pg{display:grid;grid-template-columns:1fr 1fr;min-height:280px}
textarea.ed{white-space:pre;overflow:auto;border:0;resize:vertical;min-height:280px;padding:14px 16px;background:var(--code-bg);color:#EDEAF5;font-size:14px;line-height:1.6;outline:none;tab-size:2}
.pg iframe{width:100%;height:100%;min-height:280px;border:0;background:#fff}

/* boxes */
.box{border-radius:22px;padding:22px 24px;margin:34px 0 0}
.box h3{margin:0 0 10px;font-size:19px;display:flex;gap:10px;align-items:center}
.box.proj{background:var(--ink);color:#fff}
.box.proj p{margin:0;opacity:.92}
.box.proj code{background:#2F2D3A;border-color:#3A3746;color:#fff}
.box.check{background:var(--paper);border:2px dashed var(--c)}
.box.check ul{margin:0;padding:0;list-style:none}
.box.check li{padding:6px 0 6px 30px;position:relative}
.box.check li:before{content:"🔍";position:absolute;left:0;top:5px}
.hw{display:grid;gap:10px}
.hwi{display:flex;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.hwi b{flex:none;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:8px;background:var(--cs);color:var(--c);height:fit-content;white-space:nowrap}
.box.hwb{background:var(--soft)}

/* quiz */
.quiz{display:grid;gap:14px}
.qq{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.qq h4{margin:0 0 12px;font-size:16.5px;font-weight:700}
.qq h4 small{color:var(--c);font-weight:800;margin-right:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:2px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;font-size:15.5px;transition:.12s}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.ok{border-color:#18A058;background:#E9F9EF}
.opt.bad{border-color:#E5484D;background:#FFEDEE}
.why{display:none;margin-top:8px;font-size:14.5px;color:var(--muted)}
.checked .why{display:block}
.qbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}
.bigbtn{border:none;cursor:pointer;font:700 16px 'Golos Text',sans-serif;border-radius:14px;padding:13px 22px;background:var(--c);color:#fff;transition:.15s}
.bigbtn:hover{transform:translateY(-2px)}
.bigbtn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.score{display:none;align-items:center;gap:18px;background:var(--ink);color:#fff;border-radius:18px;padding:18px 22px;margin-top:14px}
.score.on{display:flex}
.score .big{font:800 40px 'Unbounded',sans-serif;color:var(--c)}
.score p{margin:0}

.terms{margin:14px 0 10px;background:var(--cs);border-radius:var(--r);padding:18px 22px}
.terms h4{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.terms dl{margin:0;display:grid;gap:8px}
.terms dl div{background:var(--paper);border-radius:12px;padding:10px 14px}
.terms dt{font-weight:800;font-size:15.5px}
.terms dd{margin:2px 0 0;font-size:15px;color:#3E3B49}
.terms .tl{display:inline-block;margin-top:10px;font-size:14px;font-weight:700;color:var(--c);text-decoration:none}
.gsearch{width:100%;margin-top:22px;padding:14px 18px;border-radius:14px;border:2px solid var(--line);font:500 17px 'Golos Text',sans-serif;background:var(--paper);outline:none}
.gsearch:focus{border-color:var(--c)}
.gfilt{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.gfilt button{border:2px solid var(--bcs);background:var(--paper);border-radius:99px;padding:6px 14px;font:600 14px 'Golos Text',sans-serif;cursor:pointer}
.gfilt button.on{background:var(--bc);border-color:var(--bc);color:#fff}
.gh{font-size:22px;margin:34px 0 12px}
.gterms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gt{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--bc);border-radius:14px;padding:12px 14px}
.gt .gtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gt .gtop a{flex:none;font-size:12px;font-weight:700;background:var(--bcs);color:var(--bc);padding:2px 8px;border-radius:99px;text-decoration:none}
.gt p{margin:6px 0 0;font-size:15px;color:#3E3B49;line-height:1.5}
.hwl{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--bc);border-radius:16px;padding:14px 18px;margin-bottom:12px}
.hwh a{display:flex;gap:10px;align-items:center;font-weight:800;text-decoration:none;font-size:16.5px}
.hwh i{font-style:normal;width:28px;height:28px;border-radius:9px;background:var(--bc);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.hwp{font-size:14.5px;color:var(--muted);margin:8px 0 6px}
.hwc{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line);font-size:15px;cursor:pointer}
.hwc input{margin-top:5px;accent-color:var(--bc);width:17px;height:17px;flex:none}
.hwc b{flex:none;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:7px;background:var(--bcs);color:var(--bc);margin-top:2px}
.hwc input:checked ~ span{text-decoration:line-through;opacity:.55}
.donebar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:40px;padding:18px 20px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);flex-wrap:wrap}
.done-btn.is{background:#18A058}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.pn a{display:block;padding:16px 18px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);text-decoration:none}
.pn a:hover{border-color:var(--c)}
.pn small{color:var(--muted);display:block;font-size:13px}
.pn b{font-size:15.5px}
.pn .nx{text-align:right}
.testban{display:flex;gap:16px;align-items:center;margin-top:24px;padding:20px 22px;border-radius:var(--r);background:var(--ink);color:#fff;text-decoration:none}
.testban .e{font-size:34px}
.testban b{display:block;font-size:17px}
.testban span{opacity:.75;font-size:14px}
.demo{border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 50px rgba(29,27,38,.12);margin:18px 0;background:#fff}
.demo .bb{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.demo .bb i{width:11px;height:11px;border-radius:99px;background:#E7E1D6}
.demo .bb span{margin-left:10px;background:#fff;border-radius:8px;padding:2px 12px;flex:1;max-width:340px}
.demo iframe{width:100%;height:620px;border:0;display:block}

/* prism tokens */
.token.comment,.token.prolog,.token.doctype,.token.cdata{color:#8F8AA0;font-style:italic}
.token.punctuation{color:#C9C5D6}
.token.tag,.token.selector,.token.keyword,.token.important{color:#FF8F6B}
.token.attr-name,.token.property,.token.function{color:#FFD166}
.token.attr-value,.token.string,.token.url{color:#7EE2A8}
.token.number,.token.boolean,.token.constant{color:#B79BFF}
.token.operator,.token.entity{color:#7FB0FF}
.token.class-name,.token.builtin{color:#7FB0FF}

@media (max-width:980px){
  .side{transform:translateX(-105%)}
  body.open .side{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.15)}
  :not(pre)>code{white-space:normal;word-break:break-word}
  .main{margin-left:0}
  .topbar{display:flex;position:sticky;top:0;z-index:15;align-items:center;gap:12px;padding:10px 16px;background:rgba(251,248,243,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font:600 15px 'Golos Text',sans-serif;cursor:pointer}
  .topbar .brand{padding:0;font-size:16px}
  .topbar .logo{width:30px;height:30px;font-size:12px}
  .wrap{padding:24px 16px 80px}
  .stats{grid-template-columns:1fr 1fr}
  .goals ul{grid-template-columns:1fr}
  .pg{grid-template-columns:1fr}
  .hero{padding:32px 24px}
  .pn{grid-template-columns:1fr}
  .demo iframe{height:560px}
}
</style>
</head>
<body>
<aside class="side" id="side"></aside>
<div class="main">
  <div class="topbar"><button id="menu">☰ Уроки</button><a class="brand" href="#home"><span class="logo">&lt;/&gt;</span>Веб-майстерня</a></div>
  <div class="wrap" id="view"></div>
</div>
<script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
<script>
const DATA = {"blocks": [{"id": "html", "name": "HTML", "sub": "Скелет сторінки", "icon": "🦴", "color": "#F0622E", "soft": "#FFE3D6"}, {"id": "css", "name": "CSS", "sub": "Стиль і вигляд", "icon": "🎨", "color": "#2F6FEB", "soft": "#DCE8FF"}, {"id": "js", "name": "JavaScript", "sub": "Логіка й інтерактив", "icon": "⚡", "color": "#D99A00", "soft": "#FFF3CC"}, {"id": "db", "name": "Дані й бекенд", "sub": "SQL, API, сервер, хмара", "icon": "🗄️", "color": "#18A058", "soft": "#D7F5E3"}, {"id": "ai", "name": "Git, AI і фінал", "sub": "Git, AI-напарник, агенти, захист", "icon": "🤖", "color": "#8B5CF6", "soft": "#EDE5FF"}], "lessons": [{"n": 1, "block": "html", "title": "Як влаштований веб. Перша сторінка", "sub": "Що насправді відбувається, коли ти відкриваєш сайт, і як створити свою першу сторінку за 10 хвилин.", "goals": ["пояснити, що роблять браузер і сервер", "розрізняти HTML, CSS і JavaScript", "створити файл index.html і відкрити його в браузері", "відкрити інструменти розробника (DevTools)"], "sections": [{"t": "h", "v": "Що відбувається, коли ти відкриваєш сайт?"}, {"t": "p", "v": "Ти вводиш адресу, і твій <b>браузер<\/b> (Chrome, Firefox, Edge) надсилає <b>запит<\/b> на інший комп'ютер, <b>сервер<\/b>. Сервер відповідає файлами: HTML, CSS, JavaScript, картинками. Браузер читає ці файли й <i>малює<\/i> з них сторінку. На все це йде менше секунди."}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif'>\n<defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1D1B26\"/><\/marker><\/defs>\n<rect x=\"20\" y=\"40\" width=\"210\" height=\"170\" rx=\"16\" fill=\"#fff\" stroke=\"#1D1B26\" stroke-width=\"2\"/>\n<rect x=\"20\" y=\"40\" width=\"210\" height=\"32\" rx=\"16\" fill=\"#F0622E\"/><rect x=\"20\" y=\"58\" width=\"210\" height=\"14\" fill=\"#F0622E\"/>\n<circle cx=\"40\" cy=\"56\" r=\"5\" fill=\"#fff\"/><circle cx=\"56\" cy=\"56\" r=\"5\" fill=\"#fff\"/><circle cx=\"72\" cy=\"56\" r=\"5\" fill=\"#fff\"/>\n<rect x=\"40\" y=\"88\" width=\"120\" height=\"12\" rx=\"6\" fill=\"#1D1B26\"/><rect x=\"40\" y=\"110\" width=\"170\" height=\"8\" rx=\"4\" fill=\"#E7E1D6\"/><rect x=\"40\" y=\"126\" width=\"150\" height=\"8\" rx=\"4\" fill=\"#E7E1D6\"/><rect x=\"40\" y=\"148\" width=\"80\" height=\"40\" rx=\"8\" fill=\"#2F6FEB\"/><rect x=\"130\" y=\"148\" width=\"80\" height=\"40\" rx=\"8\" fill=\"#E8A400\"/>\n<text x=\"125\" y=\"236\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#1D1B26\">Браузер (клієнт)<\/text>\n<rect x=\"530\" y=\"40\" width=\"210\" height=\"170\" rx=\"16\" fill=\"#fff\" stroke=\"#1D1B26\" stroke-width=\"2\"/>\n<rect x=\"555\" y=\"64\" width=\"160\" height=\"30\" rx=\"6\" fill=\"#1D1B26\"/><circle cx=\"572\" cy=\"79\" r=\"5\" fill=\"#18A058\"/>\n<rect x=\"555\" y=\"104\" width=\"160\" height=\"30\" rx=\"6\" fill=\"#1D1B26\"/><circle cx=\"572\" cy=\"119\" r=\"5\" fill=\"#18A058\"/>\n<rect x=\"555\" y=\"144\" width=\"160\" height=\"30\" rx=\"6\" fill=\"#1D1B26\"/><circle cx=\"572\" cy=\"159\" r=\"5\" fill=\"#E8A400\"/>\n<text x=\"635\" y=\"236\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#1D1B26\">Сервер<\/text>\n<line x1=\"240\" y1=\"100\" x2=\"520\" y2=\"100\" stroke=\"#1D1B26\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n<text x=\"380\" y=\"88\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1D1B26\">① Запит: «дай мені index.html»<\/text>\n<line x1=\"520\" y1=\"160\" x2=\"240\" y2=\"160\" stroke=\"#F0622E\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n<text x=\"380\" y=\"186\" text-anchor=\"middle\" font-size=\"15\" fill=\"#F0622E\">② Відповідь: HTML + CSS + JS<\/text>\n<text x=\"380\" y=\"30\" text-anchor=\"middle\" font-size=\"14\" fill=\"#6B6878\">Інтернет<\/text>\n<\/svg>", "cap": "Браузер просить, сервер віддає файли, браузер малює сторінку."}, {"t": "h", "v": "Три мови вебу"}, {"t": "cards", "v": [{"i": "🦴", "h": "HTML: скелет", "p": "Каже, ЩО є на сторінці: заголовок, текст, картинка, кнопка."}, {"i": "🎨", "h": "CSS: одяг", "p": "Каже, ЯК це виглядає: кольори, шрифти, розташування."}, {"i": "⚡", "h": "JavaScript: мозок", "p": "Каже, що РОБИТИ: реагувати на кліки, рахувати, завантажувати дані."}]}, {"t": "idea", "v": "Уяви будинок. HTML — стіни й кімнати, CSS — фарба й меблі, JavaScript — електрика: світло вмикається, двері відчиняються."}, {"t": "h", "v": "Готуємо робоче місце"}, {"t": "steps", "v": ["Встанови <b>VS Code<\/b> і розширення <b>Live Server<\/b> (покроково — у розділі «Де працювати»).", "Створи папку <code>polytsia<\/code> (латиницею, без пробілів). Це буде папка нашого проєкту на весь курс.", "У VS Code: <b>File → Open Folder<\/b> → обери папку.", "Створи файл <code>index.html<\/code>. Напиши <code>!<\/code> і натисни <kbd>Tab<\/kbd>: VS Code сам вставить шаблон сторінки.", "Клацни правою кнопкою по коду → <b>Open with Live Server<\/b>. Сторінка відкриється в браузері й оновлюватиметься після кожного збереження (<kbd>Ctrl<\/kbd>+<kbd>S<\/kbd>)."]}, {"t": "h", "v": "Перша сторінка"}, {"t": "code", "lang": "html", "v": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Моя полиця<\/title>\n<\/head>\n<body>\n  <h1>Привіт, це моя перша сторінка!<\/h1>\n  <p>Тут скоро з'явиться моя колекція улюблених ігор.<\/p>\n<\/body>\n<\/html>", "run": true, "title": "index.html", "note": null}, {"t": "table", "head": ["Рядок", "Що означає"], "rows": [["<code>&lt;!DOCTYPE html&gt;<\/code>", "«Браузере, це сучасний HTML»"], ["<code>&lt;html lang=\"uk\"&gt;<\/code>", "Початок сторінки, мова: українська"], ["<code>&lt;head&gt;<\/code>", "Службова інформація, якої не видно на сторінці: кодування, назва вкладки"], ["<code>&lt;meta charset=\"UTF-8\"&gt;<\/code>", "Щоб українські літери показувались правильно, а не «кракозябрами»"], ["<code>&lt;title&gt;<\/code>", "Текст на вкладці браузера"], ["<code>&lt;body&gt;<\/code>", "Усе, що бачить людина"]]}, {"t": "h", "v": "Анатомія тегу"}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif'>\n<rect x=\"10\" y=\"60\" width=\"740\" height=\"70\" rx=\"14\" fill=\"#1D1B26\"/>\n<text x=\"40\" y=\"106\" font-size=\"30\" font-family='JetBrains Mono, monospace' fill=\"#fff\"><tspan fill=\"#F0622E\">&lt;p<\/tspan> <tspan fill=\"#E8A400\">class<\/tspan><tspan fill=\"#fff\">=<\/tspan><tspan fill=\"#7EE2A8\">\"note\"<\/tspan><tspan fill=\"#F0622E\">&gt;<\/tspan>Привіт, світе!<tspan fill=\"#F0622E\">&lt;/p&gt;<\/tspan><\/text>\n<path d=\"M40 140 v14 h150 v-14\" fill=\"none\" stroke=\"#F0622E\" stroke-width=\"2\"/><text x=\"115\" y=\"176\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1D1B26\">відкривальний тег<\/text>\n<path d=\"M88 50 v-14 h165 v14\" fill=\"none\" stroke=\"#E8A400\" stroke-width=\"2\"/><text x=\"170\" y=\"26\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1D1B26\">атрибут = значення<\/text>\n<path d=\"M290 140 v14 h250 v-14\" fill=\"none\" stroke=\"#18A058\" stroke-width=\"2\"/><text x=\"415\" y=\"176\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1D1B26\">вміст (те, що бачить людина)<\/text>\n<path d=\"M560 50 v-14 h105 v14\" fill=\"none\" stroke=\"#F0622E\" stroke-width=\"2\"/><text x=\"612\" y=\"26\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1D1B26\">закривальний тег<\/text>\n<text x=\"380\" y=\"204\" text-anchor=\"middle\" font-size=\"14\" fill=\"#6B6878\">Весь цей рядок разом — це ЕЛЕМЕНТ<\/text>\n<\/svg>", "cap": "Більшість тегів парні: відкривальний і закривальний (з косою рискою)."}, {"t": "try", "v": "<h1>Змінюй мене!<\/h1>\n<p>Напиши тут щось про себе.<\/p>\n<p>А тепер додай ще один абзац нижче.<\/p>", "title": "Спробуй сам"}, {"t": "h", "v": "Як перевіряти сторінку в браузері"}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 270\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif'>\n<rect x=\"10\" y=\"10\" width=\"740\" height=\"250\" rx=\"14\" fill=\"#fff\" stroke=\"#1D1B26\" stroke-width=\"2\"/>\n<rect x=\"10\" y=\"10\" width=\"380\" height=\"250\" rx=\"14\" fill=\"#FBF8F3\"/><text x=\"30\" y=\"44\" font-size=\"15\" font-weight=\"700\" fill=\"#1D1B26\">Твоя сторінка<\/text><rect x=\"30\" y=\"60\" width=\"200\" height=\"16\" rx=\"8\" fill=\"#1D1B26\"/><rect x=\"30\" y=\"90\" width=\"330\" height=\"70\" rx=\"10\" fill=\"#DCE8FF\" stroke=\"#2F6FEB\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><text x=\"195\" y=\"130\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F6FEB\">виділений елемент<\/text><rect x=\"30\" y=\"175\" width=\"160\" height=\"60\" rx=\"10\" fill=\"#FFE3D6\"/><rect x=\"200\" y=\"175\" width=\"160\" height=\"60\" rx=\"10\" fill=\"#FFF3CC\"/>\n<rect x=\"390\" y=\"10\" width=\"360\" height=\"36\" fill=\"#1D1B26\"/><g font-size=\"13\" font-weight=\"700\"><text x=\"405\" y=\"33\" fill=\"#E8A400\">Elements<\/text><text x=\"480\" y=\"33\" fill=\"#fff\">Console<\/text><text x=\"548\" y=\"33\" fill=\"#fff\">Network<\/text><text x=\"618\" y=\"33\" fill=\"#fff\">📱<\/text><text x=\"650\" y=\"33\" fill=\"#fff\">Lighthouse<\/text><\/g>\n<g font-size=\"13\" font-family='JetBrains Mono, monospace'><text x=\"405\" y=\"72\" fill=\"#F0622E\">&lt;main&gt;<\/text><rect x=\"398\" y=\"80\" width=\"345\" height=\"22\" fill=\"#DCE8FF\"/><text x=\"420\" y=\"96\" fill=\"#F0622E\">&lt;section class=\"card\"&gt;<\/text><text x=\"405\" y=\"122\" fill=\"#F0622E\">&lt;/main&gt;<\/text><\/g>\n<line x1=\"390\" y1=\"140\" x2=\"750\" y2=\"140\" stroke=\"#E7E1D6\" stroke-width=\"2\"/><text x=\"405\" y=\"162\" font-size=\"12\" fill=\"#6B6878\" font-weight=\"700\">Styles<\/text>\n<g font-size=\"13\" font-family='JetBrains Mono, monospace'><text x=\"405\" y=\"186\" fill=\"#2F6FEB\">.card {<\/text><text x=\"420\" y=\"206\" fill=\"#1D1B26\">padding: <tspan fill=\"#18A058\">16px<\/tspan>;<\/text><text x=\"420\" y=\"226\" fill=\"#1D1B26\" text-decoration=\"line-through\">color: red;<\/text><text x=\"405\" y=\"246\" fill=\"#2F6FEB\">}<\/text><\/g>\n<text x=\"620\" y=\"215\" font-size=\"12\" fill=\"#6B6878\">← правиш тут,<\/text><text x=\"620\" y=\"232\" font-size=\"12\" fill=\"#6B6878\">бачиш одразу<\/text>\n<\/svg>", "cap": "DevTools: зліва сторінка, справа її код, який можна змінювати наживо."}, {"t": "p", "v": "Натисни <kbd>F12<\/kbd> (або <kbd>Ctrl<\/kbd>+<kbd>Shift<\/kbd>+<kbd>I<\/kbd>, на Mac <kbd>Cmd<\/kbd>+<kbd>Option<\/kbd>+<kbd>I<\/kbd>). Відкриються <b>інструменти розробника<\/b>. Вкладка <b>Elements<\/b> показує HTML сторінки. Наведи мишку на рядок коду, і браузер підсвітить цей елемент. Двічі клацни по тексту, щоб його змінити (це лише в тебе на екрані, сайт не зламається)."}, {"t": "tip", "v": "Детальний гайд по DevTools — у розділі <a href='#browser'>«Як перевіряти сторінку»<\/a>. Повертайся до нього, коли щось не працює."}], "project": "Створи папку <code>polytsia<\/code> і файл <code>index.html<\/code>. Обери тему своєї полиці: <b>книги, ігри, фільми, музика, аніме, кросівки…<\/b> Напиши заголовок <code>&lt;h1&gt;<\/code> з назвою полиці й абзац про те, що там буде.", "check": ["Вкладка браузера показує твій <code>&lt;title&gt;<\/code>", "Українські літери відображаються нормально", "F12 → Elements: ти бачиш свій <code>&lt;h1&gt;<\/code> і <code>&lt;p&gt;<\/code>"], "hw": [{"lvl": "Базовий", "v": "Створи файл <code>about.html<\/code>: заголовок «Про мене» і 3 абзаци (хобі, улюблена гра/книга, ким хочеш стати)."}, {"lvl": "Середній", "v": "Відкрий будь-який сайт (наприклад, новини), натисни F12 і зміни заголовок через Elements. Зроби скріншот «фейкової новини» про свій клас 😄"}, {"lvl": "Зірочка ⭐", "v": "Знайди на <a href='https://developer.mozilla.org/uk/docs/Web/HTML/Element' target='_blank'>MDN<\/a> 3 теги, яких ми ще не вчили, і застосуй їх у <code>about.html<\/code>."}], "quiz": [{"q": "Що робить браузер?", "o": ["Зберігає сайти", "Отримує файли від сервера й малює з них сторінку", "Пише HTML-код", "Роздає інтернет"], "a": 1, "w": "Браузер — це «художник»: отримує файли й показує сторінку."}, {"q": "Яка мова відповідає за вигляд (кольори, шрифти)?", "o": ["HTML", "JavaScript", "CSS", "Python"], "a": 2, "w": "CSS — це «одяг» сторінки."}, {"q": "Де пишемо те, що бачить людина?", "o": ["У &lt;head&gt;", "У &lt;title&gt;", "У &lt;body&gt;", "У &lt;meta&gt;"], "a": 2, "w": "У &lt;head&gt; — службове, у &lt;body&gt; — видиме."}], "mins": 45, "id": "web", "terms": [{"t": "Вебсайт", "d": "Набір сторінок, з'єднаних посиланнями, які лежать на сервері й відкриваються в браузері.", "n": 1}, {"t": "Браузер", "d": "Програма (Chrome, Firefox, Edge, Safari), яка завантажує файли сайту й малює з них сторінку.", "n": 1}, {"t": "Сервер", "d": "Комп'ютер, що постійно увімкнений і віддає файли або дані на запит інших комп'ютерів.", "n": 1}, {"t": "Клієнт", "d": "Той, хто надсилає запит і отримує відповідь. У вебі клієнт — це браузер.", "n": 1}, {"t": "URL (адреса)", "d": "Повна адреса ресурсу в інтернеті, наприклад https://site.com/about.html.", "n": 1}, {"t": "HTML", "d": "HyperText Markup Language — мова розмітки. Описує, ЩО є на сторінці: заголовки, текст, картинки, кнопки.", "n": 1}, {"t": "CSS", "d": "Cascading Style Sheets — мова стилів. Описує, ЯК виглядає сторінка: кольори, шрифти, розташування.", "n": 1}, {"t": "JavaScript (JS)", "d": "Мова програмування для вебу. Робить сторінку живою: реагує на дії, рахує, завантажує дані.", "n": 1}, {"t": "Тег", "d": "Позначка в кутових дужках, наприклад &lt;p&gt;. Каже браузеру, що це за шматок сторінки.", "n": 1}, {"t": "Елемент", "d": "Відкривальний тег + вміст + закривальний тег разом: &lt;p&gt;Текст&lt;/p&gt;.", "n": 1}, {"t": "Атрибут", "d": "Додаткове налаштування тегу у вигляді назва=\"значення\", наприклад href=\"...\" чи alt=\"...\".", "n": 1}, {"t": "Редактор коду", "d": "Програма для написання коду з підсвіткою та підказками. Ми використовуємо VS Code.", "n": 1}, {"t": "DevTools", "d": "Інструменти розробника в браузері (F12): показують код сторінки, помилки, запити, мобільний вигляд.", "n": 1}]}, {"n": 2, "block": "html", "title": "Текст: заголовки, абзаци, виділення", "sub": "З тексту починається будь-який сайт. Вчимося правильно його розмічати.", "goals": ["використовувати заголовки h1–h6 за правилами", "розмічати абзаци, виділення, переноси", "вставляти спецсимволи й цитати", "залишати коментарі в коді"], "sections": [{"t": "h", "v": "Заголовки: від головного до дрібного"}, {"t": "p", "v": "Заголовків є шість рівнів: від <code>&lt;h1&gt;<\/code> (найважливіший) до <code>&lt;h6&gt;<\/code>. Правило: <b>один h1 на сторінку<\/b>, далі h2 для розділів, h3 для підрозділів. Як зміст у книжці."}, {"t": "code", "lang": "html", "v": "<h1>Моя полиця ігор<\/h1>\n<h2>Улюблені<\/h2>\n<h3>Пригоди<\/h3>\n<p>Ігри, де треба досліджувати світ.<\/p>\n<p>Текст може бути <strong>важливим<\/strong> або <em>з наголосом<\/em>.<br>\nА це новий рядок у тому ж абзаці.<\/p>\n<hr>\n<p>Лінія вище розділяє теми.<\/p>", "run": true, "title": null, "note": null}, {"t": "warn", "v": "Не обирай заголовок за розміром! Якщо хочеш маленький текст — це робота CSS. HTML-теги кажуть про <b>зміст<\/b>, а не про вигляд."}, {"t": "h", "v": "Спецсимволи"}, {"t": "p", "v": "Деякі символи в HTML мають особливе значення (наприклад, <code>&lt;<\/code> відкриває тег). Щоб показати їх як текст, використовують <b>HTML-сутності<\/b>:"}, {"t": "table", "head": ["Пишеш", "Бачиш", "Для чого"], "rows": [["<code>&amp;lt;<\/code> / <code>&amp;gt;<\/code>", "&lt; &gt;", "Кутові дужки як текст"], ["<code>&amp;copy;<\/code>", "©", "Авторське право у футері"], ["<code>&amp;nbsp;<\/code>", "нерозривний пробіл", "Щоб «10 км» не розірвались на два рядки"], ["<code>&amp;mdash;<\/code>", "—", "Довге тире"]]}, {"t": "h", "v": "Цитати й код"}, {"t": "code", "lang": "html", "v": "<blockquote>\n  Програмування — це мистецтво розбивати велику задачу на маленькі.\n<\/blockquote>\n\n<p>Щоб вивести текст . */ і //.", "n": 2}]}, {"n": 3, "block": "html", "title": "Списки й посилання", "sub": "Нумеровані й марковані списки, посилання на сайти, на свої сторінки і навіть на місце всередині сторінки.", "goals": ["робити марковані й нумеровані списки, зокрема вкладені", "ставити посилання на сайти й свої сторінки", "робити якірні посилання всередині сторінки", "будувати меню з кількох сторінок"], "sections": [{"t": "h", "v": "Списки"}, {"t": "code", "lang": "html", "v": "<h2>Мій топ-3<\/h2>\n<ol>\n  <li>Minecraft<\/li>\n  <li>Stardew Valley<\/li>\n  <li>Terraria<\/li>\n<\/ol>\n\n<h2>Що мені подобається в іграх<\/h2>\n<ul>\n  <li>Будувати<\/li>\n  <li>Досліджувати\n    <ul>\n      <li>печери<\/li>\n      <li>океан<\/li>\n    <\/ul>\n  <\/li>\n<\/ul>", "run": true, "title": null, "note": "<code>ol<\/code> = ordered list (з номерами), <code>ul<\/code> = unordered list (з крапками), <code>li<\/code> = list item (пункт)."}, {"t": "h", "v": "Посилання"}, {"t": "code", "lang": "html", "v": "<!-- Посилання на інший сайт, відкривається в новій вкладці -->\n<a href=\"https://uk.wikipedia.org\" target=\"_blank\">Вікіпедія<\/a>\n\n<!-- Посилання на твою іншу сторінку -->\n<a href=\"about.html\">Про мене<\/a>\n\n<!-- Посилання на пошту -->\n<a href=\"mailto:me@example.com\">Напиши мені<\/a>", "run": false, "title": null, "note": "<code>&lt;!-- ... --&gt;<\/code> — це коментар. Браузер його ігнорує, а людям він допомагає зрозуміти код."}, {"t": "p", "v": "<code>href<\/code> — це <b>адреса<\/b>, куди веде посилання. <code>target=\"_blank\"<\/code> відкриває нову вкладку."}, {"t": "h", "v": "Якірні посилання: стрибок по сторінці"}, {"t": "code", "lang": "html", "v": "<nav>\n  <a href=\"#top5\">Топ-5<\/a> |\n  <a href=\"#all\">Уся колекція<\/a>\n<\/nav>\n\n<h2 id=\"top5\">Мій топ-5<\/h2>\n<p>...<\/p>\n\n<h2 id=\"all\">Уся колекція<\/h2>\n<p>...<\/p>", "run": false, "title": null, "note": "<code>href=\"#all\"<\/code> веде до елемента з <code>id=\"all\"<\/code>. Так роблять меню на одностор "tip", "v": "<code>&lt;div&gt;<\/code> — «коробка без назви» для групування, коли жоден семантичний тег не підходить. <code>&lt;span&gt;<\/code> — те саме, але для шматочка тексту всередині рядка."}, {"t": "h", "v": "Доступність: сайт для всіх"}, {"t": "p", "v": "Близько кожної шостої людини у світі має певну інвалідність. Хтось не бачить і слухає сайт через <b>програму екранного доступу<\/b>, хтось керує лише клавіатурою. Семантика — перший крок до доступності:"}, {"t": "list", "v": ["Один <code>&lt;h1&gt;<\/code> і логічні заголовки — програма читає їх як зміст.", "<code>&lt;nav&gt;<\/code> — людина одразу переходить до меню.", "<code>alt<\/code> у картинок, <code>&lt;label&gt;<\/code> у полів.", "Спробуй: натискай <kbd>Tab<\/kbd> на своїй сторінці. Чи можна дістатися до всіх посилань?"]}, {"t": "try", "v": "<header><h1>Мій сайт<\/h1><nav><a href=\"#\">Головна<\/a> <a href=\"#\">Блог<\/a><\/nav><\/header>\n<main>\n  <article>\n    <h2>Перша стаття<\/h2>\n    <p>Текст статті...<\/p>\n  <\/article>\n  <!-- додай aside з цікавим фактом -->\n<\/main>\n<footer>&copy; 2026<\/footer>", "title": "Спробуй сам"}], "project": "Перебудуй <code>index.html<\/code>: <code>header<\/code> (назва + <code>nav<\/code>), <code>main<\/code> з розділами <code>section<\/code> («Топ-5», «Вся колекція»), <code>aside<\/code> з фактом про твою тему, <code>footer<\/code>.", "check": ["F12 → Elements: згорни <code>&lt;body&gt;<\/code>, і ти бачиш header / main / footer", "Пройдися по сторінці клавішею Tab: видно, де фокус?", "F12 → Lighthouse → Accessibility: які зауваження?"], "hw": [{"lvl": "Базовий", "v": "Сторінка «Мій клас» із семантичною структурою: header, nav, main (2 section), aside, footer."}, {"lvl": "Середній", "v": "Візьми будь-який сайт новин, відкрий F12 і випиши, які семантичні теги він використовує."}, {"lvl": "Зірочка ⭐", "v": "Увімкни на телефоні VoiceOver (iPhone) або TalkBack (Android) і «послухай» свою сторінку. Що незручно?"}], "quiz": [{"q": "Який тег для головного вміс , "lang": "html", "v": "<table border=\"1\">\n  <caption>Розклад на понеділок<\/caption>\n  <tr><th>Час<\/th><th>Урок<\/th><\/tr>\n  <tr><td>8:30<\/td><td>Математика<\/td><\/tr>\n  <tr><td colspan=\"2\" style=\"text-align:center\">🍎 Велика перерва<\/td><\/tr>\n  <tr><td rowspan=\"2\">10:00<\/td><td>Інформатика (група 1)<\/td><\/tr>\n  <tr><td>Англійська (група 2)<\/td><\/tr>\n<\/table>", "run": true, "title": null, "note": "<code>colspan=\"2\"<\/code> — клітинка на 2 стовпці, <code>rowspan=\"2\"<\/code> — на 2 рядки."}, {"t": "warn", "v": "Таблиці — лише для <b>даних<\/b>. Колись ними верстали цілі сайти, але сьогодні для розташування є CSS (Flexbox і Grid)."}, {"t": "try", "v": "<table border=\"1\">\n  <tr><th>День<\/th><th>1 урок<\/th><th>2 урок<\/th><\/tr>\n  <tr><td>Пн<\/td><td>Математика<\/td><td>Інформатика<\/td><\/tr>\n  <!-- додай вівторок -->\n<\/table>", "title": "Спробуй сам"}, {"t": "h", "v": "Перевірка валідатором"}, {"t": "steps", "v": ["Відкрий <a href='https://validator.w3.org/#validate_by_input' target='_blank'>validator.w3.org<\/a> → вкладка <b>Validate by Direct Input<\/b>.", "Встав весь код свого index.html → <b>Check<\/b>.", "Виправ усі <b>Error<\/b>. Warning — підказки, їх теж варто прочитати."]}], "project": "У розділі «Вся колекція» зроби таблицю з <code>caption<\/code>: назва, автор/студія, рік, оцінка (мінімум 6 рядків). Перевір усю сторінку валідатором.", "check": ["Таблиця має <code>thead<\/code> і <code>tbody<\/code>", "Валідатор: 0 помилок", "F12 → Elements: розгорни таблицю й знайди свій <code>colspan<\/code>"], "hw": [{"lvl": "Базовий", "v": "Свій розклад уроків на тиждень у вигляді таблиці з caption."}, {"lvl": "Середній", "v": "Таблиця «Турнір класу» (футбол / шахи): команди, ігри, перемоги, поразки, очки."}, {"lvl": "Зірочка ⭐", "v": "Таблиця-календар на місяць з об'єднаними клітинками для свят і канікул."}], "quiz": [{"q": "Що таке &lt;td&gt;?", "o": ["Рядок", "Звичайна клітинка", "Заголовок", "Таблиця"], "a": 1, "w": "table data. м'я, назва"], ["email", "Пошта (перевіряє @)", "me@school.ua"], ["password", "Приховані символи", "Пароль"], ["number", "Число зі стрілочками", "Оцінка, вік"], ["range", "Повзунок", "Гучність"], ["date", "Календар", "Дата народження"], ["color", "Вибір кольору", "Колір теми"], ["checkbox", "Галочка (можна кілька)", "Згоден з правилами"], ["radio", "Один варіант з групи", "Стать персонажа"]]}, {"t": "try", "v": "<form>\n  <p>Улюблений жанр:<\/p>\n  <label><input type=\"radio\" name=\"genre\"> Пригоди<\/label>\n  <label><input type=\"radio\" name=\"genre\"> Стратегія<\/label>\n  <p>Гучність: <input type=\"range\" min=\"0\" max=\"100\"><\/p>\n  <p>Колір теми: <input type=\"color\" value=\"#f0622e\"><\/p>\n  <p>Дата: <input type=\"date\"><\/p>\n<\/form>", "title": "Пограйся з типами полів"}, {"t": "tip", "v": "<code>label for=\"x\"<\/code> + <code>input id=\"x\"<\/code> = клік по підпису ставить курсор у поле. Це зручно на телефоні й обов'язково для доступності."}, {"t": "warn", "v": "У radio-кнопок однієї групи має бути однаковий <code>name<\/code>, інакше можна вибрати всі одразу."}, {"t": "p", "v": "Поки що форма нікуди не відправляє дані. Ми «оживимо» її в уроці 26 через JavaScript, а в уроці 33 дані з неї потраплятимуть у справжню базу даних."}], "project": "Додай на <code>index.html<\/code> розділ «Додати на полицю» з формою: назва (required), автор, категорія (select), оцінка (number 1–5), відгук (textarea), кнопка.", "check": ["Порожню назву не можна відправити", "Клік по підпису ставить курсор у відповідне поле", "Оцінку 7 браузер не приймає"], "hw": [{"lvl": "Базовий", "v": "Анкета учасника гуртка: ім'я, клас (select), email, улюблена мова програмування (radio), «про себе» (textarea)."}, {"lvl": "Середній", "v": "Форма замовлення піци: розмір (radio), добавки (checkbox), адреса, дата й час доставки."}, {"lvl": "Зірочка ⭐", "v": "Дізнайся про атрибут <code>pattern<\/code> і зроби поле телефону, яке приймає лише формат +380XXXXXXXXX."}, {"lvl": "Підготовка", "v": "Наступного уроку — <b>Контрольна №1: HTML<\/b>. Повтори уроки 1–7."}], "quiz": [{"q": "Що робить атрибут required?", "o": ["Робить поле червоним", "Не дає відправити форму з порожнім полем", "Зберігає дані", "Ховає поле"], "a": 1, "w": "required = обов'язкове."}, {"q": "Як зробити, щоб з групи radio можна було обрати лише один варіант?", "o": ["Дати однаковий id", "Дати однаковий name", "Додати required", "Ніяк"], "a": 1, "w": "Однаковий name об'єднує в групу."}, {"q": "Навіщо &lt;label&gt;?", "o": ["Для краси", "Підпис поля: зручність і доступність", "Щоб відправити форму", "Це заголовок сторінки"], "a": 1, "w": "Label пов'язує текст з полем."}], "mins": 45, "id": "forms", "terms": [{"t": "Форма", "d": "&lt;form&gt; — контейнер з полями та кнопкою, через який людина вводить дані.", "n": 7}, {"t": "input", "d": "Поле введення. Тип визначає атрибут type: text, email, number, checkbox, radio, date…", "n": 7}, {"t": "label", "d": "Підпис поля. Пов'язується з input через for і id: клік по підпису ставить курсор у поле.", "n": 7}, {"t": "placeholder", "d": "Сірий текст-підказка в порожньому полі, що зникає, коли починаєш писати.", "n": 7}]}, {"n": 8, "block": "css", "title": "Знайомство з CSS: селектори", "sub": "Вдягаємо сторінку: підключаємо стилі й вчимося «цілитися» в потрібні елементи.", "goals": ["підключати окремий файл style.css", "використовувати селектори: тег, .клас, #id, нащадок", "розуміти каскад і специфічність", "редагувати стилі в DevTools"], "sections": [{"t": "h", "v": "Анатомія CSS-правила"}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 230\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif'>\n<rect x=\"10\" y=\"50\" width=\"740\" height=\"130\" rx=\"14\" fill=\"#1D1B26\"/>\n<text x=\"40\" y=\"100\" font-size=\"30\" font-family='JetBrains Mono, monospace' fill=\"#7FB0FF\">.card <tspan fill=\"#fff\">{<\/tspan><\/text>\n<text x=\"80\" y=\"140\" font-size=\"30\" font-family='JetBrains Mono, monospace' fill=\"#E8A400\">background<tspan fill=\"#fff\">:<\/tspan> <tspan fill=\"#7EE2A8\">white<\/tspan><tspan fill=\"#fff\">;<\/tspan><\/text>\n<text x=\"500\" y=\"140\" font-size=\"30\" font-family='JetBrains Mono, monospace' fill=\"#fff\">}<\/text>\n<path d=\"M40 40 v-12 h96 v12\" fill=\"none\" stroke=\"#2F6FEB\" stroke-width=\"2\"/><text x=\"88\" y=\"20\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1D1B26\">селектор: КОГО стилізуємо<\/text>\n<path d=\"M80 190 v12 h180 v-12\" fill=\"none\" stroke=\"#E8A400\" stroke-width=\"2\"/><text x=\"170\" y=\"224\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1D1B26\">властивість: ЩО міняємо<\/text>\n<path d=\"M290 190 v12 h110 v-12\" fill=\"none\" stroke=\"#18A058\" stroke-width=\"2\"/><text x=\"420\" y=\"224\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1D1B26\">значення: ЯК саме<\/text>\n<text x=\"560\" y=\"100\" font-size=\"14\" fill=\"#9C98A8\">{ } — блок правил<\/text><text x=\"560\" y=\"124\" font-size=\"14\" fill=\"#9C98A8\">; — кінець рядка<\/text>\n<\/svg>", "cap": "Кожне правило: КОГО (селектор) → ЩО (властивість) → ЯК (значення)."}, {"t": "h", "v": "Три способи підключити CSS"}, {"t": "code", "lang": "html", "v": "<!-- 1. Окремий файл — ✅ найкраще, так роблять професіонали -->\n<head>\n  <link rel=\"stylesheet\" href=\"css/style.css\">\n<\/head>\n\n<!-- 2. Всередині сторінки — ок для експериментів -->\n<style>\n  h1 { color: tomato; }\n<\/style>\n\n<!-- 3. Прямо в тезі — ❌ уникай, важко підтримувати -->\n<h1 style=\"color: tomato;\">Заголовок<\/h1>", "run": false, "title": null, "note": null}, {"t": "h", "v": "Селектори: як «прицілитися»"}, {"t": "code", "lang": "html", "v": "<style>\n  /* за тегом — усі абзаци */\n  p { color: #444; }\n\n  /* за класом — усі елементи з class=\"card\" */\n  .card { background: #fff3cc; padding: 10px; }\n\n  /* за id — один унікальний елемент */\n  #main-title { color: #f0622e; }\n\n  /* нащадок — посилання всередині nav */\n  nav a { color: #2f6feb; }\n\n  /* групування — кілька селекторів одразу */\n  h1, h2 { font-family: sans-serif; }\n<\/style>\n\n<h1 id=\"main-title\">Моя полиця<\/h1>\n<nav><a href=\"#\">Головна<\/a> <a href=\"#\">Про мене<\/a><\/nav>\n<p>Звичайний абзац.<\/p>\n<p class=\"card\">Абзац-картка<\/p>\n<div class=\"card\">І div теж може бути карткою<\/div>", "run": true, "title": null, "note": null}, {"t": "tip", "v": "Клас можна давати скільки завгодно елементам, а id — лише одному. Можна кілька класів одразу: <code>class=\"card big\"<\/code>."}, {"t": "h", "v": "Каскад: хто перемагає?"}, {"t": "p", "v": "Якщо два правила сперечаються, перемагає: <b>1)<\/b> точніший селектор (#id &gt; .клас &gt; тег); <b>2)<\/b> якщо однакові — те, що написано <b>нижче<\/b>. Звідси й назва: Cascading Style Sheets — «каскадні таблиці стилів»."}, {"t": "try", "v": "<style>\n  p { color: gray; }\n  .important { color: crimson; font-weight: bold; }\n  #special { background: gold; }\n  /* яке правило переможе для третього абзацу? */\n<\/style>\n<p>Звичайний абзац<\/p>\n<p class=\"important\">Важливий абзац<\/p>\n<p class=\"important\" id=\"special\">Особливий абзац<\/p>", "title": "Хто переможе?"}], "project": "Створи <code>css/style.css<\/code> і підключи до <code>index.html<\/code>. Дай класи <code>card<\/code> статтям і зроби 8+ правил з різними типами селекторів (тег, клас, id, нащадок).", "check": ["F12 → Elements → клік по h1 → у Styles видно твої правила і файл <code>style.css<\/code>", "Якщо стилі не працюють — Network: чи є style.css (а не 404)?", "Закресленні правила в Styles — це ті, що програли в каскаді"], "hw": [{"lvl": "Базовий", "v": "Розфарбуй сторінку «Про мене»: окремий style.css, усі три типи селекторів."}, {"lvl": "Середній", "v": "Пройди 15 рівнів <a href='https://flukeout.github.io' target='_blank'>CSS Diner<\/a>."}, {"lvl": "Зірочка ⭐", "v": "Пройди всі 32 рівні CSS Diner."}], "quiz": [{"q": "Як вибрати всі елементи з class=\"card\"?", "o": ["card", "#card", ".card", "*card"], "a": 2, "w": "Крапка = клас."}, {"q": "Що переможе: #title { color: red } чи h1 { color: blue }?", "o": ["blue", "red", "Змішаються", "Жоден"], "a": 1, "w": "id специфічніший."}, {"q": "Що вибирає nav a?", "o": ["Усі nav і всі a", "Посилання всередині nav", "nav з класом a", "Нічого"], "a": 1, "w": "Пробіл = нащадок."}], "mins": 45, "id": "css-intro", "terms": [{"t": "Селектор", "d": "Частина CSS-правила, що вказує, КОГО стилізувати: p, .card, #title.", "n": 8}, {"t": "Властивість і значення", "d": "Що міняємо і як: color: red. Пара записується через двокрапку й закінчується крапкою з комою.", "n": 8}, {"t": "Клас", "d": "Атрибут class=\"назва\" — «мітка» для стилізації. Може бути в багатьох елементів. У CSS: .назва.", "n": 8}, {"t": "id", "d": "Унікальне ім'я елемента (id=\"назва\"), лише одне на сторінку. У CSS: #назва, у JS — для пошуку елемента.", "n": 8}, {"t": "Каскад", "d": "Правило, як CSS вирішує суперечки: перемагає точніший селектор, а за рівної точності — той, що нижче.", "n": 8}, {"t": "Специфічність", "d": "«Вага» селектора: #id сильніший за .клас, а .клас — за тег.", "n": 8}]}, {"n": 9, "block": "css", "title": "Кольори, фони й градієнти", "sub": "Палітра сайту: формати кольорів, фонові картинки, градієнти та прозорість.", "goals": ["записувати кольори в hex, rgb, hsl", "робити фон кольором, градієнтом і картинкою", "керувати прозорістю", "підбирати гармонійну палітру"], "sections": [{"t": "h", "v": "Кольори"}, {"t": "table", "head": ["Формат", "Приклад", "Коли зручно"], "rows": [["Назва", "<code>tomato<\/code>, <code>white<\/code>", "Швидкі експерименти"], ["HEX", "<code>#F0622E<\/code>", "Найпоширеніший, копіюєш з дизайну"], ["RGB", "<code>rgb(240, 98, 46)<\/code>", "Червоний, зелений, синій від 0 до 255"], ["HSL", "<code>hsl(16, 87%, 56%)<\/code>", "Відтінок, насиченість, світлість: легко робити світліше/темніше"]]}, {"t": "try", "v": "<style>\n  body { background: #fbf8f3; }\n  h1 { color: hsl(16, 87%, 56%); }\n  .box { background: rgb(47, 111, 235); color: white; padding: 20px; }\n<\/style>\n<h1>Змінюй кольори!<\/h1>\n<div class=\"box\">Спробуй hsl(200, 80%, 40%)<\/div>", "title": "Спробуй сам"}, {"t": "h", "v": "Градієнти"}, {"t": "code", "lang": "html", "v": "<style>\n  .g1 { background: linear-gradient(90deg, #f0622e, #e8a400); }\n  .g2 { background: linear-gradient(135deg, #2f6feb, #8b5cf6); }\n  .g3 { background: radial-gradient(circle, #fff3cc, #f0622e); }\n  div { height: 70px; border-radius: 14px; margin: 8px 0; color: white;\n        display: grid; place-items: center; font: bold 18px sans-serif; }\n<\/style>\n<div class=\"g1\">linear 90deg<\/div>\n<div class=\"g2\">linear 135deg<\/div>\n<div class=\"g3\">radial<\/div>", "run": true, "title": null, "note": null}, {"t": "h", "v": "Фонова картинка"}, {"t": "code", "lang": "css", "v": ".hero {\n  background-image: url('../images/hero.jpg');\n  background-size: cover;        /* заповнити весь блок */\n  background-position: center;   /* центр картинки в центрі блоку */\n  min-height: 300px;\n}\n\n/* текст на фото читається краще з темним шаром */\n.hero {\n  background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.5)), url('../images/hero.jpg') center / cover;\n  color: white;\n}", "run": false, "title": null, "note": null}, {"t": "h", "v": "Прозорість"}, {"t": "p", "v": "<code>opacity: 0.5<\/code> робить прозорим увесь елемент разом з текстом. Щоб прозорим був лише фон, використовуй колір з альфа-каналом: <code>rgba(0, 0, 0, 0.5)<\/code> або <code>#00000080<\/code>."}, {"t": "h", "v": "Як підібрати палітру"}, {"t": "list", "v": ["Правило <b>60–30–10<\/b>: 60% — основний (фон), 30% — додатковий (картки, шапка), 10% — акцент (кнопки, посилання).", "Генератори: <a href='https://coolors.co' target='_blank'>coolors.co<\/a>, <a href='https://color.adobe.com' target='_blank'>color.adobe.com<\/a>.", "Перевір контраст тексту й фону: <a href='https://webaim.org/resources/contrastchecker/' target='_blank'>WebAIM Contrast Checker<\/a> (мінімум 4.5 : 1)."]}, {"t": "try", "v": "<style>\n  body { margin: 0; font-family: sans-serif; }\n  .hero {\n    background: linear-gradient(135deg, #1d1b26, #2f6feb);\n    color: white; padding: 40px 20px; text-align: center;\n  }\n  .btn { background: #f0622e; color: white; padding: 10px 20px; border-radius: 99px; display: inline-block; }\n<\/style>\n<div class=\"hero\">\n  <h1>Моя полиця<\/h1>\n  <p>Зміни градієнт і колір кнопки<\/p>\n  <span class=\"btn\">Дивитися колекцію<\/span>\n<\/div>", "title": "Шапка з градієнтом"}], "project": "Обери палітру з 3–4 кольорів за правилом 60–30–10. Зроби шапці градієнтний фон, кнопкам — акцентний колір. Перевір контраст тексту.", "check": ["F12 → Styles → клацни квадратик кольору: побачиш контраст (Contrast ratio) і чи достатній він", "Фонова картинка не «розтягнута»: background-size: cover", "Кольори схожі на палітру, яку ти обрав"], "hw": [{"lvl": "Базовий", "v": "Зроби 5 кнопок з різними градієнтами й назви їх (Захід сонця, Океан…)."}, {"lvl": "Середній", "v": "Шапка-банер з фоновим фото й темним напівпрозорим шаром, на ній заголовок і кнопка."}, {"lvl": "Зірочка ⭐", "v": "Знайди палітру улюбленого бренду/гри (через піпетку DevTools на їхньому сайті) і повтори її на своїй сторінці."}], "quiz": [{"q": "Що означає #000000?", "o": ["Білий", "Чорний", "Червоний", "Прозорий"], "a": 1, "w": "Усі канали 0 — чорний."}, {"q": "Як зробити прозорим лише фон, а не текст?", "o": ["opacity: 0.5", "background: rgba(0,0,0,.5)", "color: transparent", "display: none"], "a": 1, "w": "Альфа-канал у кольорі фону."}, {"q": "Що робить background-size: cover?", "o": ["Повторює картинку", "Масштабує картинку, щоб вона заповнила блок", "Ховає картинку", "Робить її маленькою"], "a": 1, "w": "Заповнити повністю."}], "mins": 45, "id": "colors", "terms": [{"t": "HEX", "d": "Запис кольору шістнадцятковим кодом: #F0622E (червоний, зелений, синій по 2 символи).", "n": 9}, {"t": "RGB / HSL", "d": "Інші способи записати колір: rgb(240, 98, 46) — суміш трьох кольорів; hsl — відтінок, насиченість, світлість.", "n": 9}, {"t": "Градієнт", "d": " et\" href=\"css/style.css\">\n<\/head>", "run": false, "title": "index.html", "note": null}, {"t": "code", "lang": "css", "v": "body   { font-family: 'Nunito', sans-serif; }\nh1, h2 { font-family: 'Unbounded', sans-serif; }", "run": false, "title": "css/style.css", "note": null}, {"t": "tip", "v": "Правило двох шрифтів: один для заголовків (з характером), другий для тексту (простий і читабельний). Більше — це вже хаос."}, {"t": "h", "v": "Одиниці виміру"}, {"t": "table", "head": ["Одиниця", "Що це"], "rows": [["<code>px<\/code>", "Пікселі: точно й просто"], ["<code>rem<\/code>", "Відносно базового шрифту (зазвичай 1rem = 16px). Масштабується, якщо людина збільшила шрифт у налаштуваннях"], ["<code>%<\/code>", "Відсоток від батьківського елемента"], ["<code>vw / vh<\/code>", "Відсоток ширини / висоти екрана"]]}, {"t": "h", "v": "Посилання та :hover"}, {"t": "try", "v": "<style>\n  a { color: #2f6feb; text-decoration: none; font-weight: bold; }\n  a:hover { color: #f0622e; text-decoration: underline; }\n  a:visited { color: #8b5cf6; }\n<\/style>\n<p>Наведи мишку: <a href=\"#\">це посилання<\/a> змінить колір.<\/p>", "title": "Стани посилань"}, {"t": "p", "v": "<code>:hover<\/code> — це <b>псевдоклас<\/b>, стан «на мене навели мишку». Ще є <code>:focus<\/code> (поле, в якому курсор), <code>:active<\/code> (натискання), <code>:first-child<\/code> і багато інших."}], "project": "Підключи 2 шрифти з кирилицею. Налаштуй <code>body<\/code> (шрифт, розмір, line-height, колір), заголовки і стилі посилань у меню з <code>:hover<\/code>.", "check": ["F12 → Elements → вкладка <b>Computed<\/b> → <code>font-family<\/code>: видно, який шрифт реально застосувався", "Перевір, що й літери «ї», «є», «ґ» гарні (не стандартний шрифт)", "Ctrl + «+» у браузері: текст масштабується?"], "hw": [{"lvl": "Базовий", "v": "Оформи текст сторінки «Про мене»: 2 шрифти з Google Fonts, різні розміри заголовків, стилізовані посилання."}, {"lvl": "Середній", "v": "Зроби «постер» події (шкільна дискотека/хакатон) лише текстом і CSS: великий заголовок, дата, деталі."}, {"lvl": "Зірочка ⭐", "v": "Дізнайся про <code>text-shadow<\/code> і зроби заголовок з «неоновим» світінням."}], "quiz": [{"q": "Що треба увімкнути на Google Fonts для українських літер?", "o": ["Bold", "Cyrillic", "Latin", "Serif"], "a": 1, "w": "Фільтр Cyrillic."}, {"q": "Що робить line-height: 1.6?", "o": ["Товщина шрифту", "Міжрядковий інтервал у 1.6 раза більший за розмір шрифту", "Висота сторінки", "Відступ зліва"], "a": 1, "w": "Більший інтервал — легше читати."}, {"q": "Що таке :hover?", "o": ["Новий тег", "Стан елемента, коли на нього навели мишку", "Анімація", "Колір"], "a": 1, "w": "Псевдоклас стану."}], "mins": 45, "id": "fonts", "terms": [{"t": "Шрифт", "d": "Накреслення літер (font-family). Завжди вказуй запасний: 'Nunito', sans-serif.", "n": 10}, {"t": "Google Fonts", "d": "Безкоштовна бібліотека шрифтів. Для українського тексту обирай шрифти з підтримкою Cyrillic.", "n": 10}, {"t": "px / rem", "d": "Одиниці розміру: px — пікселі, rem — частка від базового шрифту (1rem ≈ 16px).", "n": 10}, {"t": "Псевдоклас", "d": "Стан елемента в CSS: :hover (навели мишку), :focus (в полі курсор), :first-child (перший).", "n": 10}]}, {"n": 11, "block": "css", "title": "Блокова модель: кожен елемент — коробка", "sub": "Відступи, рамки, розміри. Зрозумієш блокову модель, і верстка перестане бути магією.", "goals": ["пояснити content, padding, border, margin", "розрізняти блочні й рядкові елементи", "використовувати box-sizing: border-box", "робити картки з закругленнями й тінями"], "sections": [{"t": "h", "v": "Кожен елемент — це коробка"}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 330\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif' font-weight=\"700\">\n<rect x=\"20\" y=\"10\" width=\"720\" height=\"310\" rx=\"6\" fill=\"#FFF3CC\" stroke=\"#E8A400\" stroke-dasharray=\"8 6\" stroke-width=\"2\"/><text x=\"40\" y=\"38\" font-size=\"16\" fill=\"#9A6B00\">margin — зовнішній відступ (простір між сусідами)<\/text>\n<rect x=\"80\" y=\"55\" width=\"600\" height=\"230\" rx=\"6\" fill=\"#1D1B26\"/><text x=\"100\" y=\"80\" font-size=\"16\" fill=\"#fff\">border — рамка<\/text>\n<rect x=\"92\" y=\"90\" width=\"576\" height=\"183\" rx=\"4\" fill=\"#D7F5E3\"/><text x=\"112\" y=\"116\" font-size=\"16\" fill=\"#0E6B39\">padding — внутрішній відступ (від рамки до вмісту)<\/text>\n<rect x=\"200\" y=\"135\" width=\"360\" height=\"110\" rx=\"4\" fill=\"#DCE8FF\" stroke=\"#2F6FEB\" stroke-width=\"2\"/><text x=\"380\" y=\"185\" text-anchor=\"middle\" font-size=\"20\" fill=\"#1D1B26\">content — вміст<\/text><text x=\"380\" y=\"212\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"400\" fill=\"#2F6FEB\">width × height<\/text>\n<\/svg>", "cap": "Ззовні всередину: margin → border → padding → content."}, {"t": "code", "lang": "html", "v": "<style>\n  .box {\n    width: 250px;\n    padding: 20px;               /* всередині, від рамки до тексту */\n    border: 4px solid #1d1b26;   /* товщина, стиль, колір */\n    margin: 30px;                /* ззовні, від сусідів */\n    background: #dce8ff;\n  }\n<\/style>\n<div class=\"box\">Я коробка. Відкрий F12 і наведи на мене: побачиш кольорові відступи!<\/div>\n<div class=\"box\">Я сусідня коробка<\/div>", "run": true, "title": null, "note": null}, {"t": "p", "v": "Відступи можна задати по сторонах: <code>padding: 10px 20px<\/code> (верх-низ, ліво-право) або <code>margin-top: 40px<\/code>. Центрувати блок: <code>margin: 0 auto<\/code>."}, {"t": "h", "v": "Блочні й рядкові"}, {"t": "table", "head": ["Блочні (block)", "Рядкові (inline)"], "rows": [["div, p, h1–h6, section, ul, form", "a, span, strong, img, input"], ["Займають усю ширину, нові з нового рядка", "Стоять у рядку, як слова"], ["Можна задати width / height", "width / height не працюють (крім img)"]]}, {"t": "p", "v": "Поміняти поведінку можна властивістю <code>display: block | inline | inline-block | none<\/code>. <code>none<\/code> взагалі ховає елемент."}, {"t": "h", "v": "box-sizing: секретна суперсила"}, {"t": "warn", "v": "За замовчуванням <code>width: 250px<\/code> + <code>padding: 20px<\/code> + <code>border: 4px<\/code> = <b>298px<\/b>! Щоб ширина була рівно тією, що написав, додай на початок кожного CSS-файлу:"}, {"t": "code", "lang": "css", "v": "* { box-sizing: border-box; }   /* тепер width включає padding і border */\nbody { margin: 0; }              /* прибираємо стандартний відступ браузера */", "run": false, "title": null, "note": null}, {"t": "h", "v": "Робимо гарну картку"}, {"t": "try", "v": "<style>\n  * { box-sizing: border-box; }\n  body { background: #fbf8f3; font-family: sans-serif; padding: 20px; }\n  .card {\n    max-width: 280px;\n    padding: 16px;\n    background: white;\n    border-radius: 16px;\n    box-shadow: 0 8px 24px rgba(0,0,0,.12);\n  }\n  .card img { width: 100%; border-radius: 10px; display: block; background: #ddd; height: 140px; }\n  .card h3 { margin: 12px 0 4px; }\n  .card p { margin: 0; color: #6b6878; }\n<\/style>\n<article class=\"card\">\n  <img alt=\"обкладинка\">\n  <h3>Stardew Valley<\/h3>\n  <p>Ферма · ★★★★★<\/p>\n<\/article>", "title": "Картка для полиці"}, {"t": "tip", "v": "Тіні генеруй тут: <a href='https://shadows.brumm.af' target='_blank'>shadows.brumm.af<\/a>. М'які тіні з великим розмиттям виглядають сучасно."}], "project": "Додай <code>* { box-sizing: border-box }<\/code>. Перетвори кожен <code>&lt;article&gt;<\/code> зі своєю річчю на картку: картинка, назва, автор, оцінка. Відступи, закруглення, тінь.", "check": ["F12 → Elements → вкладка <b>Computed<\/b>: внизу схема блокової моделі з цифрами", "Наведи на елемент в Elements: margin підсвічується помаранчевим, padding — зеленим", "Зніми галочку біля властивості в Styles — побачиш, що вона робить"], "hw": [{"lvl": "Базовий", "v": "Зроби 3 картки «Мої друзі/улюблені персонажі» з фото, ім'ям і описом."}, {"lvl": "Середній", "v": "Скопіюй вигляд картки товару з будь-якого інтернет-магазину (тільки HTML + CSS)."}, {"lvl": "Зірочка ⭐", "v": "Пройди гру <a href='https://cssbattle.dev' target='_blank'>CSSBattle<\/a>, перші 3 рівні."}], "quiz": [{"q": "Що таке padding?", "o": ["Зовнішній відступ", "Внутрішній відступ від рамки до вмісту", "Рамка", "Тінь"], "a": 1, "w": "padding — всередині."}, {"q": "Що робить box-sizing: border-box?", "o": ["Додає рамку", "Робить так, що width включає padding і border", "Ховає елемент", "Центрує"], "a": 1, "w": "Ширина стає передбачуваною."}, {"q": "Як відцентрувати блок з фіксованою шириною?", "o": ["text-align: center", "margin: 0 auto", "padding: center", "align: middle"], "a": 1, "w": "Автоматичні відступи зліва й справа."}], "mins": 45, "id": "box", "terms": [{"t": "Блокова модель", "d": "Кожен елемент — коробка: вміст (content), внутрішній відступ (padding), рамка (border), зовнішній відступ (margin).", "n": 11}, {"t": "padding", "d": "Внутрішній відступ: простір між рамкою і вмістом.", "n": 11}, {"t": "margin", "d": "Зовнішній відступ: простір між елементом і сусідами.", "n": 11}, {"t": "Блочний / рядковий елемент", "d": "Блочний (div, p) займає всю ширину з нового рядка; рядковий (a, span) стоїть у рядку, як слово.", "n": 11}]}, {"n": 12, "block": "css", "title": "Flexbox: розставляємо елементи", "sub": "Головний інструмент сучасної верстки: меню в ряд, центрування, рівні колонки. Все це кількома рядками.", "goals": ["вмикати flex-контейнер", "керувати розташуванням: justify-content, align-items", "використовувати gap, flex-wrap, flex-direction", "робити шапку сайту з логотипом і меню"], "sections": [{"t": "h", "v": "Ідея Flexbox"}, {"t": "p", "v": "Даєш <b>батьку<\/b> <code>display: flex<\/code>, і всі його діти стають в ряд. Далі ти керуєш, як їх розподілити."}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 270\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif'>\n<defs><marker id=\"a2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#F0622E\"/><\/marker><marker id=\"a3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2F6FEB\"/><\/marker><\/defs>\n<rect x=\"60\" y=\"30\" width=\"640\" height=\"180\" rx=\"14\" fill=\"#fff\" stroke=\"#1D1B26\" stroke-width=\"2\"/>\n<text x=\"76\" y=\"56\" font-size=\"14\" font-family='JetBrains Mono, monospace' fill=\"#6B6878\">display: flex<\/text>\n<rect x=\"90\" y=\"80\" width=\"140\" height=\"100\" rx=\"10\" fill=\"#F0622E\"/><text x=\"160\" y=\"137\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"20\" font-weight=\"700\">1<\/text>\n<rect x=\"250\" y=\"80\" width=\"140\" height=\"100\" rx=\"10\" fill=\"#2F6FEB\"/><text x=\"320\" y=\"137\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"20\" font-weight=\"700\">2<\/text>\n<rect x=\"410\" y=\"80\" width=\"140\" height=\"100\" rx=\"10\" fill=\"#E8A400\"/><text x=\"480\" y=\"137\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"20\" font-weight=\"700\">3<\/text>\n<text x=\"240\" y=\"76\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6B6878\">gap<\/text>\n<line x1=\"60\" y1=\"240\" x2=\"700\" y2=\"240\" stroke=\"#F0622E\" stroke-width=\"3\" marker-end=\"url(#a2)\"/><text x=\"380\" y=\"262\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#F0622E\">головна вісь → justify-content<\/text>\n<line x1=\"30\" y1=\"30\" x2=\"30\" y2=\"210\" stroke=\"#2F6FEB\" stroke-width=\"3\" marker-end=\"url(#a3)\"/><text x=\"20\" y=\"120\" font-size=\"15\" font-weight=\"700\" fill=\"#2F6FEB\" transform=\"rotate(-90 20 120)\" text-anchor=\"middle\">поперечна → align-items<\/text>\n<\/svg>", "cap": "Дві осі: головна (за замовчуванням горизонтальна) і поперечна."}, {"t": "table", "head": ["Властивість (для батька)", "Значення", "Що робить"], "rows": [["<code>justify-content<\/code>", "flex-start, center, space-between, space-around", "Розподіл уздовж головної осі"], ["<code>align-items<\/code>", "stretch, center, flex-start, flex-end", "Вирівнювання по поперечній осі"], ["<code>gap<\/code>", "16px", "Відстань між дітьми"], ["<code>flex-direction<\/code>", "row, column", "Напрям: рядок чи стовпчик"], ["<code>flex-wrap<\/code>", "wrap", "Переносити на новий рядок, якщо не вміщається"]]}, {"t": "try", "v": "<style>\n  .row {\n    display: flex;\n    justify-content: space-between;  /* спробуй: center, flex-end, space-around */\n    align-items: center;             /* спробуй: flex-start, flex-end */\n    gap: 12px;\n    height: 160px;\n    background: #fff; border: 2px dashed #9c98a8; padding: 10px;\n  }\n  .item { background: #f0622e; color: white; padding: 20px; border-radius: 10px; font: bold 20px sans-serif; }\n  .item:nth-child(2) { background: #2f6feb; padding: 40px 20px; }\n  .item:nth-child(3) { background: #e8a400; }\n<\/style>\n<div class=\"row\">\n  <div class=\"item\">1<\/div>\n  <div class=\"item\">2<\/div>\n  <div class=\"item\">3<\/div>\n<\/div>", "title": "Пісочниця Flexbox: міняй значення"}, {"t": "h", "v": "Класична шапка сайту"}, {"t": "code", "lang": "html", "v": "<style>\n  header {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    padding: 16px 24px;\n    background: #1d1b26;\n    color: white;\n    font-family: sans-serif;\n  }\n  nav { display: flex; gap: 20px; }\n  nav a { color: white; text-decoration: none; }\n  nav a:hover { color: #e8a400; }\n<\/style>\n<header>\n  <strong>📚 Моя полиця<\/strong>\n  <nav>\n    <a href=\"#\">Колекція<\/a>\n    <a href=\"#\">Додати<\/a>\n    <a href=\"#\">Про мене<\/a>\n  <\/nav>\n<\/header>", "run": true, "title": null, "note": null}, {"t": "h", "v": "Ідеальне центрування"}, {"t": "code", "lang": "css", "v": ".center {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  min-height: 100vh;   /* на весь екран */\n}", "run": false, "title": null, "note": null}, {"t": "p", "v": "Для дітей є властивість <code>flex: 1<\/code>: «займи все вільне місце». Якщо всім дітям дати <code>flex: 1<\/code>, вони стануть рівними колонками."}, {"t": "tip", "v": "Найкращий спосіб вивчити Flexbox — гра <a href='https://flexboxfroggy.com/#uk' target='_blank'>Flexbox Froggy<\/a> (є українською!) 🐸"}], "project": "Зроби шапку полиці на Flexbox (логотип зліва, меню справа). Карткам колекції дай батька <code>.cards<\/code> з <code>display: flex; flex-wrap: wrap; gap: 20px<\/code>.", "check": ["F12 → Elements: біля flex-контейнера є значок <b>flex<\/b>. Клацни, і побачиш лінії-напрямні", "Звузь вікно браузера: картки переносяться на новий рядок?", "Спробуй змінювати justify-content прямо в DevTools: там є візуальний редактор (іконка біля display: flex)"], "hw": [{"lvl": "Базовий", "v": "Пройди всі 24 рівні Flexbox Froggy. Скріншот фінального екрана."}, {"lvl": "Середній", "v": "Зверстай «картку профілю»: аватар зліва, ім'я та опис справа, внизу 3 кнопки в ряд."}, {"lvl": "Зірочка ⭐", "v": "Зроби футер на Flexbox з трьома колонками, які на вузькому екрані стають одна під одною (підказка: flex-wrap і flex: 1 1 200px)."}], "quiz": [{"q": "Кому пишемо display: flex?", "o": ["Кожній дитині", "Батьківському контейнеру", "Тегу body завжди", "Лише картинкам"], "a": 1, "w": "Flex вмикається на батьку."}, {"q": "Як розкидати елементи по краях з рівними проміжками?", "o": ["justify-content: center", "justify-content: space-between", "align-items: stretch", "gap: auto"], "a": 1, "w": "space-between — перший і останній притиснуті до країв."}, {"q": "Що робить flex-wrap: wrap?", "o": ["Ховає елементи", "Переносить елементи на новий рядок, якщо не вміщаються", "Обгортає рамкою", "Повертає на 90°"], "a": 1, "w": "wrap = переносити."}], "mins": 45, "id": "flex", "terms": [{"t": "Flexbox", "d": "Спосіб розставити елементи в рядок або стовпчик і керувати відстанями та вирівнюванням.", "n": 12}, {"t": "Flex-контейнер", "d": "Батьківський елемент з display: flex. Його діти — flex-елементи.", "n": 12}]}, {"n": 13, "block": "css", "title": "CSS Grid: сітка сторінки", "sub": "Сітки для галерей, карток і цілих макетів сторінок. Grid — найпотужніший інструмент верстки.", "goals": ["створювати сітку з колонками й рядками", "використовувати fr, repeat, minmax, auto-fill", "розтягувати елементи на кілька клітинок", "будувати макет сторінки через grid-template-areas"], "sections": [{"t": "h", "v": "CSS Grid: сітка одним рядком"}, {"t": "code", "lang": "html", "v": "<style>\n  .cards {\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));\n    gap: 16px;\n    font-family: sans-serif;\n  }\n  .card { background: #dce8ff; padding: 30px 10px; border-radius: 12px; text-align: center; }\n<\/style>\n<div class=\"cards\">\n  <div class=\"card\">1<\/div><div class=\"card\">2<\/div><div class=\"card\">3<\/div>\n  <div class=\"card\">4<\/div><div class=\"card\">5<\/div><div class=\"card\">6<\/div>\n<\/div>", "run": true, "title": null, "note": "«Скільки влізе колонок, але кожна мінімум 160px». Зміни ширину вікна: кількість колонок зміниться сама!"}, {"t": "tip", "v": "Flexbox — для рядка/стовпчика (меню, шапка). Grid — для сітки у двох напрямках (галерея, картки)."}, {"t": "h", "v": "Колонки й одиниця fr"}, {"t": "code", "lang": "html", "v": "<style>\n  .layout {\n    display: grid;\n    grid-template-columns: 200px 1fr 1fr;   /* фіксована + дві рівні частки */\n    gap: 10px;\n    font-family: sans-serif;\n  }\n  .layout div { background: #fff3cc; padding: 20px; border-radius: 10px; }\n  .wide { grid-column: span 2; background: #ffe3d6 !important; }  /* займає 2 колонки */\n<\/style>\n<div class=\"layout\">\n  <div>200px<\/div><div>1fr<\/div><div>1fr<\/div>\n  <div class=\"wide\">span 2<\/div><div>1<\/div>\n<\/div>", "run": true, "title": null, "note": "<b>fr<\/b> (fraction) — частка вільного місця. <code>1fr 2fr<\/code> = друга колонка вдвічі ширша."}, {"t": "h", "v": "Макет сторінки через області"}, {"t": "code", "lang": "html", "v": "<style>\n  .page {\n    display: grid;\n    grid-template-areas:\n      \"header header\"\n      \"aside  main\"\n      \"footer footer\";\n    grid-template-columns: 160px 1fr;\n    gap: 8px; min-height: 260px; font: bold 15px sans-serif;\n  }\n  header { grid-area: header; background: #ffe3d6; }\n  aside  { grid-area: aside;  background: #fff3cc; }\n  main   { grid-area: main;   background: #dce8ff; }\n  footer { grid-area: footer; background: #d7f5e3; }\n  .page > * { padding: 14px; border-radius: 10px; }\n<\/style>\n<div class=\"page\">\n  <header>header<\/header><aside>aside<\/aside><main>main<\/main><footer>footer<\/footer>\n<\/div>", "run": true, "title": null, "note": "Ти буквально «малюєш» макет словами! Зміни розташування областей і запусти ще раз."}, {"t": "try", "v": "<style>\n  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }\n  .gallery div { background: #2f6feb; color: #fff; height: 80px; border-radius: 10px;\n                 display: grid; place-items: center; font: bold 20px sans-serif; }\n  .big { grid-column: span 2; grid-row: span 2; height: auto !important; background: #f0622e !important; }\n<\/style>\n<div class=\"gallery\">\n  <div class=\"big\">1<\/div><div>2<\/div><div>3<\/div><div>4<\/div><div>5<\/div><div>6<\/div>\n<\/div>", "title": "Галерея з великим фото"}, {"t": "tip", "v": "Тренажер: <a href='https://cssgridgarden.com/#uk' target='_blank'>Grid Garden<\/a> (українською) 🥕"}], "project": "Переведи сітку карток колекції на Grid з <code>repeat(auto-fill, minmax(220px, 1fr))<\/code>. Першу картку («Улюблене») зроби на 2 колонки.", "check": ["F12 → Elements: біля контейнера значок <b>grid<\/b>. Клацни — побачиш лінії сітки з номерами", "Звузь вікно: кількість колонок змінюється сама", "Немає горизонтальної прокрутки"], "hw": [{"lvl": "Базовий", "v": "Пройди 12 рівнів Grid Garden."}, {"lvl": "Середній", "v": "Макет сторінки блогу через grid-template-areas: шапка, меню зліва, стаття, бічна панель, футер."}, {"lvl": "Зірочка ⭐", "v": "Пройди всі 28 рівнів Grid Garden."}], "quiz": [
