\" stroke=\"#18A058\" stroke-width=\"2\"/><text x=\"645\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"#1D1B26\">База даних<\/text><text x=\"645\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6B6878\">таблиці, що<\/text><text x=\"645\" y=\"140\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6B6878\">зберігаються назавжди<\/text>\n<line x1=\"218\" y1=\"98\" x2=\"275\" y2=\"98\" stroke=\"#1D1B26\" stroke-width=\"2\" marker-end=\"url(#a4)\"/><line x1=\"277\" y1=\"132\" x2=\"220\" y2=\"132\" stroke=\"#1D1B26\" stroke-width=\"2\" marker-end=\"url(#a4)\"/>\n<line x1=\"483\" y1=\"98\" x2=\"540\" y2=\"98\" stroke=\"#1D1B26\" stroke-width=\"2\" marker-end=\"url(#a4)\"/><line x1=\"542\" y1=\"132\" x2=\"485\" y2=\"132\" stroke=\"#1D1B26\" stroke-width=\"2\" marker-end=\"url(#a4)\"/>\n<text x=\"247\" y=\"210\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1D1B26\">fetch → JSON<\/text><text x=\"512\" y=\"210\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1D1B26\">SQL<\/text>\n<text x=\"380\" y=\"30\" text-anchor=\"middle\" font-size=\"14\" fill=\"#6B6878\">Повний стек: що бачить користувач → хто приймає рішення → де лежать дані<\/text>\n<text x=\"380\" y=\"240\" text-anchor=\"middle\" font-size=\"13\" fill=\"#18A058\">Supabase = готовий бекенд + база в одному<\/text>\n<\/svg>", "cap": "Повний стек: твоя сторінка → API Supabase → база PostgreSQL. Так працюють реальні продукти."}], "project": "Підключи полицю до Supabase: завантаження з бази, додавання, стани «Завантаження…» і помилки. Додай у таблицю 5+ записів з різних пристроїв (школа, дім, телефон друга).", "check": ["Network → Fetch/XHR: запит до <code>supabase.co/rest/v1/items<\/code> зі статусом 200", "Додай річ із телефона → онови на комп'ютері → вона є", "Порожня сторінка й <code>[]<\/code> у відповіді? Перевір політику RLS для select", "Помилка <code>row-level security<\/code> при додаванні = нема політики insert"], "hw": [{"lvl": "Обов'язково", "v": "Полиця працює з базою. Попроси 3 однокласників додати по одній речі на твою полицю."}, {"lvl": "Середній", "v": "Додай видалення: політика <code>for delete<\/code> і кнопка на картці."}, {"lvl": "Зірочка ⭐", "v": "Додай сторінку статистики: кількість за категоріями, середня оцінка, топ-3. Дані з бази."}, {"lvl": "Підготовка", "v": "Наступного уроку — <b>Контрольна №5: дані й бекенд<\/b>. Повтори уроки 29–33."}], "quiz": [{"q": "Який ключ Supabase можна використовувати в браузері?", "o": ["Secret key", "Publishable key", "Пароль бази", "Жоден"], "a": 1, "w": "Publishable — для клієнта, права обмежує RLS."}, {"q": "Що таке RLS?", "o": ["Мова програмування", "Правила, хто може читати й змінювати рядки таблиці", "Тип бази", "Шифрування"], "a": 1, "w": "Row Level Security."}, {"q": "Що аналогічне db.from('items').select('*')?", "o": ["delete from items", "select * from items", "insert into items", "create table items"], "a": 1, "w": "Те саме, але через JavaScript."}], "mins": 90, "id": "supa", "terms": [{"t": "Ключ API", "d": "Секретний або публічний рядок, яким програма представляється сервісу. Secret key — ніколи у фронтенді!", "n": 33}, {"t": "RLS", "d": "Row Level Security — правила в базі, хто може читати й змінювати рядки таблиці.", "n": 33}]}, {"n": 34, "block": "ai", "title": "Git і GitHub: історія коду й командна робота", "sub": "Машина часу для коду, синхронізація школа ↔ дім і робота в команді. Інструмент, яким користується кожен програміст у світі.", "goals": ["пояснити, що таке репозиторій, коміт, push і pull", "працювати з GitHub Desktop або з терміналу", "писати гарні повідомлення комітів", "використовувати .gitignore і README"], "sections": [{"t": "h", "v": "Навіщо Git"}, {"t": "cards", "v": [{"i": "⏪", "h": "Машина часу", "p": "Зламав щось? Повертаєшся до будь-якої попередньої версії."}, {"i": "🏠", "h": "Школа ↔ дім", "p": "Один репозиторій на GitHub, з якого працюєш з будь-якого комп'ютера."}, {"i": "👥", "h": "Команда", "p": "Кілька людей працюють над одним проєктом і не затирають роботу одне одного."}]}, {"t": "h", "v": "Основні поняття"}, {"t": "code", "lang": "text", "v": "  твоя папка          Git (локально)           GitHub (хмара)\n  ──────────          ──────────────           ──────────────\n  змінив файли  ──→   commit (знімок)   ──→    push (надіслати)\n                                        ←──    pull (забрати)", "run": false, "title": "Шлях змін", "note": null}, {"t": "h", "v": "Варіант 1: GitHub Desktop (кнопками)"}, {"t": "steps", "v": ["Встанови <a href='https://desktop.github.com' target='_blank'>GitHub Desktop<\/a>, увійди в GitHub.", "<b>File → Add local repository<\/b> → обери папку полиці → якщо пропонує, <b>create a repository<\/b>.", "Змінені файли видно зліва. Внизу напиши повідомлення («Додав пошук») → <b>Commit to main<\/b>.", "<b>Publish repository<\/b> (перший раз) або <b>Push origin<\/b>.", "Вдома: <b>File → Clone repository<\/b>. Далі щоразу перед роботою: <b>Fetch → Pull<\/b>."]}, {"t": "h", "v": "Варіант 2: термінал"}, {"t": "code", "lang": "bash", "v": "git init                          # почати стежити за папкою\ngit add .                         # підготувати всі зміни\ngit commit -m \"Додав пошук\"       # зробити знімок\ngit log --oneline                 # історія комітів\n\ngit remote add origin https://github.com/логін/polytsia.git\ngit push -u origin main           # надіслати на GitHub (перший раз)\ngit push                          # далі — просто так\ngit pull                          # забрати зміни з GitHub", "run": false, "title": "Термінал VS Code", "note": null}, {"t": "tip", "v": "У VS Code є вкладка <b>Source Control<\/b> (<kbd>Ctrl<\/kbd>+<kbd>Shift<\/kbd>+<kbd>G<\/kbd>): ті самі коміти й push кнопками, не виходячи з редактора."}, {"t": "h", "v": "Гарний коміт"}, {"t": "table", "head": ["❌ Погано", "✅ Добре"], "rows": [["«fix»", "«Виправив пошук: тепер не залежить від регістру»"], ["«asdf»", "«Додав темну тему»"], ["«зміни» (50 файлів)", "Маленькі коміти: одна зміна — один коміт"]]}, {"t": "h", "v": ".gitignore і README"}, {"t": "code", "lang": "text", "v": "node_modules/\n.env\n.DS_Store", "run": false, "title": ".gitignore — що НЕ завантажувати", "note": "<code>node_modules<\/code> — тисячі файлів бібліотек (їх можна встановити знову через npm install). <code>.env<\/code> — секрети. Вони ніколи не мають потрапити на GitHub!"}, {"t": "code", "lang": "text", "v": "# 📚 Полиця Олекси\nМоя колекція улюблених ігор з оцінками й пошуком.\n\n**Сайт:** https://логін.github.io/polytsia\n**Технології:** HTML, CSS, JavaScript, Supabase\n\n![Скріншот](images/screenshot.png)", "run": false, "title": "README.md", "note": null}, {"t": "warn", "v": "Публічний репозиторій бачить увесь світ. Перед push перевір: жодних паролів, secret key, особистих даних."}], "project": "Створи репозиторій полиці на GitHub, додай <code>.gitignore<\/code> і <code>README.md<\/code>. Зроби мінімум 3 осмислені коміти. Склонуй репозиторій вдома (або на іншому комп'ютері) і зроби звідти ще один коміт.", "check": ["GitHub → вкладка <b>Commits<\/b>: видно всі коміти з повідомленнями", "Клацни на коміт — зеленим додане, червоним видалене", "На GitHub нема папки node_modules і файлу .env"], "hw": [{"lvl": "Базовий", "v": "Пройди перші 2 розділи <a href='https://learngitbranching.js.org/?locale=uk' target='_blank'>Learn Git Branching<\/a> (є українською)."}, {"lvl": "Середній", "v": "Поверни один файл до попередньої версії через історію (GitHub Desktop → History → правий клік → Revert)."}, {"lvl": "Зірочка ⭐", "v": "Попрацюйте в парі в одному репозиторії: кожен створює гілку (branch), робить зміни і відкриває Pull Request."}], "quiz": [{"q": "Що таке коміт?", "o": ["Файл", "Збережений знімок змін з описом", "Сайт", "Помилка"], "a": 1, "w": "Commit — знімок."}, {"q": "Що робить git push?", "o": ["Забирає зміни з GitHub", "Надсилає коміти на GitHub", "Видаляє репозиторій", "Створює файл"], "a": 1, "w": "Push = надіслати."}, {"q": "Що має бути в .gitignore?", "o": ["index.html", "node_modules і .env", "README.md", "style.css"], "a": 1, "w": "Бібліотеки й секрети."}], "mins": 45, "id": "git", "terms": [{"t": "Git", "d": "Система контролю версій: запам'ятовує всі зміни в коді, щоб можна було повернутися назад.", "n": 34}, {"t": "Репозиторій", "d": "Папка проєкту під наглядом Git з усією історією змін. На GitHub — її копія в хмарі.", "n": 34}, {"t": "Коміт", "d": "Збережений «знімок» проєкту з коротким описом, що змінилося.", "n": 34}, {"t": "Push / Pull", "d": "Push — надіслати свої коміти на GitHub, Pull — забрати звідти нові зміни.", "n": 34}]}, {"n": 35, "block": "ai", "title": "AI — твій напарник-програміст", "sub": "Як AI допомагає писати код, шукати помилки й вчитися швидше. І головне: як не дати йому думати замість тебе.", "goals": ["пояснити, що вміє і чого не вміє мовна модель", "писати якісні запити (промпти) до AI", "перевіряти й розуміти код від AI", "дотримуватися правил безпеки й доброчесності"], "sections": [{"t": "h", "v": "Що таке AI-асистент"}, {"t": "p", "v": "ChatGPT, Claude, Gemini, Copilot — це <b>великі мовні моделі<\/b>. Вони навчалися на величезній кількості текстів і коду, тому добре вгадують, яка відповідь найімовірніше підійде. Але вони <b>не знають<\/b> твого проєкту, якщо ти його не показав, і можуть <b>впевнено помилятися<\/b>."}, {"t": "cards", "v": [{"i": "✅", "h": "AI добре вміє", "p": "Пояснювати код і помилки, пропонувати варіанти, писати шаблонний код, генерувати тестові дані, перекладати документацію."}, {"i": "⚠️", "h": "AI може помилятися", "p": "Вигадувати неіснуючі функції, писати застарілий код, не помічати логічних помилок, «погоджуватися» з тобою."}, {"i": "🧠", "h": "Що робиш ти", "p": "Ставиш задачу, перевіряєш, розумієш, вирішуєш. Відповідальність за код — твоя."}]}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif' font-weight=\"700\" font-size=\"15\">\n<defs><marker id=\"a6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8B5CF6\"/><\/marker><\/defs>\n<g fill=\"none\" stroke=\"#8B5CF6\" stroke-width=\"2.5\" marker-end=\"url(#a6)\"><path d=\"M190 70 Q 300 20 400 60\"/><path d=\"M560 90 Q 640 130 580 185\"/><path d=\"M420 215 Q 330 245 230 210\"/><path d=\"M110 180 Q 60 130 110 90\"/><\/g>\n<rect x=\"40\" y=\"40\" width=\"160\" height=\"60\" rx=\"30\" fill=\"#8B5CF6\"/><text x=\"120\" y=\"66\" text-anchor=\"middle\" fill=\"#fff\">1. Опиши задачу<\/text><text x=\"120\" y=\"86\" text-anchor=\"middle\" fill=\"#EDE5FF\" font-size=\"12\" font-weight=\"400\">контекст + мета<\/text>\n<rect x=\"400\" y=\"40\" width=\"200\" height=\"60\" rx=\"30\" fill=\"#fff\" stroke=\"#8B5CF6\" stroke-width=\"2\"/><text x=\"500\" y=\"66\" text-anchor=\"middle\" fill=\"#1D1B26\">2. Отримай відповідь<\/text><text x=\"500\" y=\"86\" text-anchor=\"middle\" fill=\"#6B6878\" font-size=\"12\" font-weight=\"400\">код + пояснення<\/text>\n<rect x=\"430\" y=\"180\" width=\"200\" height=\"60\" rx=\"30\" fill=\"#fff\" stroke=\"#8B5CF6\" stroke-width=\"2\"/><text x=\"530\" y=\"206\" text-anchor=\"middle\" fill=\"#1D1B26\">3. Прочитай і запусти<\/text><text x=\"530\" y=\"226\" text-anchor=\"middle\" fill=\"#6B6878\" font-size=\"12\" font-weight=\"400\">чи я розумію кожен рядок?<\/text>\n<rect x=\"40\" y=\"170\" width=\"190\" height=\"60\" rx=\"30\" fill=\"#fff\" stroke=\"#8B5CF6\" stroke-width=\"2\"/><text x=\"135\" y=\"196\" text-anchor=\"middle\" fill=\"#1D1B26\">4. Уточни / виправ<\/text><text x=\"135\" y=\"216\" text-anchor=\"middle\" fill=\"#6B6878\" font-size=\"12\" font-weight=\"400\">помилка? покажи її AI<\/text>\n<text x=\"330\" y=\"140\" text-anchor=\"middle\" fill=\"#8B5CF6\" font-size=\"17\">Ти — капітан, AI — штурман<\/text>\n<\/svg>", "cap": "Цикл роботи з AI. Головне — крок 3: ніколи не вставляй код, який не розумієш."}, {"t": "h", "v": "Анатомія хорошого промпту"}, {"t": "table", "head": ["Частина", "Приклад"], "rows": [["<b>Контекст<\/b>: хто ти й що робиш", "«Я учень 8 класу, вчу JavaScript. Роблю сайт-каталог ігор.»"], ["<b>Задача<\/b>: що потрібно", "«Додай сортування карток за оцінкою.»"], ["<b>Матеріал<\/b>: код, помилка", "«Ось моя функція render(): …»"], ["<b>Обмеження<\/b>", "«Без бібліотек, лише чистий JS, який ми вчили.»"], ["<b>Формат відповіді<\/b>", "«Поясни кожен рядок простими словами.»"]]}, {"t": "code", "lang": "text", "v": "❌ Погано:\n   зроби сайт\n\n❌ Погано:\n   не працює код\n\n✅ Добре:\n   Я вчу JavaScript (рівень: масиви, функції, DOM).\n   Моя полиця має масив items з полями title і rating.\n   Ось функція render(): [код]\n   Хочу додати select «Сортувати: за оцінкою / за назвою».\n   Не пиши весь файл, покажи лише, що додати, і поясни,\n   як працює sort з функцією порівняння.", "run": false, "title": "Порівняй", "note": null}, {"t": "h", "v": "Сценарії, де AI реально допомагає"}, {"t": "table", "head": ["Сценарій", "Промпт"], "rows": [["🐞 Помилка", "«Ось помилка з консолі: [текст]. Ось код: [код]. Поясни, ЧОМУ вона виникає, і як виправити.»"], ["📖 Незрозумілий код", "«Поясни цей рядок, як для 13-річного: <code>items.filter(i =&gt; i.rating &gt; 3)<\/code>»"], ["🔍 Рев'ю", "«Знайди в моєму коді 3 місця, які можна покращити, але не переписуй — лише підкажи.»"], ["🎲 Тестові дані", "«Згенеруй SQL insert на 15 українських книжок з полями title, author, rating.»"], ["🎓 Вчитель", "«Не давай відповідь. Став мені навідні питання, щоб я сам знайшов помилку.»"]]}, {"t": "idea", "v": "Найсильніший прийом — режим вчителя: попроси AI <b>не давати готового рішення<\/b>, а підводити питаннями. Ти навчишся вдвічі швидше."}, {"t": "h", "v": "Правила безпеки й чесності"}, {"t": "list", "v": ["🔑 <b>Ніколи<\/b> не вставляй у чат паролі, secret key, особисті дані (свої й чужі).", "🧪 Будь-який код від AI спочатку запусти й перевір у DevTools.", "🙋 Чесність: у проєкті познач, що зроблено з допомогою AI (коментар <code>// з допомогою AI: …<\/code>). Використовувати AI — нормально, приховувати — ні.", "🎯 Тест: якщо не можеш пояснити рядок коду своїми словами — він ще не твій. Попроси AI пояснити.", "🔞 У кожного AI-сервісу є вікові обмеження (від 13 до 18 років). Якщо ти молодший — працюй з AI разом із вчителем."]}], "project": "AI-рев'ю полиці: дай AI свій <code>app.js<\/code> з промптом «знайди 3 покращення, не переписуй код». Впровадь мінімум 2 поради <b>сам<\/b>. Запиши в <code>AI-LOG.md<\/code>: промпт, що порадив AI, що ти зробив, чого навчився.", "check": ["Після змін Console порожня й усе працює як раніше", "Ти можеш пояснити вчителю кожен змінений рядок", "AI-LOG.md лежить у папці проєкту"], "hw": [{"lvl": "Базовий", "v": "Попроси AI пояснити 3 найскладніші для тебе рядки з уроку 27. Запиши пояснення своїми словами."}, {"lvl": "Середній", "v": "Додай з допомогою AI одну нову функцію (сортування, кнопка «випадкова річ», підрахунок за категоріями). Задокументуй в AI-LOG.md."}, {"lvl": "Зірочка ⭐", "v": "Знайди випадок, коли AI помилився (вигадав метод, дав код, що не працює). Опиши, як ти це помітив."}], "quiz": [{"q": "Що найважливіше при використанні коду від AI?", "o": ["Скопіювати якомога швидше", "Розуміти й перевіряти кожен рядок", "Просити більше коду", "Нічого не змінювати"], "a": 1, "w": "Відповідальність за код — твоя."}, {"q": "Що НЕ можна вставляти в чат з AI?", "o": ["Повідомлення про помилку", "Свій код з уроку", "Secret key і паролі", "Питання про CSS"], "a": 2, "w": "Секрети — ніколи."}, {"q": "Який промпт найкращий?", "o": ["«зроби сайт»", "«не працює»", "Контекст + задача + код + обмеження + формат відповіді", "Одне слово «допоможи»"], "a": 2, "w": "Чим більше контексту, тим краща відповідь."}], "mins": 45, "id": "ai", "terms": [{"t": "Штучний інтелект (AI)", "d": "Програми, що виконують задачі, які зазвичай вимагають людського мислення: розуміють текст, пишуть код.", "n": 35}, {"t": "Мовна модель (LLM)", "d": "AI, навчений на великій кількості текстів, який продовжує текст найімовірнішою відповіддю. ChatGPT, Claude, го коду.\n\n🎲 ДАНІ\nЗгенеруй SQL insert для таблиці items (title, author, category, rating, review)\nна 20 [книг / ігор / фільмів], переважно українських. category лише:\n'гра', 'книга', 'фільм'. rating від 1 до 5. Відгуки короткі, як писав би підліток.\n\n✨ ФУНКЦІЯ\nХочу додати [опис]. Ось мій render() і масив items: [код].\nДай план у 3–4 кроки. Потім код лише для кроку 1 з поясненням кожного рядка.", "run": false, "title": "Скопіюй і заповни", "note": null}, {"t": "h", "v": "Критерій «зараховано» на кожній станції"}, {"t": "list", "v": ["Ти можеш пояснити вчителю, що змінилось і чому, <b>без підглядання<\/b> в чат.", "Код працює, Console чиста.", "У <code>AI-LOG.md<\/code> є запис: промпт → що відповів AI → що ти прийняв, що відхилив і чому."]}, {"t": "idea", "v": "Помітив, що AI помилився? Це не провал, а найкращий момент уроку! Запиши в AI-LOG.md: що AI сказав, як ти зрозумів, що це неправда, і як знайшов правильну відповідь."}, {"t": "warn", "v": "Тестові дані від AI перевіряй: AI може вигадати книгу, якої не існує, або неправильного автора. Для навчального проєкту це не страшно, але для справжнього — критично."}], "project": "Пройди 4 станції, впровадь результати в полицю і заповни AI-LOG.md (мінімум 4 записи). Зроби коміт «AI-практикум».", "check": ["Нова функція працює й не зламала старі", "Тестові дані з'явились у Supabase, а на сайті 20+ карток", "Console чиста"], "hw": [{"lvl": "Обов'язково", "v": "Заверши станції, які не встиг на уроці."}, {"lvl": "Середній", "v": "Попроси AI пояснити один складний для тебе рядок з уроку 33 трьома різними способами (для 10-річного, через аналогію, технічно). Який зрозуміліший?"}, {"lvl": "Зірочка ⭐", "v": "Додай з AI другу функцію, але цього разу спочатку напиши свій план, а AI попроси лише оцінити його."}], "quiz": [{"q": "Як правильно просити AI допомогти з помилкою?", "o": ["«не працює»", "Помилка з Console + код + прохання пояснити причину", "Надіслати весь проєкт без слів", "«виправ усе»"], "a": 1, "w": "Контекст + lt;div id=\"main\"&gt;", "&lt;main&gt;", "&lt;body&gt;", "&lt;section&gt;"], "a": 1, "w": "Семантика."}, {"q": "Що робить grid-template-columns: repeat(3, 1fr)?", "o": ["3 рядки", "3 рівні колонки", "Колонку 3fr", "3px відступу"], "a": 1, "w": "fr — частка вільного місця."}, {"q": "Як зробити картки адаптивними без media queries?", "o": ["width: 300px", "repeat(auto-fill, minmax(200px, 1fr))", "float: left", "display: table"], "a": 1, "w": "auto-fill + minmax."}, {"q": "Що виведе: const a = [3, 1, 2]; console.log(a.length)?", "o": ["2", "3", "6", "[3, 1, 2]"], "a": 1, "w": "Три елементи."}, {"q": "Що повертає find, якщо нічого не знайдено?", "o": ["null", "false", "undefined", "[]"], "a": 2, "w": "find → undefined."}, {"q": "У нашій архітектурі що викликаємо після зміни масиву items?", "o": ["location.reload()", "render()", "alert()", "Нічого"], "a": 1, "w": "Дані → render → сторінка."}, {"q": "Чим textContent безпечніший за innerHTML?", "o": ["Він швидший", "Не виконує HTML-теги з тексту, введеного людиною", "Він кольоровий", "Нічим"], "a": 1, "w": "Захист від шкідливого коду."}, {"q": "Що таке API?", "o": ["Мова стилів", "Набір адрес і правил, як програма може звертатися до сервера", "База даних", "Браузер"], "a": 1, "w": "«Меню ресторану»."}, {"q": "Що аналогічне SQL select * from items where rating = 5 у supabase-js?", "o": ["db.from('items').select('*').eq('rating', 5)", "db.items.get(5)", "fetch('items=5')", "db.delete('items')"], "a": 0, "w": ".eq = «дорівнює»."}, {"q": "Що станеться з даними в localStorage, якщо відкрити сайт на іншому комп'ютері?", "o": ["Вони там будуть", "Їх там не буде", "Вони видаляться всюди", "Вони перенесуться через Wi-Fi"], "a": 1, "w": "localStorage — лише цей браузер."}, {"q": "AI дав код, який ти не розумієш. Що робити?", "o": ["Вставити й здати", "Попросити AI пояснити кожен рядок і перевірити в DevTools", "Видалити проєкт", "Попросити ще більше коду"], "a": 1, "w": "Розуміння — твоя відповідальність."}, {"q": "Чим AI-агент (Claude Code, Replit Agent) відрізняється від чату?", "o": ["Він безкоштовний", "Сам читає, змінює файли й запускає команди", "Не може помилятися", "Працює лише з Python"], "a": 1, "w": "Агент діє."}, {"q": "Що можна опублікувати на GitHub Pages?", "o": ["Express-сервер", "Статичний сайт (HTML/CSS/JS)", "PostgreSQL", "Будь-що"], "a": 1, "w": "Лише статика."}, {"q": "Сайт працює локально, а на GitHub Pages картинка не завантажується (404). Найімовірніша причина?", "o": ["Повільний інтернет", "Різний регістр у назві: Cat.PNG і cat.png", "GitHub не підтримує картинки", "Забагато CSS"], "a": 1, "w": "Сервер розрізняє великі й малі літери."}], "n": 6, "after": 38, "title": "Підсумкова контрольна", "sub": "Увесь курс · 15 питань · 30 хвилин", "from": 34}], "pages": {"tools": {"title": "Де працювати і як усе налаштувати", "sub": "Однакове середовище в школі й удома. Усе безкоштовне.", "sections": [{"t": "h", "v": "Короткий список"}, {"t": "table", "head": ["Інструмент", "Для чого", "Коли знадобиться"], "rows": [["<b>VS Code<\/b> + Live Server", "Редактор коду + автооновлення сторінки", "З уроку 1"], ["<b>Chrome<\/b> / Edge / Firefox", "Перегляд і перевірка сторінки (DevTools)", "З уроку 1"], ["<b>GitHub<\/b>", "Зберігання коду, синхронізація школа ↔ дім, публікація сайту", "Бажано з уроку 1, обов'язково з уроку 37"], ["<b>Node.js<\/b> (LTS)", "Запуск власного сервера", "Урок 32"], ["<b>Supabase<\/b>", "Хмарна база даних", "Уроки 29, 33"], ["<b>AI-асистент<\/b>", "Помічник: пояснення, пошук помилок", "Уроки 35–37"]]}, {"t": "h", "v": "1. VS Code — головний редактор"}, {"t": "steps", "v": ["Завантаж з <a href='https://code.visualstudio.com' target='_blank'>code.visualstudio.com<\/a> (Windows, macOS, Linux) і встанови з галочками за замовчуванням. На Windows додатково постав <b>«Add to PATH»<\/b> і <b>«Open with Code»<\/b>.", "Відкрий вкладку <b>Extensions<\/b> (<kbd>Ctrl<\/kbd>+<kbd>Shift<\/kbd>+<kbd>X<\/kbd>) і встанови розширення: <b>Live Server<\/b> (Ritwick Dey), <b>Prettier<\/b> (форматує код), <b>Error Lens<\/b> (показує помилки прямо в рядку), за бажанням <b>Ukrainian Language Pack<\/b>.", "<b>File → Preferences → Settings<\/b> → знайди <i>Auto Save<\/i> → <code>afterDelay<\/code>. Тепер файли зберігаються самі.", "Там же знайди <i>Format On Save<\/i> і увімкни, а <i>Default Formatter<\/i> → Prettier. Код завжди буде охайним.", "Перевірка: створи папку, файл <code>index.html<\/code>, напиши <code>!<\/code> + <kbd>Tab<\/kbd>, потім правий клік → <b>Open with Live Server<\/b>. Відкрилось у браузері за адресою <code>127.0.0.1:5500<\/code>? Готово ✅"]}, {"t": "table", "head": ["Гаряча клавіша", "Дія"], "rows": [["<kbd>Ctrl<\/kbd>+<kbd>S<\/kbd>", "Зберегти"], ["<kbd>Ctrl<\/kbd>+<kbd>/<\/kbd>", "Закоментувати рядок"], ["<kbd>Alt<\/kbd>+<kbd>↑/↓<\/kbd>", "Перемістити рядок"], ["<kbd>Shift<\/kbd>+<kbd>Alt<\/kbd>+<kbd>↓<\/kbd>", "Дублювати рядок"], ["<kbd>Ctrl<\/kbd>+<kbd>D<\/kbd>", "Виділити наступне таке саме слово (мультикурсор)"], ["<kbd>Ctrl<\/kbd>+<kbd>`<\/kbd>", "Відкрити термінал"], ["<kbd>Ctrl<\/kbd>+<kbd>P<\/kbd>", "Швидко відкрити файл за назвою"]]}, {"t": "tip", "v": "На macOS замість <kbd>Ctrl<\/kbd> — <kbd>Cmd<\/kbd>, замість <kbd>Alt<\/kbd> — <kbd>Option<\/kbd>."}, {"t": "h", "v": "2. Як працювати однаково в школі й удома"}, {"t": "cards", "v": [{"i": "⭐", "h": "Варіант А: GitHub (рекомендуємо)", "p": "Проєкт живе в репозиторії. У школі: зробив зміни → Commit → Push. Удома: Pull → працюєш далі. Зручно через <b>GitHub Desktop<\/b> (desktop.github.com) — кнопки замість команд."}, {"i": "☁️", "h": "Варіант Б: хмарний диск", "p": "Папка проєкту в Google Drive / OneDrive. Простіше, але легко отримати дві різні версії файлу. Не відкривай проєкт одночасно у двох місцях."}, {"i": "💾", "h": "Варіант В: флешка", "p": "Працює завжди, навіть без інтернету. Мінус: забув флешку — забув проєкт. Роби копію в хмару."}]}, {"t": "steps", "v": ["Зареєструйся на <a href='https://github.com' target='_blank'>github.com<\/a> (від 13 років; молодші працюють через акаунт вчителя або Варіант Б).", "Встанови <b>GitHub Desktop<\/b>, увійди в акаунт.", "<b>File → New repository<\/b> → Name: <code>polytsia<\/code>, Local path — де зберігати → Create.", "Відкрий папку у VS Code, працюй. Повернись у GitHub Desktop: бачиш змінені файли → внизу напиши, що зробив («урок 6: додав стилі») → <b>Commit to main<\/b> → <b>Publish / Push origin<\/b>.", "На іншому комп'ютері: <b>File → Clone repository<\/b> → обери <code>polytsia<\/code>. Далі щоразу перед роботою натискай <b>Fetch / Pull origin<\/b>."]}, {"t": "warn", "v": "Золоте правило синхронізації: <b>почав роботу — Pull, закінчив — Commit + Push<\/b>. Тоді вдома завжди буде шкільна версія, і навпаки."}, {"t": "h", "v": "3. Якщо не можна нічого встановлювати"}, {"t": "table", "head": ["Сервіс", "Що дає", "Обмеження"], "rows": [["<a href='https://vscode.dev' target='_blank'>vscode.dev<\/a>", "VS Code прямо в браузері. Відкриває папку на комп'ютері (Chrome/Edge) або репозиторій з GitHub", "Нема терміналу й Live Server"], ["<a href='https://github.com/codespaces' target='_blank'>GitHub Codespaces<\/a>", "Повний VS Code у хмарі з терміналом, Node.js і переглядом сайту", "Безкоштовний ліміт годин на місяць, потрібен акаунт GitHub"], ["<a href='https://codepen.io' target='_blank'>CodePen<\/a>", "Швидкі експерименти: HTML, CSS, JS у трьох вікнах, результат одразу", "Для одного «шматочка», не для всього проєкту"], ["Пісочниці цього курсу", "Блоки «Спробуй сам» в уроках", "Нема інтернету й файлів, лише для вправ"]]}, {"t": "h", "v": "4. Node.js (урок 32)"}, {"t": "steps", "v": ["<a href='https://nodejs.org' target='_blank'>nodejs.org<\/a> → завантаж версію <b>LTS<\/b> → встанови з налаштуваннями за замовчуванням (потрібні права адміністратора).", "Перезапусти VS Code, відкрий термінал (<kbd>Ctrl<\/kbd>+<kbd>`<\/kbd>) і виконай <code>node -v<\/code> і <code>npm -v<\/code>. Мають з'явитися номери версій.", "Якщо на шкільних ПК встановити не можна — відкрий репозиторій у <b>GitHub Codespaces<\/b>: Node.js там уже є."]}, {"t": "h", "v": "5. Supabase (урок 29)"}, {"t": "p", "v": "<a href='https://supabase.com' target='_blank'>supabase.com<\/a> → <b>Start your project<\/b> → увійти через GitHub → New project. Регіон — Central EU (Frankfurt). Пароль бази запиши в надійне місце (не в код!). Безкоштовний проєкт засинає після тижня без активності — розбуди кнопкою Restore."}, {"t": "h", "v": "6. Телефон"}, {"t": "p", "v": "Повноцінно програмувати на телефоні незручно, але <b>перевіряти<\/b> сайт — обов'язково. Після публікації на GitHub Pages відкривай свою полицю з телефона. А ще у VS Code Live Server можна відкрити з телефона в тій самій Wi-Fi мережі за IP комп'ютера (наприклад, <code>http://192.168.0.15:5500<\/code>)."}, {"t": "h", "v": "7. AI-асистенти (уроки 35–37)"}, {"t": "p", "v": "Claude, ChatGPT, Gemini, GitHub Copilot. У кожного сервісу свої умови та <b>вікові обмеження<\/b> (від 13 до 18 років залежно від сервісу й країни). Учні, яким ще не можна, працюють з AI разом із вчителем на спільному екрані. Агенти (Claude Code, Replit Agent) потребують акаунта й часто платної підписки — на уроці 37 їх показує вчитель."}]}, "browser": {"title": "Як працювати й перевіряти сторінку в браузері", "sub": "DevTools — рентген, лабораторія і детектор помилок в одному. Тримай цю сторінку під рукою.", "sections": [{"t": "fig", "v": "<svg viewBox=\"0 0 760 270\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif'>\n<rect x=\"10\" y=\"10\" width=\"740\" height=\"250\" rx=\"14\" fill=\"#fff\" stroke=\"#1D1B26\" stroke-width=\"2\"/>\n<rect x=\"10\" y=\"10\" width=\"380\" height=\"250\" rx=\"14\" fill=\"#FBF8F3\"/><text x=\"30\" y=\"44\" font-size=\"15\" font-weight=\"700\" fill=\"#1D1B26\">Твоя сторінка<\/text><rect x=\"30\" y=\"60\" width=\"200\" height=\"16\" rx=\"8\" fill=\"#1D1B26\"/><rect x=\"30\" y=\"90\" width=\"330\" height=\"70\" rx=\"10\" fill=\"#DCE8FF\" stroke=\"#2F6FEB\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><text x=\"195\" y=\"130\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F6FEB\">виділений елемент<\/text><rect x=\"30\" y=\"175\" width=\"160\" height=\"60\" rx=\"10\" fill=\"#FFE3D6\"/><rect x=\"200\" y=\"175\" width=\"160\" height=\"60\" rx=\"10\" fill=\"#FFF3CC\"/>\n<rect x=\"390\" y=\"10\" width=\"360\" height=\"36\" fill=\"#1D1B26\"/><g font-size=\"13\" font-weight=\"700\"><text x=\"405\" y=\"33\" fill=\"#E8A400\">Elements<\/text><text x=\"480\" y=\"33\" fill=\"#fff\">Console<\/text><text x=\"548\" y=\"33\" fill=\"#fff\">Network<\/text><text x=\"618\" y=\"33\" fill=\"#fff\">📱<\/text><text x=\"650\" y=\"33\" fill=\"#fff\">Lighthouse<\/text><\/g>\n<g font-size=\"13\" font-family='JetBrains Mono, monospace'><text x=\"405\" y=\"72\" fill=\"#F0622E\">&lt;main&gt;<\/text><rect x=\"398\" y=\"80\" width=\"345\" height=\"22\" fill=\"#DCE8FF\"/><text x=\"420\" y=\"96\" fill=\"#F0622E\">&lt;section class=\"card\"&gt;<\/text><text x=\"405\" y=\"122\" fill=\"#F0622E\">&lt;/main&gt;<\/text><\/g>\n<line x1=\"390\" y1=\"140\" x2=\"750\" y2=\"140\" stroke=\"#E7E1D6\" stroke-width=\"2\"/><text x=\"405\" y=\"162\" font-size=\"12\" fill=\"#6B6878\" font-weight=\"700\">Styles<\/text>\n<g font-size=\"13\" font-family='JetBrains Mono, monospace'><text x=\"405\" y=\"186\" fill=\"#2F6FEB\">.card {<\/text><text x=\"420\" y=\"206\" fill=\"#1D1B26\">padding: <tspan fill=\"#18A058\">16px<\/tspan>;<\/text><text x=\"420\" y=\"226\" fill=\"#1D1B26\" text-decoration=\"line-through\">color: red;<\/text><text x=\"405\" y=\"246\" fill=\"#2F6FEB\">}<\/text><\/g>\n<text x=\"620\" y=\"215\" font-size=\"12\" fill=\"#6B6878\">← правиш тут,<\/text><text x=\"620\" y=\"232\" font-size=\"12\" fill=\"#6B6878\">бачиш одразу<\/text>\n<\/svg>", "cap": "Інструменти розробника: <kbd>F12<\/kbd> або <kbd>Ctrl<\/kbd>+<kbd>Shift<\/kbd>+<kbd>I<\/kbd> (Mac: <kbd>Cmd<\/kbd>+<kbd>Option<\/kbd>+<kbd>I<\/kbd>)."}, {"t": "h", "v": "Робочий процес"}, {"t": "steps", "v": ["Зліва VS Code, справа браузер (<kbd>Win<\/kbd>+<kbd>←<\/kbd> / <kbd>Win<\/kbd>+<kbd>→<\/kbd> ділить екран навпіл).", "Сторінка відкрита через <b>Live Server<\/b>: зберіг файл → сторінка оновилась сама.", "DevTools завжди відкриті. Спочатку дивишся в <b>Console<\/b>: нема червоного? Добре.", "Хочеш змінити вигляд — експериментуй у <b>Elements → Styles<\/b>, вдале значення переносиш у CSS-файл.", "Перед здачею — <b>мобільний режим<\/b> і <b>Lighthouse<\/b>."]}, {"t": "h", "v": "Вкладки DevTools"}, {"t": "table", "head": ["Вкладка", "Що там", "Коли відкривати"], "rows": [["<b>Elements<\/b>", "Живий HTML (DOM) і CSS кожного елемента. Можна змінювати наживо", "«Чому воно не там?», «Звідки цей колір?»"], ["<b>Console<\/b>", "Повідомлення <code>console.log<\/code>, помилки JS, можна писати JS-команди", "Завжди, особливо з уроку 17"], ["<b>Network<\/b>", "Усі файли й запити: статус (200, 404…), розмір, час", "«Картинка/CSS не завантажились», запити до API"], ["<b>Application<\/b>", "localStorage, cookies", "Урок 27: подивитися збережені дані"], ["<b>📱 Device toolbar<\/b>", "Як сайт виглядає на телефоні/планшеті", "Після кожної зміни верстки"], ["<b>Lighthouse<\/b>", "Автоматична перевірка: швидкість, доступність, SEO", "Перед здачею проєкту"]]}, {"t": "h", "v": "Корисні прийоми"}, {"t": "list", "v": ["🎯 <b>Вибрати елемент<\/b>: іконка стрілочки зліва вгорі DevTools (<kbd>Ctrl<\/kbd>+<kbd>Shift<\/kbd>+<kbd>C<\/kbd>), потім клік по сторінці.", "🎨 <b>Колір<\/b>: клацни на квадратик кольору в Styles — відкриється піпетка й палітра.", "☑️ <b>Вимкнути властивість<\/b>: зніми галочку біля неї в Styles. Так легко знайти, яке правило «ламає» верстку.", "📦 <b>Блокова модель<\/b>: Elements → Computed. Видно margin, border, padding з цифрами.", "🔁 <b>Жорстке оновлення<\/b> (якщо зміни CSS «не підхоплюються»): <kbd>Ctrl<\/kbd>+<kbd>Shift<\/kbd>+<kbd>R<\/kbd>.", "🐢 <b>Повільний інтернет<\/b>: Network → No throttling → Slow 4G. Видно, як сайт вантажиться в людей з поганим зв'язком.", "🧪 <b>Console як калькулятор<\/b>: можна писати будь-який JS: <code>items.length<\/code>, <code>document.querySelector('h1')<\/code>."]}, {"t": "h", "v": "Детектор помилок: чекліст «Не працює!»"}, {"t": "table", "head": ["Симптом", "Де дивитися", "Найчастіша причина"], "rows": [["Стилі не застосовуються", "Network → style.css: 404?", "Неправильний шлях у <code>&lt;link href&gt;<\/code> або друкарська помилка в селекторі"], ["Картинки нема", "Network → картинка: 404?", "Шлях, регістр літер (<code>Cat.JPG<\/code> ≠ <code>cat.jpg<\/code>), файл не в тій папці"], ["Кнопка нічого не робить", "Console", "Помилка JS вище в коді, скрипт не підключено, нема <code>defer<\/code>"], ["<code>Cannot read properties of null<\/code>", "Console → клік на рядок", "<code>querySelector<\/code> не знайшов елемент: перевір id/клас"], ["<code>X is not defined<\/code>", "Console", "Змінна/функція не оголошена або написана з помилкою (регістр!)"], ["<code>Unexpected token<\/code>", "Console", "Пропущена або зайва дужка, лапка, кома"], ["Сторінка перезавантажується після кнопки форми", "—", "Забув <code>event.preventDefault()<\/code>"], ["Запит до API не працює", "Network → Fetch/XHR → запит → Response", "Статус 4xx/5xx: читай текст помилки у відповіді"], ["Верстка «їде» на телефоні", "📱 Device toolbar", "Фіксована <code>width<\/code>, нема meta viewport"]]}, {"t": "tip", "v": "Метод «гумової качки» 🦆: поясни свій код рядок за рядком уголос (качці, другу, коту). У 50% випадків помилку знаходиш сам, ще не закінчивши пояснення."}, {"t": "h", "v": "Зовнішні перевірки"}, {"t": "list", "v": ["<a href='https://validator.w3.org/#validate_by_input' target='_blank'>validator.w3.org<\/a> — перевірка HTML: незакриті теги, помилки вкладення.", "<a href='https://jigsaw.w3.org/css-validator/#validate_by_input' target='_blank'>CSS Validator<\/a> — перевірка CSS.", "<a href='https://wave.webaim.org' target='_blank'>WAVE<\/a> — доступність: контраст, alt, підписи полів.", "<a href='https://pagespeed.web.dev' target='_blank'>PageSpeed Insights<\/a> — швидкість опублікованого сайту."]}]}, "project": {"title": "Проєкт «Полиця»", "sub": "Особиста колекція улюблених речей з оцінками, пошуком і базою даних. Будуємо крок за кроком протягом усього курсу.", "sections": [{"t": "p", "v": "Кожен учень обирає <b>свою тему<\/b>: книги, ігри, фільми, музика, аніме, кросівки, рецепти, футбольні клуби… Структура однакова, а сайти виходять зовсім різні. Ось як виглядає готова полиця (це робоча демоверсія — спробуй пошук, фільтр, додавання й темну тему):"}, {"t": "demo", "v": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Полиця Олекси<\/title>\n<style>\n  :root { --bg:#fbf8f3; --card:#fff; --text:#1d1b26; --muted:#6b6878; --accent:#f0622e; --radius:16px; }\n  body.dark { --bg:#16151c; --card:#22212b; --text:#f3f0ea; --muted:#a8a4b4; }\n  * { box-sizing: border-box; }\n  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); transition:.3s; }\n  header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; background:var(--text); color:var(--bg); }\n  header strong { font-size:20px; }\n  header button { background:none; border:2px solid var(--bg); color:var(--bg); border-radius:99px; padding:6px 12px; cursor:pointer; }\n  main { max-width:900px; margin:0 auto; padding:20px; }\n  .tools { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }\n  .tools input, .tools select, form input, form select { padding:10px 12px; border-radius:10px; border:2px solid #d9d3c7; font:inherit; background:var(--card); color:var(--text); }\n  .tools input { flex:1; min-width:180px; }\n  #count { color:var(--muted); font-size:14px; }\n  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:16px; }\n  .card { position:relative; background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:0 6px 18px rgba(0,0,0,.08); transition:transform .2s, box-shadow .2s; }\n  .card:hover { transform:translateY(-5px) rotate(-1deg); box-shadow:0 14px 28px rgba(0,0,0,.14); }\n  .cover { height:90px; border-radius:10px; display:grid; place-items:center; font-size:42px; margin-bottom:10px; }\n  .tag { font-size:12px; background:var(--accent); color:#fff; padding:2px 9px; border-radius:99px; }\n  .card h3 { margin:10px 0 2px; font-size:17px; }\n  .card p { margin:0; color:var(--muted); font-size:14px; }\n  .stars { color:#e8a400 !important; letter-spacing:2px; margin-top:6px !important; }\n  .del { position:absolute; top:10px; right:10px; border:none; background:none; cursor:pointer; opacity:.4; font-size:16px; }\n  .del:hover { opacity:1; }\n  form { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; padding:16px; background:var(--card); border-radius:var(--radius); }\n  form input { flex:1; min-width:140px; }\n  form button { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 18px; font-weight:700; cursor:pointer; }\n<\/style>\n<\/head>\n<body>\n<header>\n  <strong>📚 Полиця Олекси<\/strong>\n  <button id=\"theme\">🌙<\/button>\n<\/header>\n<main>\n  <div class=\"tools\">\n    <input id=\"search\" placeholder=\"🔍 Пошук...\">\n    <select id=\"filter\"><option>усі<\/option><option>гра<\/option><option>книга<\/option><option>фільм<\/option><\/select>\n  <\/div>\n  <p id=\"count\"><\/p>\n  <div class=\"cards\" id=\"cards\"><\/div>\n\n  <form id=\"add-form\">\n    <input id=\"title\" placeholder=\"Назва\" required>\n    <input id=\"author\" placeholder=\"Автор / студія\">\n    <select id=\"category\"><option>гра<\/option><option>книга<\/option><option>фільм<\/option><\/select>\n    <select id=\"rating\"><option value=\"5\">★★★★★<\/option><option value=\"4\">★★★★<\/option><option value=\"3\">★★★<\/option><option value=\"2\">★★<\/option><option value=\"1\">★<\/option><\/select>\n    <button>Додати<\/button>\n  <\/form>\n<\/main>\n<script>\n  const icons = { 'гра': '🎮', 'книга': '📖', 'фільм': '🎬' };\n  const colors = { 'гра': '#DCE8FF', 'книга': '#FFE3D6', 'фільм': '#D7F5E3' };\n  let items = [\n    { id: 1, title: 'Minecraft', author: 'Mojang', category: 'гра', rating: 5 },\n    { id: 2, title: 'Кобзар', author: 'Т. Шевченко', category: 'книга', rating: 5 },\n    { id: 3, title: 'Мавка. Лісова пісня', author: 'Animagrad', category: 'фільм', rating: 4 },\n    { id: 4, title: 'Stardew Valley', author: 'ConcernedApe', category: 'гра', rating: 5 },\n    { id: 5, title: 'Тигролови', author: 'І. Багряний', category: 'книга', rating: 4 },\n    { id: 6, title: 'S.T.A.L.K.E.R. 2', author: 'GSC Game World', category: 'гра', rating: 4 }\n  ];\n\n  const $ = (s) => document.querySelector(s);\n  const stars = (n) => '★'.repeat(n) + '☆'.repeat(5 - n);\n\n  function render() {\n    const q = $('#search').value.toLowerCase();\n    const cat = $('#filter').value;\n    const visible = items\n      .filter(i => i.title.toLowerCase().includes(q))\n      .filter(i => cat === 'усі' || i.category === cat);\n    $('#count').textContent = `Показано ${visible.length} з ${items.length}`;\n    $('#cards').innerHTML = visible.map(i => `\n      <article class=\"card\">\n        <button class=\"del\" data-id=\"${i.id}\" title=\"Видалити\">✕<\/button>\n        <div class=\"cover\" style=\"background:${colors[i.category]}\">${icons[i.category]}<\/div>\n        <span class=\"tag\">${i.category}<\/span>\n        <h3>${i.title}<\/h3>\n        <p>${i.author}<\/p>\n        <p class=\"stars\">${stars(i.rating)}<\/p>\n      <\/article>`).join('') || '<p>Нічого не знайдено 🤷<\/p>';\n  }\n\n  $('#search').addEventListener('input', render);\n  $('#filter').addEventListener('change', render);\n  $('#theme').addEventListener('click', (e) => {\n    document.body.classList.toggle('dark');\n    e.target.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';\n  });\n  $('#add-form').addEventListener('submit', (e) => {\n    e.preventDefault();\n    items.unshift({ id: Date.now(), title: $('#title').value, author: $('#author').value || '—',\n      category: $('#category').value, rating: Number($('#rating').value) });\n    e.target.reset();\n    render();\n  });\n  $('#cards').addEventListener('click', (e) => {\n    if (!e.target.classList.contains('del')) return;\n    items = items.filter(i => i.id !== Number(e.target.dataset.id));\n    render();\n  });\n  render();\n<\/script>\n<\/body>\n<\/html>"}, {"t": "h", "v": "Обов'язкові функції"}, {"t": "list", "v": ["Семантична структура: header, nav, main, footer", "Сітка карток з назвою, автором, категорією, оцінкою-зірочками", "Пошук за назвою й фільтр за категорією", "Форма додавання з перевірками", "Дані зберігаються в базі даних (Supabase) і видні з будь-якого пристрою", "Стани «Завантаження…» і повідомлення про помилку", "Адаптивність: телефон, планшет, комп'ютер", "Опубліковано на GitHub Pages"]}, {"t": "h", "v": "Ідеї для «зірочок»"}, {"t": "cards", "v": [{"i": "🌙", "h": "Темна тема", "p": "Перемикач + CSS-змінні"}, {"i": "📊", "h": "Статистика", "p": "Скільки в кожній категорії, середня оцінка, топ-3"}, {"i": "↕️", "h": "Сортування", "p": "За оцінкою, назвою, датою"}, {"i": "🗑️", "h": "Видалення й редагування", "p": "Нові політики RLS"}, {"i": "🖼️", "h": "Обкладинки", "p": "Поле image_url і картинки на картках"}, {"i": "⚡", "h": "Realtime", "p": "Нові речі з'являються в усіх без оновлення"}]}, {"t": "h", "v": "Дорожня карта"}, {"t": "table", "head": ["Уроки", "Етап", "Результат"], "rows": [["1–7", "HTML", "Сторінка з топ-5, таблицею колекції й формою"], ["8–16", "CSS", "Стильна адаптивна сторінка з картками"], ["17–28", "JavaScript", "Інтерактивна полиця: рендер, пошук, фільтр, додавання, localStorage"], ["29–33", "Дані й бекенд", "Свій сервер на Express, потім полиця на Supabase"], ["34–38", "AI і фінал", "AI-рев'ю, публікація, захист"]]}, {"t": "h", "v": "Структура файлів фінальної версії"}, {"t": "code", "lang": "text", "v": "polytsia/\n├── index.html\n├── README.md        ← опис, скрі   try { await navigator.clipboard.writeText(text); btn.textContent = '✓ Скопійовано'; }
  catch(e) { btn.textContent = 'Виділи й скопіюй вручну'; }
  setTimeout(() => btn.textContent = old, 1600);
}

/* ---------- quiz ---------- */
function quizHTML(qs, key){
  return `<div class="quiz" data-q="${key}">${qs.map((q,qi)=>`<div class="qq"><h4><small>${qi+1}.</small>${q.q}</h4>${q.o.map((o,oi)=>`<label class="opt"><input type="radio" name="${key}-${qi}" value="${oi}"><span>${o}</span></label>`).join('')}<div class="why">💬 ${q.w}</div></div>`).join('')}
  <div class="qbar"><button class="bigbtn chk">Перевірити відповіді</button><button class="bigbtn ghost rst" style="display:none">Спробувати ще раз</button></div>
  <div class="score"><div class="big"></div><div><p class="s1"></p><p class="s2" style="opacity:.75;font-size:14px"></p></div></div></div>`;
}
function grade12(c, n){ return Math.max(1, Math.round(c / n * 12)); }
function mountQuiz(root, qs){
  const qz = root.querySelector('.quiz'); if (!qz) return;
  const chk = qz.querySelector('.chk'), rst = qz.querySelector('.rst'), sc = qz.querySelector('.score');
  chk.onclick = () => {
    let c = 0, answered = 0;
    qz.querySelectorAll('.qq').forEach((el, qi) => {
      const sel = el.querySelector('input:checked'); el.classList.add('checked');
      el.querySelectorAll('.opt').forEach((o, oi) => { o.classList.remove('ok','bad'); if (oi === qs[qi].a) o.classList.add('ok'); });
      if (sel) { answered++; if (+sel.value === qs[qi].a) c++; else sel.closest('.opt').classList.add('bad'); }
      el.querySelectorAll('input').forEach(i => i.disabled = true);
    });
    const g = grade12(c, qs.length);
    sc.querySelector('.big').textContent = `${c}/${qs.length}`;
    sc.querySelector('.s1').innerHTML = `<b>${g} ${g===1?'бал':g<5?'бали':'балів'}</b> за 12-бальною шкалою`;
    sc.querySelector('.s2').textContent = c === qs.length ? 'Ідеально! 🏆' : c / qs.length >= .75 ? 'Чудовий результат! Переглянь пояснення до помилок.' : c / qs.length >= .5 ? 'Непогано. Повтори теми, де помилився.' : 'Варто ще раз пройти уроки цього блоку 💪';
    if (answered < qs.length) sc.querySelector('.s2').textContent += ` (без відповіді: ${qs.length - answered})`;
    sc.classList.add('on'); chk.style.display = 'none'; rst.style.display = '';
  };
  rst.onclick = () => {
    qz.querySelectorAll('.qq').forEach(el => { el.classList.remove('checked'); el.querySelectorAll('.opt').forEach(o => o.classList.remove('ok','bad')); el.querySelectorAll('input').forEach(i => { i.disabled = false; i.checked = false; }); });
    sc.classList.remove('on'); chk.style.display = ''; rst.style.display = 'none';
  };
}

function lessonView(n){
  const l = L.find(x => x.n === n); if (!l) return home();
  const b = B[l.block];
  document.documentElement.style.setProperty('--c', b.color); document.documentElement.style.setProperty('--cs', b.soft);
  const prev = L.find(x => x.n === n - 1), next = L.find(x => x.n === n + 1);
  const test = T.find(t => t.after === n);
  let h = `<div class="lh"><span class="crumb">${b.icon} Урок ${l.n} з ${L.length} · ${b.name}</span><h1>${l.title}</h1><p class="sub">${l.sub}</p>
    <div class="meta"><span>⏱ ${l.mins} хв</span><span>🧩 ${l.sections.filter(s=>s.t==='code'||s.t==='try').length} прикладів коду</span><span>🏠 ${l.hw.length} рівні ДЗ</span></div></div>
    <div class="goals"><h4>Після уроку ти вмієш</h4><ul>${l.goals.map(g=>`<li>${g}</li>`).join('')}</ul></div>
    ${l.terms.length?`<div class="terms"><h4>📘 Ключові поняття уроку</h4><dl>${l.terms.map(t=>`<div><dt>${t.t}</dt><dd>${t.d}</dd></div>`).join('')}</dl><a href="#glossary" class="tl">Весь словник →</a></div>`:''}
    <div class="content">${l.sections.map(secHTML).join('')}</div>
    <div class="box proj"><h3>🏗️ Крок проєкту «Полиця»</h3><p>${l.project}</p></div>
    <div class="box check"><h3>🔍 Перевір у браузері</h3><ul>${l.check.map(c=>`<li>${c}</li>`).join('')}</ul></div>
    <div class="box hwb"><h3>🏠 Домашнє завдання</h3><div class="hw">${l.hw.map(x=>`<div class="hwi"><b>${x.lvl}</b><div>${x.v}</div></div>`).join('')}</div></div>
    <div class="content"><h2>Самоперевірка</h2></div>${quizHTML(l.quiz, 'l'+n)}
    ${test?`<a class="testban" href="#test-${test.n}"><span class="e">📝</span><div><b>${test.title}</b><span>${test.sub}</span></div></a>`:''}
    <div class="donebar"><span>${done[n]?'Урок пройдено 🎉':'Пройшов урок і зробив крок проєкту?'}</span><button class="bigbtn done-btn ${done[n]?'is':''}">${done[n]?'✓ Пройдено':'Позначити як пройдений'}</button></div>
    <div class="pn">${prev?`<a href="#lesson-${prev.n}"><small>← Урок ${prev.n}</small><b>${prev.title}</b></a>`:'<span></span>'}${next?`<a class="nx" href="#lesson-${next.n}"><small>Урок ${next.n} →</small><b>${next.title}</b></a>`:''}</div>`;
  $('#view').innerHTML = h;
  mountSections($('#view'), l.sections);
  mountQuiz($('#view'), l.quiz);
  $('.done-btn').onclick = () => { done[n] = !done[n]; if (!done[n]) delete done[n]; saveDone(); route(true); };
}

  const t = T.find(x => x.n === n); if (!t) return home();
  const b = B[t.block];

    <div class="call tip" style="margin-top:24px"><div class="ci">📋</div><p>Відповідай самостійно, без підглядання в уроки й AI. Після перевірки побачиш правильні відповіді, пояснення та бал за 12-бальною шкалою. Зроби скріншот результату для вчителя.</p></div>
    ${quizHTML(t.q, 't'+n)}
    <div class="pn">${`<a href="#lesson-${t.after}"><small>← Повернутися</small><b>Урок ${t.after}</b></a>`}${nxt?`<a class="nx" href="#lesson-${nxt.n}"><small>Далі →</small><b>Урок ${nxt.n}: ${nxt.title}</b></a>`:`<a class="nx" href="#home"><small>Курс завершено 🎓</small><b>На головну</b></a>`}</div>`;

}

}

function setC(c, cs){ document.documentElement.style.setProperty('--c', c); document.documentElement.style.setProperty('--cs', cs); }
function glossaryView(){
  setC('#F0622E', '#FFE3D6');
  const bl = n => B[L.find(l => l.n === n).block];
  $('#view').innerHTML = `<div class="lh"><h1 style="margin-top:0">📘 Словник термінів</h1><p class="sub">${DATA.gloss.length} понять курсу простими словами. Біля кожного — урок, де воно з'являється вперше.</p></div>
    <input class="gsearch" id="gs" placeholder="🔍 Пошук терміна… (наприклад: масив, API, padding)">
    <div class="gfilt">${DATA.blocks.map(b=>`<button data-b="${b.id}" style="--bc:${b.color};--bcs:${b.soft}">${b.icon} ${b.name}</button>`).join('')}</div>
    <div id="gl"></div>`;
  let fb = null;
  const draw = () => {
    const q = $('#gs').value.trim().toLowerCase();
    const list = DATA.gloss.filter(g => (!q || (g.t + ' ' + g.d).toLowerCase().includes(q)) && (!fb || bl(g.n).id === fb));
    $('#gl').innerHTML = DATA.blocks.map(b => {
      const items = list.filter(g => bl(g.n).id === b.id); if (!items.length) return '';
      return `<h2 class="gh" style="color:${b.color}">${b.icon} ${b.name}</h2><div class="gterms">${items.map(g=>`<div class="gt" style="--bc:${b.color};--bcs:${b.soft}"><div class="gtop"><b>${g.t}</b><a href="#lesson-${g.n}">урок ${g.n}</a></div><p>${g.d}</p></div>`).join('')}</div>`;
    }).join('') || '<p>Нічого не знайдено 🤷</p>';
  };
  $('#gs').addEventListener('input', draw);
  document.querySelectorAll('.gfilt button').forEach(btn => btn.onclick = () => {
    fb = fb === btn.dataset.b ? null : btn.dataset.b;
    document.querySelectorAll('.gfilt button').forEach(x => x.classList.toggle('on', x.dataset.b === fb)); draw();
  });
  draw();
}

  DATA.blocks.forEach(b => {

  $('#view').innerHTML = h;
  $('#view').querySelectorAll('.hwc input').forEach(cb => cb.onchange = () => { if (cb.checked) done[cb.dataset.k] = 1; else delete done[cb.dataset.k]; saveDone(); });

function planTable(){
  return `<div class="tbl"><table><thead><tr><th>#</th><th>Тема</th><th>Крок проєкту</th></tr></thead><tbody>${L.map(l=>{
    const t = T.find(x => x.after === l.n);
    const proj = l.project.replace(/<[^>]+>/g,'').split('. ')[0].slice(0,110);
    return `<tr><td><a href="#lesson-${l.n}" style="font-weight:800;color:${B[l.block].color};text-decoration:none">${l.n}</a></td><td><b>${l.title}</b>${l.mins>45?' <small>(90 хв)</small>':''}</td><td style="color:var(--muted);font-size:14px">${proj}${proj.length>=110?'…':''}</td></tr>${t?`<tr><td>📝</td><td colspan="2"><b>${t.title}</b> — ${t.sub}</td></tr>`:''}`;
  }).join('')}</tbody></table></div>`;
}

/* ---------- router ---------- */
function route(keepScroll){
  const r = (location.hash || '#home').slice(1);
  side(r);
  if (r.startsWith('lesson-')) lessonView(+r.split('-')[1]);
  else if (r.startsWith('test-')) testView(+r.split('-')[1]);
  else if (r === 'glossary') glossaryView();
  else if (r === 'homework') homeworkView();
  else if (P[r]) pageView(r);
  else { document.documentElement.style.setProperty('--c', '#F0622E'); home(); }
  document.body.classList.remove('open');
  if (!keepScroll) window.scrollTo(0, 0);
  const t = r.startsWith('lesson-') ? L.find(l => 'lesson-'+l.n === r) : null;
  document.title = t ? `Урок ${t.n}. ${t.title} — Веб-майстерня` : `Веб-майстерня · ${L.length} уроків`;
}
window.addEventListener('hashchange', () => route(false));
$('#menu').onclick = () => document.body.classList.toggle('open');
document.addEventListener('click', e => { if (document.body.classList.contains('open') && !e.target.closest('.side') && !e.target.closest('#menu')) document.body.classList.remove('open'); });
route(false);
if (window.Prism && Prism.highlightAllUnder) {} else { window.addEventListener('load', () => { try { Prism.highlightAllUnder($('#view')); } catch(e) {} }); }
})();
</script>
