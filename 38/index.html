дніше для великих екранів."}, {"t": "code", "lang": "html", "v": "<style>\n  .cards { display: grid; gap: 10px; font: bold 16px sans-serif; }\n  .cards div { background: #dce8ff; padding: 24px; border-radius: 10px; }\n\n  /* планшет */\n  @media (min-width: 500px) { .cards { grid-template-columns: 1fr 1fr; } }\n  /* комп'ютер */\n  @media (min-width: 800px) { .cards { grid-template-columns: repeat(4, 1fr); } }\n<\/style>\n<div class=\"cards\"><div>1<\/div><div>2<\/div><div>3<\/div><div>4<\/div><\/div>", "run": true, "title": null, "note": "Запусти й зміни ширину вікна браузера: 1 → 2 → 4 колонки."}, {"t": "table", "head": ["Типові точки зламу", "Пристрій"], "rows": [["до 480px", "Телефон"], ["480–768px", "Великий телефон / маленький планшет"], ["768–1024px", "Планшет"], ["від 1024px", "Ноутбук, комп'ютер"]]}, {"t": "h", "v": "Гумові картинки й відео"}, {"t": "code", "lang": "css", "v": "img, video, iframe {\n  max-width: 100%;   /* ніколи не ширше за батька */\n  height: auto;      /* зберегти пропорції */\n}", "run": false, "title": null, "note": null}, {"t": "h", "v": "Мобільний режим DevTools"}, {"t": "steps", "v": ["F12 → іконка 📱 (<kbd>Ctrl<\/kbd>+<kbd>Shift<\/kbd>+<kbd>M<\/kbd>).", "Вгорі обери пристрій: iPhone SE (найвужчий), iPad, Galaxy.", "Перевір: нема горизонтальної прокрутки, текст читається без збільшення, кнопки достатньо великі для пальця (мін. 44×44px).", "Найнадійніше — відкрити сайт на справжньому телефоні."]}], "project": "Зроби полицю mobile-first: на телефоні меню стовпчиком і картки в 1 колонку, на планшеті 2, на комп'ютері 3–4. Картинкам — <code>max-width: 100%<\/code>.", "check": ["📱 iPhone SE: нема горизонтальної прокрутки", "📱 iPad: 2 колонки карток", "Lighthouse → Accessibility: кнопки й посилання достатнього розміру"], "hw": [{"lvl": "Базовий", "v": "Зроби сторінку «Про мене» адаптивною: фото зверху на телефоні, зліва — на комп'ютері."}, {"lvl": "Середній", "v": "Меню, яке на телефоні стає стовпчиком, а на комп'ютері — рядком."}, {"lvl": "Зірочка ⭐", "v": "Меню-«бургер» на телефоні: кнопка ☰ показує/ховає меню (лише CSS, через чекбокс і :checked)."}], "quiz": [{"q": "Що таке mobile-first?", "o": ["Сайт лише для телефонів", "Спершу стилі для телефона, потім доповнення для великих екранів", "Додаток замість сайту", "Швидкий інтернет"], "a": 1, "w": "Від простого до складного."}, {"q": "Що робить @media (min-width: 768px)?", "o": ["Застосовує правила від 768px ширини", "Ширина 768px", "Лише для телефонів", "Друк"], "a": 0, "w": "Умова на екран."}, {"q": "Навіщо img { max-width: 100% }?", "o": ["Збільшити картинки", "Щоб картинка не виходила за межі батька", "Сховати", "Обрізати"], "a": 1, "w": "Гумові картинки."}], "mins": 45, "id": "responsive", "terms": [{"t": "Адаптивний дизайн", "d": "Сайт, що гарно виглядає на будь-якому екрані: телефоні, планшеті, комп'ютері.", "n": 14}, {"t": "Media query", "d": "Умова в CSS: @media (min-width: 768px) { ... } — правила лише для певної ширини екрана.", "n": 14}, {"t": "Viewport", "d": "Видима область сторінки на екрані. Мета-тег viewport обов'язковий для коректного вигляду на телефоні.", "n": 14}]}, {"n": 15, "block": "css", "title": "Переходи, анімації та CSS-змінні", "sub": "Плавні ефекти, «живі» елементи та теми оформлення. Сайт починає виглядати професійно.", "goals": ["робити плавні переходи transition", "трансформувати елементи: зсув, поворот, масштаб", "створювати анімації через @keyframes", "зберігати кольори в CSS-змінних і робити темну тему"], "sections": [{"t": "h", "v": "Плавні ефекти"}, {"t": "try", "v": "<style>\n  :root { --accent: #f0622e; }          /* CSS-змінна */\n  .card {\n    width: 200px; padding: 24px; margin: 30px;\n    background: white; border-radius: 16px; font-family: sans-serif;\n    box-shadow: 0 4px 12px rgba(0,0,0,.1);\n    transition: transform .25s, box-shadow .25s;   /* плавність */\n  }\n  .card:hover {\n    transform: translateY(-8px) rotate(-2deg);\n    box-shadow: 0 16px 32px rgba(0,0,0,.18);\n  }\n  .badge { background: var(--accent); color: white; padding: 4px 10px; border-radius: 99px; }\n  @keyframes pulse { 50% { transform: scale(1.15); } }\n  .heart { display: inline-block; animation: pulse 1s infinite; }\n<\/style>\n<div class=\"card\">\n  <span class=\"badge\">NEW<\/span>\n  <h3>Наведи на мене<\/h3>\n  <p>Улюблене <span class=\"heart\">❤️<\/span><\/p>\n<\/div>", "title": "Hover, transform, анімація, змінні"}, {"t": "p", "v": "<b>CSS-змінні<\/b> (<code>--accent<\/code>) — зберігаєш колір один раз у <code>:root<\/code> і використовуєш через <code>var(--accent)<\/code> скрізь. Захотів іншу тему — змінив один рядок."}, {"t": "code", "lang": "css", "v": ":root {\n  --bg: #fbf8f3;\n  --text: #1d1b26;\n  --accent: #f0622e;\n  --radius: 16px;\n}\n/* Темна тема для тих, у кого вона увімкнена в системі */\n@media (prefers-color-scheme: dark) {\n  :root { --bg: #16151c; --text: #f3f0ea; }\n}\nbody { background: var(--bg); color: var(--text); }", "run": false, "title": "Тема через змінні", "note": null}, {"t": "h", "v": "Трансформації"}, {"t": "table", "head": ["transform", "Що робить"], "rows": [["<code>translate(20px, -10px)<\/code>", "Зсув"], ["<code>rotate(15deg)<\/code>", "Поворот"], ["<code>scale(1.2)<\/code>", "Масштаб (1 = як є)"], ["<code>skew(10deg)<\/code>", "Нахил"]]}, {"t": "h", "v": "Анімація з кадрами"}, {"t": "code", "lang": "html", "v": "<style>\n  @keyframes float {\n    0%   { transform: translateY(0); }\n    50%  { transform: translateY(-15px); }\n    100% { transform: translateY(0); }\n  }\n  @keyframes spin { to { transform: rotate(360deg); } }\n  .rocket { font-size: 50px; display: inline-block; animation: float 2s ease-in-out infinite; }\n  .loader { width: 40px; height: 40px; border: 5px solid #e7e1d6; border-top-color: #f0622e;\n            border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; margin-left: 30px; }\n<\/style>\n<span class=\"rocket\">🚀<\/span>\n<span class=\"loader\"><\/span>", "run": true, "title": null, "note": "Індикат ", "Повертає результат з функції й завершує її", "Повторює функцію", "Видаляє функцію"], "a": 1, "w": "return — результат роботи."}, {"q": "Як викликати функцію stars з числом 4?", "o": ["stars[4]", "stars(4)", "call stars 4", "stars = 4"], "a": 1, "w": "Круглі дужки = виклик."}, {"q": "Що еквівалентне const f = (x) => x + 1?", "o": ["function f(x) { x + 1 }", "function f(x) { return x + 1 }", "f = x + 1", "function(x + 1)"], "a": 1, "w": "Без фігурних дужок стрілка повертає вираз автоматично."}], "mins": 45, "id": "func", "terms": [{"t": "Функція", "d": "Іменований блок коду, який можна викликати багато разів: function stars(n) { ... }.", "n": 21}, {"t": "Параметр / аргумент", "d": "Параметр — «отвір» у функції (n у stars(n)), аргумент — конкретне значення, яке туди кладеш (stars(4)).", "n": 21}, {"t": "return", "d": "Повертає результат з функції й завершує її.", "n": 21}, {"t": "Стрілкова функція", "d": "Коротший запис функції: const double = (x) =&gt; x * 2.", "n": 21}]}, {"n": 22, "block": "js", "title": "Об'єкти: опис однієї речі", "sub": "Об'єкт збирає всі властивості однієї речі в одному місці. А масив об'єктів — це вже таблиця даних.", "goals": ["створювати об'єкти й звертатися до властивостей", "змінювати, додавати й видаляти властивості", "працювати з вкладеними об'єктами й масивами", "зберігати колекцію як масив об'єктів"], "sections": [{"t": "h", "v": "Об'єкт: властивості в одному місці"}, {"t": "code", "lang": "javascript", "v": "const game = {\n  title: 'Minecraft',\n  studio: 'Mojang',\n  year: 2011,\n  rating: 5,\n  tags: ['пісочниця', 'виживання']\n};\n\nconsole.log(game.title);        // крапка — доступ до властивості\nconsole.log(game['year']);      // або так\ngame.rating = 4;                // змінити\ngame.played = true;             // додати нову\nconsole.log(game);", "run": true, "title": null, "note": null}, {"t": "h", "v": "Масив об'єктів = таблиця"}, {"t": "p", "v": "Пам'ятаєш таблицю з уроку 6? Ось вона в JavaScript: кожен об'єкт — рядок, es: [..]}<\/code>. Для кожного виведи середній бал."}, {"lvl": "Зірочка ⭐", "v": "Дізнайся про <code>Object.entries<\/code> і виведи всі властивості об'єкта у форматі «ключ: значення» циклом."}], "quiz": [{"q": "Як отримати title з об'єкта game?", "o": ["game(title)", "game.title", "game->title", "title.game"], "a": 1, "w": "Через крапку."}, {"q": "Що виведе book.author.name?", "o": ["Помилку", "Значення name з вкладеного об'єкта author", "undefined завжди", "author"], "a": 1, "w": "Ланцюжок крапок."}, {"q": "Що описує масив об'єктів?", "o": ["Одну річ", "Колекцію схожих речей — як таблиця", "Функцію", "Рядок"], "a": 1, "w": "Рядки таблиці."}], "mins": 45, "id": "objects", "terms": [{"t": "Об'єкт", "d": "Набір властивостей «ключ: значення» в фігурних дужках, що описує одну річ: { title: 'Minecraft', rating: 5 }.", "n": 22}, {"t": "Властивість", "d": "Пара «ключ: значення» в об'єкті. Доступ через крапку: game.title.", "n": 22}]}, {"n": 23, "block": "js", "title": "Методи масивів і JSON", "sub": "filter, map, find, sort, reduce — п'ять суперсил для роботи з даними. Плюс JSON — мова, якою говорять сервери.", "goals": ["відбирати дані через filter", "перетворювати через map", "знаходити через find, сортувати через sort", "рахувати через reduce", "читати й писати JSON"], "sections": [{"t": "h", "v": "Суперсили масивів"}, {"t": "code", "lang": "javascript", "v": "const items = [\n  { title: 'Minecraft', category: 'гра',   rating: 5 },\n  { title: 'Кобзар',    category: 'книга', rating: 5 },\n  { title: 'Мавка',     category: 'фільм', rating: 4 },\n  { title: 'Terraria',  category: 'гра',   rating: 4 }\n];\n\n// filter — відібрати ті, що підходять\nconst games = items.filter(item => item.category === 'гра');\nconsole.log('Ігри:', games.length);\n\n// map — перетворити кожен\nconst names = items.map(item => item.title.toUpperCase());\nconsole.log(names);\n\n// find — знайти перший\nconst found = items.find(item => item.title === 'Мавка');\nconsole.log(found);\n\n// sort — відсортувати (тут від кращого до гіршого)\nconst best = [...items].sort((a, b) => b.rating - a.rating);\nconsole.log(best[0].title);\n\n// forEach — просто зробити щось з кожним\nitems.forEach(item => console.log(`${item.title}: ${item.rating}`));", "run": true, "title": null, "note": null}, {"t": "table", "head": ["Метод", "Повертає", "Коли"], "rows": [["<code>filter<\/code>", "новий масив (менший)", "пошук, фільтри"], ["<code>map<\/code>", "новий масив (такий самий за довжиною)", "перетворити дані → HTML"], ["<code>find<\/code>", "один елемент або undefined", "знайти за id"], ["<code>sort<\/code>", "той самий масив, відсортований", "рейтинги, алфавіт"], ["<code>forEach<\/code>", "нічого", "просто пройтися"]]}, {"t": "h", "v": "reduce: згорнути масив в одне значення"}, {"t": "code", "lang": "javascript", "v": "const items = [\n  { title: 'Minecraft', rating: 5 },\n  { title: 'Кобзар', rating: 5 },\n  { title: 'Мавка', rating: 4 }\n];\n\nconst sum = items.reduce((total, item) => total + item.rating, 0);\nconsole.log('Сума:', sum, 'Середня:', (sum / items.length).toFixed(1));", "run": true, "title": null, "note": "<code>total<\/code> — «накопичувач», 0 — його початкове значення."}, {"t": "h", "v": "Ланцюжки методів"}, {"t": "code", "lang": "javascript", "v": "const items = [\n  { title: 'Minecraft', category: 'гра', rating: 5 },\n  { title: 'Terraria', category: 'гра', rating: 4 },\n  { title: 'Portal 2', category: 'гра', rating: 3 },\n  { title: 'Кобзар', category: 'книга', rating: 5 }\n];\n\nconst bestGames = items\n  .filter(i => i.category === 'гра')      // лише ігри\n  .filter(i => i.rating >= 4)             // з оцінкою 4+\n  .map(i => i.title);                     // лише назви\n\nconsole.log(bestGames);", "run": true, "title": null, "note": null}, {"t": "h", "v": "JSON — мова обміну даними"}, {"t": "code", "lang": "json", "v": "[\n  { \"title\": \"Minecraft\", \"category\": \"гра\", \"rating\": 5 },\n  { \"title\": \"Кобзар\", \"category\": \"книга\", \"rating\": 5 }\n]", "run": false, "title": null, "note": "JSON схожий на об'єкти JS, але ключі завжди в подвійних лапках. Саме в такому вигляді сервер і база даних передаватимуть нам дані."}, {"t": "code", "lang": "javascript", "v": "const items = [{ title: 'Minecraft', rating: 5 }];\n\nconst text = JSON.stringify(items);   // масив → текст\nconsole.log(typeof text, text);\n\nconst back = JSON.parse(text);        // текст → масив\nconsole.log(back[0].title);", "run": true, "title": null, "note": null}], "project": "У app.js виведи: кількість речей кожної категорії (filter), список назв великими літерами (map), найкращу річ (sort), середню оцінку (reduce).", "check": ["Console: усі 4 результати правильні", "Перевір, що sort не зіпсував оригінальний порядок (копія через [...items])", "Спробуй у Console: <code>JSON.stringify(items, null, 2)<\/code>"], "hw": [{"lvl": "Базовий", "v": "Масив товарів. Знайди всі дешевші за 100 грн і виведи їх назви."}, {"lvl": "Середній", "v": "Масив учнів з оцінками. Відсортуй за середнім балом і виведи рейтинг класу."}, {"lvl": "Зірочка ⭐", "v": "Через reduce згрупуй речі за категоріями: <code>{ гра: [...], книга: [...] }<\/code>."}], "quiz": [{"q": "Що поверне filter?", "o": ["Один елемент", "Новий масив з тих, що пройшли перевірку", "Число", "true/false"], "a": 1, "w": "Завжди масив."}, {"q": "Що поверне [1,2,3].reduce((s, n) => s + n, 0)?", "o": ["[1,2,3]", "6", "0", "123"], "a": 1, "w": "Сума."}, {"q": "Що робить JSON.parse?", "o": ["Масив → текст", "Текст JSON → об'єкт/масив", "Видаляє JSON", "Відправляє на сервер"], "a": 1, "w": "parse = розібрати текст."}], "mins": 45, "id": "array-methods", "terms": [{"t": "filter / map / find", "d": "Методи масивів: filter — відібрати, map — перетворити кожен, find — знайти перший.", "n": 23}, {"t": "JSON", "d": "Текстовий формат обміну даними, схожий на об'єкти JS. Ключі завжди в подвійних лапках.", "n": 23}]}, {"n": 24, "block": "js", "title": "DOM: JavaScript керує сторінкою", "sub": "Знаходимо елементи, змінюємо текст і стилі, створюємо нові елементи прямо з коду.", "goals": ["пояснити, що таке DOM-дерево", "знаходити елементи через querySelector", "змінювати textContent, innerHTML, classList", "створювати й додавати елементи на сторінку"], "sections": [{"t": "h", "v": "DOM — сторінка очима JavaScript"}, {"t": "p", "v": "Браузер перетворює HTML на <b>дерево об'єктів<\/b> — DOM (Document Object Model). Кожен тег — вузол, у якого є батьки й діти. JavaScript може знайти будь-який вузол і змінити його."}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif' font-size=\"15\" font-weight=\"700\">\n<g stroke=\"#9C98A8\" stroke-width=\"2\"><line x1=\"380\" y1=\"48\" x2=\"380\" y2=\"80\"/><line x1=\"380\" y1=\"110\" x2=\"200\" y2=\"150\"/><line x1=\"380\" y1=\"110\" x2=\"560\" y2=\"150\"/><line x1=\"200\" y1=\"180\" x2=\"200\" y2=\"220\"/><line x1=\"560\" y1=\"180\" x2=\"440\" y2=\"220\"/><line x1=\"560\" y1=\"180\" x2=\"560\" y2=\"220\"/><line x1=\"560\" y1=\"180\" x2=\"680\" y2=\"220\"/><\/g>\n<rect x=\"310\" y=\"18\" width=\"140\" height=\"32\" rx=\"16\" fill=\"#1D1B26\"/><text x=\"380\" y=\"39\" text-anchor=\"middle\" fill=\"#fff\">document<\/text>\n<rect x=\"320\" y=\"80\" width=\"120\" height=\"32\" rx=\"16\" fill=\"#F0622E\"/><text x=\"380\" y=\"101\" text-anchor=\"middle\" fill=\"#fff\">html<\/text>\n<rect x=\"140\" y=\"150\" width=\"120\" height=\"32\" rx=\"16\" fill=\"#F0622E\"/><text x=\"200\" y=\"171\" text-anchor=\"middle\" fill=\"#fff\">head<\/text>\n<rect x=\"500\" y=\"150\" width=\"120\" height=\"32\" rx=\"16\" fill=\"#F0622E\"/><text x=\"560\" y=\"171\" text-anchor=\"middle\" fill=\"#fff\">body<\/text>\n<rect x=\"140\" y=\"220\" width=\"120\" height=\"32\" rx=\"16\" fill=\"#fff\" stroke=\"#F0622E\" stroke-width=\"2\"/><text x=\"200\" y=\"241\" text-anchor=\"middle\" fill=\"#1D1B26\">title<\/text>\n<rect x=\"390\" y=\"220\" width=\"100\" height=\"32\" rx=\"16\" fill=\"#fff\" stroke=\"#F0622E\" stroke-width=\"2\"/><text x=\"440\" y=\"241\" text-anchor=\"middle\" fill=\"#1D1B26\">h1<\/text>\n<rect x=\"510\" y=\"220\" width=\"100\" height=\"32\" rx=\"16\" fill=\"#fff\" stroke=\"#F0622E\" stroke-width=\"2\"/><text x=\"560\" y=\"241\" text-anchor=\"middle\" fill=\"#1D1B26\">form<\/text>\n<rect x=\"630\" y=\"220\" width=\"100\" height=\"32\" rx=\"16\" fill=\"#E8A400\"/><text x=\"680\" y=\"241\" text-anchor=\"middle\" fill=\"#fff\">#list<\/text>\n<text x=\"680\" y=\"285\" text-anchor=\"middle\" font-weight=\"400\" font-size=\"13\" fill=\"#6B6878\">querySelector('#list')<\/text>\n<\/svg>", "cap": "DOM-дерево. Вкладка Elements у DevTools показує саме його."}, {"t": "h", "v": "Знайти елемент"}, {"t": "code", "lang": "javascript", "v": "// за CSS-селектором — як у CSS!\nconst title = document.querySelector('h1');        // перший h1\nconst list  = document.querySelector('#list');     // id=\"list\"\nconst card  = document.querySelector('.card');    // перший з class=\"card\"\nconst all   = document.querySelectorAll('.card');  // УСІ картки (список)", "run": false, "title": null, "note": null}, {"t": "h", "v": "Змінити елемент"}, {"t": "code", "lang": "html", "v": "<h1 id=\"title\">Моя полиця<\/h1>\n<p class=\"info\">Завантаження...<\/p>\n<style>.highlight { background: #fff3cc; padding: 8px; border-radius: 8px; }<\/style>\n\n<script>\n  const title = document.querySelector('#title');\n  title.textContent = '📚 Полиця Олекси';      // змінити текст\n  title.style.color = '#f0622e';               // змінити стиль\n\n  const info = document.querySelector('.info');\n  info.innerHTML = 'У колекції <b>8<\/b> речей'; // вставити HTML\n  info.classList.add('highlight');             // додати клас\n<\/script>", "run": true, "title": null, "note": null}, {"t": "tip", "v": "<code>textContent<\/code> — лише текст (безпечно). <code>innerHTML<\/code> — розуміє теги. Дані, які ввела людина, вставляй через textContent, бо хтось може ввести шкідливий код."}, {"t": "h", "v": "Створити нові елементи"}, {"t": "code", "lang": "html", "v": "<ul id=\"list\"><\/ul>\n<script>\n  const games = ['Minecraft', 'Terraria', 'Celeste'];\n  const list = document.querySelector('#list');\n\n  for (const g of games) {\n    const li = document.createElement('li');  // створити\n    li.textContent = g;                       // наповнити\n    list.append(li);                          // додати на сторінку\n  }\n<\/script>", "run": true, "title": null, "note": null}, {"t": "h", "v": "Швидкий спосіб: map + шаблонні рядки"}, {"t": "try", "v": "<div id=\"cards\"><\/div>\n<style>\n  #cards { display: grid; gap: 10px; font-family: sans-serif; }\n  .card { background: #fff; border: 2px solid #1d1b26; border-radius: 12px; padding: 12px; }\n<\/style>\n<script>\n  const items = [\n    { title: 'Minecraft', rating: 5 },\n    { title: 'Кобзар', rating: 5 },\n    { title: 'Мавка', rating: 4 }\n  ];\n\n  document.querySelector('#cards').innerHTML = items.map(item => `\n    <div class=\"card\">\n      <b>${item.title}<\/b><br>\n      ${'★'.repeat(item.rating)}\n    <\/div>\n  `).join('');\n<\/script>", "title": "Масив → картки на сторінці"}, {"t": "idea", "v": "Ось вона, магія: <b>дані<\/b> (масив) окремо, <b>вигляд<\/b> (HTML-шаблон) окремо, а JavaScript їх з'єднує. Саме так працюють YouTube, Instagram і будь-який інтернет-магазин."}], "project": "Видали з <code>index.html<\/code> картки, написані вручну, залиш порожній <code>&lt;div class=\"cards\" id=\"cards\"&gt;&lt;/div&gt;<\/code>. В app.js згенеруй картки з масиву <code>items<\/code> (data.js) через map. Додай над сіткою лічильник «У колекції: N».", "check": ["F12 → Elements: картки з'явились у DOM, хоча в index.html їх нема", "Додай об'єкт у data.js → після перезавантаження з'явилась нова картка", "Помилка <code>Cannot set properties of null<\/code> = querySelector нічого не знайшов (перевір id і defer)"], "hw": [{"lvl": "Базовий", "v": "Сторінка-«хамелеон»: JS змінює заголовок, колір фону й текст абзацу при завантаженні."}, {"lvl": "Середній", "v": "Згенеруй таблицю розкладу з масиву об'єктів <code>{day, lessons: [...]}<\/code>."}, {"lvl": "Зірочка ⭐", "v": "Виведи картки, відсортовані за рейтингом, і дай найкращій клас <code>.top<\/code> з короною 👑."}], "quiz": [{"q": "Що таке DOM?", "o": ["Мова програмування", "Дерево об'єктів, на яке браузер перетворює HTML", "Сервер", "Тип файлу"], "a": 1, "w": "Document Object Model."}, {"q": "Як знайти елемент з id=\"list\"?", "o": ["document.querySelector('list')", "document.querySelector('#list')", "document.get(list)", "#list.find()"], "a": 1, "w": "Селектор як у CSS: #id."}, {"q": "Чим безпечніше вставляти текст від користувача?", "o": ["innerHTML", "textContent", "document.write", "Неважливо"], "a": 1, "w": "textContent не виконує теги."}], "mins": 45, "id": "dom", "terms": [{"t": "DOM", "d": "Document Object Model — дерево об'єктів, на яке браузер перетворює HTML. Через нього JS змінює сторінку.", "n": 24}, {"t": "querySelector", "d": "Метод, що знаходить на сторінці перший елемент за CSS-селектором.", "n": 24}, {"t": "textContent / innerHTML", "d": "Вміст елемента: textContent — лише текст (безпечно), innerHTML — розуміє HTML-теги.", "n": 24}, {"t": "Рендер", "d": "Малювання сторінки (або її частини) з даних. Наша функція render() перетворює масив на картки.", "n": 24}]}, {"n": 25, "block": "js", "title": "Події: сторінка реагує на людину", "sub": "Кліки, наведення, клавіатура. Вчимося слухати події й реагувати на них.", "goals": ["підписуватися на події через addEventListener", "використовувати об'єкт події event", "обробляти click, input, keydown", "перемикати класи через classList.toggle"], "sections": [{"t": "h", "v": "Слухач подій"}, {"t": "code", "lang": "html", "v": "<button id=\"btn\">Клікни мене<\/button>\n<p id=\"out\">Кліків: 0<\/p>\n\n<script>\n  let count = 0;\n  const btn = document.querySelector('#btn');\n  const out = document.querySelector('#out');\n\n  btn.addEventListener('click', () => {\n    count++;\n    out.textContent = `Кліків: ${count}`;\n  });\n<\/script>", "run": true, "title": null, "note": "Схема завжди одна: <b>знайди елемент → підпишись на подію → опиши, що робити<\/b>."}, {"t": "table", "head": ["Подія", "Коли спрацьовує"], "rows": [["<code>click<\/code>", "Клік мишкою / дотик"], ["<code>input<\/code>", "Кожна зміна тексту в полі"], ["<code>change<\/code>", "Зміна select, checkbox (після вибору)"], ["<code>submit<\/code>", "Відправка форми (Enter або кнопка)"], ["<code>keydown<\/code>", "Натиснули клавішу"], ["<code>mouseover<\/code>", "Навели мишку"]]}, {"t": "h", "v": "Темна тема однією кнопкою"}, {"t": "code", "lang": "html", "v": "<style>\n  body { font-family: sans-serif; transition: .3s; }\n  body.dark { background: #16151c; color: #f3f0ea; }\n<\/style>\n<button id=\"theme\">🌙 Темна тема<\/button>\n<p>Текст сторінки.<\/p>\n<script>\n  document.querySelector('#theme').addEventListener('click', (e) => {\n    document.body.classList.toggle('dark');   // toggle = додати/прибрати\n    const isDark = document.body.classList.contains('dark');\n    e.target.textContent = isDark ? '☀️ Світла тема' : '🌙 Темна тема';\n  });\n<\/script>", "run": true, "title": null, "note": null}, {"t": "h", "v": "Клавіатура"}, {"t": "code", "lang": "html", "v": "<p>Натисни будь-яку клавішу (спочатку клацни сюди)<\/p>\n<h2 id=\"key\">—<\/h2>\n<script>\n  document.addEventListener('keydown', (e) => {\n    document.querySelector('#key').textContent = `Ти натиснув: ${e.key}`;\n    if (e.key === 'Enter') console.log('Enter! 🚀');\n  });\n<\/script>", "run": true, "title": null, "note": null}, {"t": "h", "v": "Об'єкт події"}, {"t": "p", "v": "Обробник отримує параметр <code>event<\/code> (часто пишуть <code>e<\/code>) з деталями: <code>e.target<\/code> — елемент, на якому сталась подія; <code>e.key<\/code> — клавіша; <code>e.clientX<\/code> — координати мишки."}, {"t": "try", "v": "<style>\n  .box { width: 120px; height: 120px; background: #2f6feb; border-radius: 16px; transition: .3s; }\n  .box.active { background: #f0622e; transform: rotate(45deg) scale(.8); }\n<\/style>\n<div class=\"box\" id=\"box\"><\/div>\n<script>\n  document.querySelector('#box').addEventListener('click', (e) => {\n    e.target.classList.toggle('active');\n    // додай: console.log з кількістю кліків\n  });\n<\/script>", "title": "Клацни по квадрату"}], "project": "Додай у шапку кнопку перемикання темної теми (classList.toggle). Додай до карток ефект: клік по картці додає їй клас <code>.selected<\/code> з рамкою.", "check": ["Elements → обери кнопку → вкладка <b>Event Listeners<\/b>: видно твій click", "Клас з'являється/зникає в Elements при кліку", "Console без помилок"], "hw": [{"lvl": "Базовий", "v": "Лічильник з кнопками +1, −1, скинути. Не менше 0."}, {"lvl": "Середній", "v": "Гра «Клікер»: кнопка-печиво, лічильник, кожні 10 кліків — нове досягнення."}, {"lvl": "Зірочка ⭐", "v": "Керуй квадратом стрілками клавіатури (keydown + style.left/top)."}], "quiz": [{"q": "Що робить classList.toggle('dark')?", "o": ["Завжди додає клас", "Додає клас, якщо нема, і прибирає, якщо є", "Видаляє елемент", "Міняє колір"], "a": 1, "w": "Перемикач."}, {"q": "Що таке e.target?", "o": ["Ціль сайту", "Елемент, на якому сталася подія", "Клавіша", "Помилка"], "a": 1, "w": "Де сталося."}, {"q": "Яка подія для натискання клавіші?", "o": ["click", "keydown", "input", "change"], "a": 1, "w": "keydown."}], "mins": 45, "id": "events", "terms": [{"t": "Подія", "d": "Щось, що сталося на сторінці: клік, введення тексту, відправка форми, натискання клавіші.", "n": 25}, {"t": "Обробник подій", "d": "Функція, яка виконується, коли стається подія: addEventListener('click', ...).", "n": 25}]}, {"n": 26, "block": "js", "title": "Форми та перевірка даних", "sub": "Читаємо дані з форми, перевіряємо їх і показуємо зрозумілі помилки. Форма полиці оживає!", "goals": ["обробляти submit без перезавантаження", "читати значення полів і перетворювати типи", "перевіряти дані й показувати помилки", "очищати форму після відправки"], "sections": [{"t": "h", "v": "Обробка форми"}, {"t": "code", "lang": "html", "v": "<form id=\"add-form\">\n  <input id=\"title\" placeholder=\"Назва\" required>\n  <select id=\"rating\">\n    <option value=\"5\">★★★★★<\/option>\n    <option value=\"4\">★★★★<\/option>\n    <option value=\"3\">★★★<\/option>\n  <\/select>\n  <button>Додати<\/button>\n<\/form>\n<ul id=\"list\"><\/ul>\n\n<script>\n  const form = document.querySelector('#add-form');\n\n  form.addEventListener('submit', (event) => {\n    event.preventDefault();               // НЕ перезавантажувати сторінку!\n\n    const title = document.querySelector('#title').value;\n    const rating = Number(document.querySelector('#rating').value);\n\n    const li = document.createElement('li');\n    li.textContent = `${title} — ${'★'.repeat(rating)}`;\n    document.querySelector('#list').append(li);\n\n    form.reset();                          // очистити форму\n    console.log('Додано:', { title, rating });\n  });\n<\/script>", "run": true, "title": null, "note": null}, {"t": "warn", "v": "<code>.value<\/code> поля — це завжди <b>рядок<\/b>. Щоб отримати число, загорни в <code>Number(...)<\/code>."}, {"t": "h", "v": "Перевірка даних (валідація)"}, {"t": "code", "lang": "html", "v": "<style>\n  .error { color: #e5484d; font-size: 14px; min-height: 18px; }\n  input.bad { border: 2px solid #e5484d; }\n<\/style>\n<form id=\"f\">\n  <input id=\"title\" placeholder=\"Назва гри\">\n  <p class=\"error\" id=\"err\"><\/p>\n  <button>Додати<\/button>\n<\/form>\n<script>\n  document.querySelector('#f').addEventListener('submit', (e) => {\n    e.preventDefault();\n    const input = document.querySelector('#title');\n    const err = document.querySelector('#err');\n    const title = input.value.trim();          // прибрати пробіли по краях\n\n    if (title.length < 2) {\n      err.textContent = 'Назва має бути мінімум 2 символи';\n      input.classList.add('bad');\n      return;                                   // зупинити\n    }\n    err.textContent = '';\n    input.classList.remove('bad');\n    console.log('✅ Додано:', title);\n    e.target.reset();\n  });\n<\/script>", "run": true, "title": null, "note": "Спробуй відправити порожнє поле, пробіли або одну літеру."}, {"t": "tip", "v": "HTML-перевірки (<code>required<\/code>, <code>min<\/code>) — для зручності. JS-перевірки — для гарних повідомлень. А справжній захист — лише на сервері (дізнаємось в уроці 32)."}, {"t": "try", "v": "<input id=\"name\" placeholder=\"Введи імʼя\">\n<h2 id=\"hello\">Привіт, ...<\/h2>\n<script>\n  document.querySelector('#name').addEventListener('input', (e) => {\n    const value = e.target.value;\n    document.querySelector('#hello').textContent = `Привіт, ${value || '...'}! 👋`;\n  });\n<\/script>", "title": "Живе введення"}], "project": "«Оживи» форму «Додати на полицю»: при submit — <code>preventDefault<\/code>, зібрати об'єкт з усіх полів (rating через Number), перевірити назву й показати помилку під полем, вивести об'єкт у консоль.", "check": ["Сторінка НЕ перезавантажується", "Console: rating — число (синім), а не рядок (в лапках)", "Порожня назва або пробіли — показується помилка"], "hw": [{"lvl": "Базовий", "v": "Форма реєстрації: ім'я (мін. 2 символи), вік (10–18). Помилки під полями."}, {"lvl": "Середній", "v": "Перевірка пароля наживо (подія input): показуй ✅/❌ для довжини, цифри, великої літери."}, {"lvl": "Зірочка ⭐", "v": "Гра «Вгадай число»: форма з полем, комп'ютер каже «більше/менше» і рахує спроби."}], "quiz": [{"q": "Що робить event.preventDefault() у submit?", "o": ["Видаляє форму", "Скасовує перезавантаження сторінки", "Відправляє дані", "Очищає поля"], "a": 1, "w": "Стандартна дія скасована."}, {"q": "Що поверне input.value, якщо там 5?", "o": ["Число 5", "Рядок '5'", "true", "undefined"], "a": 1, "w": "value — завжди рядок."}, {"q": "Навіщо .trim()?", "o": ["Робить великі літери", "Прибирає пробіли на початку й в кінці", "Обрізає до 10 символів", "Видаляє текст"], "a": 1, "w": "Щоб «   » не вважалось назвою."}], "mins": 45, "id": "forms-js", "terms": [{"t": "preventDefault", "d": "Скасовує стандартну дію браузера, наприклад перезавантаження сторінки при відправці форми.", "n": 26}, {"t": "Валідація", "d": "Перевірка, чи правильні введені дані: не порожні, потрібної довжини, в потрібному форматі.", "n": 26}]}, {"n": 27, "block": "js", "title": "Збираємо інтерактивну полицю", "sub": "Усе разом: рендер карток, додавання, пошук, фільтр, видалення і збереження в браузері. Повноцінний застосунок!", "goals": ["організувати код навколо функції render()", "реалізувати пошук і фільтр по категорії", "видаляти елементи за id", "зберігати дані в localStorage"], "sections": [{"t": "h", "v": "Архітектура: дані → render → сторінка"}, {"t": "p", "v": "Головна ідея всіх сучасних застосунків: <b>є масив даних<\/b>, і <b>є функція render()<\/b>, яка малює сторінку з цього масиву. Змінились дані — викликали render(). Ніколи не міняємо картки вручну."}, {"t": "code", "lang": "text", "v": "  дія людини  →  змінюємо масив items  →  render()  →  оновлена сторінка\n  (клік, форма)     (push, filter)          (map → innerHTML)", "run": false, "title": "Цикл застосунку", "note": null}, {"t": "h", "v": "Повний код app.js"}, {"t": "code", "lang": "javascript", "v": "// ===== 1. ДАНІ =====\nlet items = loadItems();\n\nfunction loadItems() {\n  try {\n    const saved = localStorage.getItem('polytsia');\n    if (saved) return JSON.parse(saved);   // текст → масив\n  } catch (e) {}\n  return [\n    { id: 1, title: 'Minecraft', author: 'Mojang', category: 'гра', rating: 5 },\n    { id: 2, title: 'Кобзар', author: 'Т. Шевченко', category: 'книга', rating: 5 },\n    { id: 3, title: 'Мавка', author: 'Animagrad', category: 'фільм', rating: 4 }\n  ];\n}\n\nfunction saveItems() {\n  try {\n    localStorage.setItem('polytsia', JSON.stringify(items));  // масив → текст\n  } catch (e) {}\n}\n\n// ===== 2. ЕЛЕМЕНТИ =====\nconst cardsEl  = document.querySelector('#cards');\nconst countEl  = document.querySelector('#count');\nconst searchEl = document.querySelector('#search');\nconst filterEl = document.querySelector('#filter');\nconst formEl   = document.querySelector('#add-form');\n\n// ===== 3. RENDER =====\nfunction stars(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }\n\nfunction render() {\n  const query = searchEl.value.toLowerCase();\n  const cat = filterEl.value;\n\n  const visible = items\n    .filter(i => i.title.toLowerCase().includes(query))\n    .filter(i => cat === 'усі' || i.category === cat);\n\n  countEl.textContent = `Показано ${visible.length} з ${items.length}`;\n\n  cardsEl.innerHTML = visible.map(i => `\n    <article class=\"card\">\n      <span class=\"tag\">${i.category}<\/span>\n      <h3>${i.title}<\/h3>\n      <p>${i.author}<\/p>\n      <p class=\"stars\">${stars(i.rating)}<\/p>\n      <button class=\"del\" data-id=\"${i.id}\">🗑️<\/button>\n    <\/article>\n  `).join('') || '<p>Нічого не знайдено 🤷<\/p>';\n}\n\n// ===== 4. ПОДІЇ =====\nsearchEl.addEventListener('input', render);\nfilterEl.addEventListener('change', render);\n\nformEl.addEventListener('submit', (e) => {\n  e.preventDefault();\n  items.push({\n    id: Date.now(),                                   // унікальне число\n    title: document.querySelector('#title').value,\n    author: document.querySelector('#author').value,\n    category: document.querySelector('#category').value,\n    rating: Number(document.querySelector('#rating').value)\n  });\n  saveItems();\n  render();\n  formEl.reset();\n});\n\ncardsEl.addEventListener('click', (e) => {          // делегування подій\n  if (!e.target.classList.contains('del')) return;\n  const id = Number(e.target.dataset.id);\n  items = items.filter(i => i.id !== id);\n  saveItems();\n  render();\n});\n\nrender();", "run": false, "title": "js/app.js", "note": null}, {"t": "h", "v": "Розбираємо нові штуки"}, {"t": "table", "head": ["Що", "Навіщо"], "rows": [["<code>localStorage<\/code>", "«Кишеня» браузера: дані залишаються після перезавантаження. Але лише на цьому комп'ютері й у цьому браузері!"], ["<code>JSON.stringify / JSON.parse<\/code>", "localStorage зберігає лише текст: масив → текст і назад"], ["<code>id: Date.now()<\/code>", "Унікальний номер (мілісекунди від 1970 року), щоб точно знати, яку картку видалити"], ["<code>data-id<\/code> + <code>dataset.id<\/code>", "Свій атрибут у HTML, щоб «приклеїти» id до кнопки"], ["Делегування подій", "Один слухач на батьку <code>#cards<\/code> замість слухача на кожній кнопці. Працює навіть для нових карток"], ["<code>try { } catch { }<\/code>", "«Спробуй, а якщо помилка — не падай». Наприклад, якщо localStorage заборонено"]]}, {"t": "code", "lang": "html", "v": "<input id=\"search\" placeholder=\"🔍 Пошук...\">\n<select id=\"filter\">\n  <option>усі<\/option><option>гра<\/option><option>книга<\/option><option>фільм<\/option>\n<\/select>\n<p id=\"count\"><\/p>\n<div class=\"cards\" id=\"cards\"><\/div>", "run": false, "title": "index.html — потрібні елементи", "note": null}, {"t": "warn", "v": "Проблема, яку ми розв'яжемо далі: localStorage живе <b>лише в одному браузері<\/b>. Друг не побачить твою полицю, а вдома буде порожньо. Щоб дані бачили всі й усюди, потрібен <b>сервер і база даних<\/b>. До цього ми скоро дійдемо! 🚀"}], "project": "Зроби повністю робочу полицю за кодом уроку: рендер, пошук, фільтр, додавання, видалення, збереження. Адаптуй категорії й поля під свою тему. Не копіюй бездумно: перед кожним блоком коду напиши коментар своїми словами.", "check": ["Додай річ → онови сторінку (F5) → вона на місці", "F12 → <b>Application<\/b> → Local Storage → твій сайт: там лежить JSON твоєї полиці", "Пошук не чутливий до регістру: «mine» знаходить «Minecraft»", "Console порожня, без червоного"], "hw": [{"lvl": "Обов'язково", "v": "Доведи полицю до робочого стану. Принеси на урок і покажи, як працюють пошук і видалення."}, {"lvl": "Середній", "v": "Додай сортування: select «За оцінкою / За назвою / Нові спочатку»."}, {"lvl": "Зірочка ⭐", "v": "Додай редагування оцінки: клік по зірочках змінює rating."}], "quiz": [{"q": "Навіщо JSON.stringify перед localStorage.setItem?", "o": ["Для швидкості", "localStorage зберігає лише текст", "Щоб зашифрувати", "Не потрібно"], "a": 1, "w": "Масив треба перетворити на текст."}, {"q": "Що робить функція render() у нашій архітектурі?", "o": ["Зберігає дані", "Малює сторінку з поточного масиву даних", "Видаляє картки", "Відправляє на сервер"], "a": 1, "w": "Дані → render → сторінка."}, {"q": "Головний недолік localStorage?", "o": ["Повільний", "Дані лише в одному браузері на одному пристрої", "Не зберігає українські літери", "Платний"], "a": 1, "w": "Тому далі — база даних."}], "mins": 45, "id": "shelf", "terms": [{"t": "localStorage", "d": "«Кишеня» браузера, де можна зберігати текст між перезавантаженнями. Лише на одному пристрої.", "n": 27}, {"t": "Делегування подій", "d": "Один обробник на батьківському елементі замість багатьох на дітях. Працює і для нових елементів.", "n": 27}]}, {"n": 28, "block": "js", "title": "Налагодження: як шукати й виправляти помилки", "sub": "Помилки бувають у всіх, навіть у професіоналів. Різниця в тому, що професіонал знає, як їх швидко знайти.", "goals": ["розрізняти синтаксичні, runtime- і логічні помилки", "читати повідомлення про помилки", "використовувати console.log, console.table і точки зупинки", "діяти за алгоритмом пошуку бага"], "sections": [{"t": "h", "v": "Три види помилок"}, {"t": "table", "head": ["Вид", "Що це", "Приклад", "Як помітити"], "rows": [["<b>Синтаксична<\/b>", "Код написано неправильно — JS не може його прочитати", "Пропущена дужка", "Червона помилка одразу, нічого не працює"], ["<b>Runtime<\/b>", "Код правильний, але падає під час роботи", "Звернення до null", "Червона помилка, коли доходить до рядка"], ["<b>Логічна<\/b>", "Працює без помилок, але результат неправильний", "Середня рахується з помилкою", "Немає червоного! Лише неправильний результат"]]}, {"t": "h", "v": "Читаємо помилку"}, {"t": "code", "lang": "text", "v": "Uncaught TypeError: Cannot read properties of null (reading 'addEventListener')\n    at app.js:12:27\n   ↑ тип     ↑ що сталося                          ↑ файл:рядок:символ", "run": false, "title": "Console", "note": null}, {"t": "table", "head": ["Помилка", "Переклад", "Що перевірити"], "rows": [["<code>X is not defined<\/code>", "Змінну/функцію X не знайдено", "Друкарська помилка, регістр, порядок скриптів"], ["<code>Cannot read properties of null<\/code>", "Звертаєшся до елемента, якого нема", "Селектор у querySelector, defer"], ["<code>Cannot read properties of undefined<\/code>", "Звертаєшся до властивості того, чого нема", "Індекс масиву, назва властивості"], ["<code>Unexpected token<\/code>", "Неочікуваний символ", "Дужки, лапки, коми"], ["<code>X is not a function<\/code>", "Викликаєш як функцію те, що нею не є", "Назва методу (push, не puhs)"], ["<code>Assignment to constant variable<\/code>", "Змінюєш const", "Заміни на let"]]}, {"t": "h", "v": "Знайди баг"}, {"t": "code", "lang": "javascript", "v": "const ratings = [5, 4, 3];\nlet sum = 0;\nfor (let i = 0; i <= ratings.length; i++) {\n  sum += ratings[i];\n}\nconsole.log('Середня:', sum / ratings.length);   // NaN?! чому?", "run": true, "title": null, "note": "Підказка: скільки разів виконується цикл? Що таке ratings[3]? Додай console.log(i, ratings[i]) всередину циклу."}, {"t": "h", "v": "Точки зупинки (breakpoints)"}, {"t": "steps", "v": ["F12 → вкладка <b>Sources<\/b> → зліва відкрий <code>app.js<\/code>.", "Клацни на номер рядка — з'явиться синя мітка. Це точка зупинки.", "Зроби дію на сторінці (клік, оновлення). Програма зупиниться на цьому рядку!", "Наведи мишку на будь-яку змінну — побачиш її значення. Справа — панель <b>Scope<\/b> з усіма змінними.", "Кнопки вгорі: ▶ продовжити, ⤵ наступний рядок. Йди крок за кроком і дивись, де значення стає неправильним."]}, {"t": "tip", "v": "Замість кліку на рядок можна написати в коді <code>debugger;<\/code> — з відкритими DevTools програма зупиниться там."}, {"t": "h", "v": "Алгоритм пошуку бага"}, {"t": "steps", "v": ["<b>Відтвори.<\/b> Що саме треба зробити, щоб помилка з'явилась?", "<b>Читай Console.<\/b> Є червоне? Клацни на рядок.", "<b>Звузь.<\/b> Додавай <code>console.log<\/code> у ключові місця: до якого моменту все правильно?", "<b>Перевір припущення.<\/b> Ти думаєш, що там число? Перевір <code>typeof<\/code>.", "<b>Поясни качці 🦆.<\/b> Розкажи код уголос рядок за рядком.", "<b>Виправ і перевір знову.<\/b> А заодно — чи не зламалось щось інше?"]}], "project": "Влаштуй «полювання на баги» у своїй полиці: попроси сусіда навмисно зламати 3 речі в твоєму app.js (поки ти не дивишся). Знайди й виправ усі, записуючи в коментарях, як знайшов.", "check": ["Постав breakpoint у функції render() і пройди її крок за кроком", "Спробуй <code>console.table(items)<\/code> і <code>console.error('тест')<\/code>", "Після виправлень Console чиста"], "hw": [{"lvl": "Базовий", "v": "Виправ 5 помилок у коді, який дасть учитель (або знайди баги в прикладі «Знайди баг» вище)."}, {"lvl": "Середній", "v": "Опиши в README.md три найчастіші свої помилки за курс і як ти їх тепер знаходиш."}, {"lvl": "Зірочка ⭐", "v": "Дізнайся про <b>умовні точки зупинки<\/b> (правий клік на номер рядка → Add conditional breakpoint) і використай для пошуку конкретного елемента в циклі."}, {"lvl": "Підготовка", "v": "Наступного уроку — <b>Контрольна №4: JavaScript<\/b>. Повтори уроки 22–28."}], "quiz": [{"q": "Код працює без червоних помилок, але середня оцінка неправильна. Що це за помилка?", "o": ["Синтаксична", "Runtime", "Логічна", "Мережева"], "a": 2, "w": "Логічні помилки не видно в Console."}, {"q": "Що означає «X is not defined»?", "o": ["X дорівнює 0", "Змінну або функцію X не оголошено (або написано інакше)", "X — порожній рядок", "Немає інтернету"], "a": 1, "w": "Перевір назву й регістр."}, {"q": "Що робить точка зупинки?", "o": ["Видаляє рядок", "Ставить програму на паузу на цьому рядку, щоб подивитися значення", "Прискорює код", "Виправляє помилку"], "a": 1, "w": "Breakpoint = пауза."}], "mins": 45, "id": "debug", "terms": [{"t": "Баг", "d": "Помилка в програмі, через яку вона працює не так, як задумано.", "n": 28}, {"t": "Налагодження (дебагінг)", "d": "Пошук і виправлення багів: читаєш помилку, перевіряєш значення, звужуєш місце проблеми.", "n": 28}, {"t": "Breakpoint (точка зупинки)", "d": "Позначка в коді (DevTools → Sources), де програма ставиться на паузу, щоб подивитися значення змінних.", "n": 28}]}, {"n": 29, "block": "db", "title": "Бази даних і мова SQL", "sub": "Де Instagram зберігає мільярди фото? У базі даних. Створюємо свою базу й говоримо з нею мовою SQL.", "goals": ["пояснити, що таке база даних, таблиця, рядок, стовпець, первинний ключ", "писати запити SELECT, WHERE, ORDER BY, INSERT, UPDATE, DELETE", "створити проєкт і таблицю в Supabase"], "sections": [{"t": "h", "v": "Що таке база даних"}, {"t": "p", "v": "<b>База даних (БД)<\/b> — програма, яка надійно зберігає дані на сервері, вміє швидко їх шукати й дозволяє багатьом людям працювати з ними одночасно. Найпоширеніші — <b>реляційні<\/b> бази: дані лежать у таблицях, як у Excel, але з суворими правилами."}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 250\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif' font-size=\"15\">\n<text x=\"20\" y=\"26\" font-weight=\"700\" fill=\"#18A058\" font-size=\"17\">Таблиця items<\/text>\n<rect x=\"20\" y=\"40\" width=\"720\" height=\"40\" rx=\"8\" fill=\"#18A058\"/>\n<g fill=\"#fff\" font-weight=\"700\"><text x=\"40\" y=\"66\">id<\/text><text x=\"110\" y=\"66\">title<\/text><text x=\"350\" y=\"66\">category<\/text><text x=\"500\" y=\"66\">rating<\/text><text x=\"600\" y=\"66\">created_at<\/text><\/g>\n<g fill=\"#1D1B26\">\n<rect x=\"20\" y=\"84\" width=\"720\" height=\"38\" fill=\"#fff\" stroke=\"#E7E1D6\"/><text x=\"40\" y=\"108\">1<\/text><text x=\"110\" y=\"108\">Тіні забутих предків<\/text><text x=\"350\" y=\"108\">книга<\/text><text x=\"500\" y=\"108\">5<\/text><text x=\"600\" y=\"108\">2026-11-01<\/text>\n<rect x=\"20\" y=\"122\" width=\"720\" height=\"38\" fill=\"#F3FBF6\" stroke=\"#E7E1D6\"/><text x=\"40\" y=\"146\">2<\/text><text x=\"110\" y=\"146\">Minecraft<\/text><text x=\"350\" y=\"146\">гра<\/text><text x=\"500\" y=\"146\">4<\/text><text x=\"600\" y=\"146\">2026-11-02<\/text>\n<rect x=\"20\" y=\"160\" width=\"720\" height=\"38\" fill=\"#fff\" stroke=\"#E7E1D6\"/><text x=\"40\" y=\"184\">3<\/text><text x=\"110\" y=\"184\">Мавка. Лісова пісня<\/text><text x=\"350\" y=\"184\">фільм<\/text><text x=\"500\" y=\"184\">5<\/text><text x=\"600\" y=\"184\">2026-11-03<\/text>\n<\/g>\n<text x=\"380\" y=\"232\" text-anchor=\"middle\" fill=\"#6B6878\">↔ рядок = один запис       ↕ стовпець = одна властивість       id = унікальний ключ<\/text>\n<\/svg>", "cap": "Таблиця бази даних. Згадай масив об'єктів з уроку 22: це те саме!"}, {"t": "table", "head": ["Поняття", "Простими словами", "У нашій полиці"], "rows": [["Таблиця", "Набір однотипних записів", "items"], ["Рядок (запис)", "Одна річ", "Minecraft, 5 зірок"], ["Стовпець (поле)", "Одна властивість з типом", "title (текст), rating (число)"], ["Первинний ключ", "Унікальний номер рядка, не повторюється", "id"]]}, {"t": "h", "v": "SQL — мова запитів"}, {"t": "p", "v": "SQL (вимовляють «ес-кю-ель» або «сіквел») — мова, якою ми «просимо» базу. Читається майже як англійське речення."}, {"t": "code", "lang": "sql", "v": "-- Створити таблицю\ncreate table items (\n  id bigint generated always as identity primary key,\n  title text not null,\n  author text,\n  category text,\n  rating int check (rating between 1 and 5),\n  review text,\n  created_at timestamptz default now()\n);\n\n-- Додати записи\ninsert into items (title, author, category, rating)\nvalues ('Minecraft', 'Mojang', 'гра', 5),\n       ('Кобзар', 'Т. Шевченко', 'книга', 5);\n\n-- Отримати все\nselect * from items;\n\n-- Лише ігри з оцінкою 4+, найкращі зверху\nselect title, rating from items\nwhere category = 'гра' and rating >= 4\norder by rating desc;\n\n-- Змінити\nupdate items set rating = 4 where id = 2;\n\n-- Видалити\ndelete from items where id = 2;", "run": false, "title": "Головні команди SQL", "note": null}, {"t": "warn", "v": "<code>update<\/code> і <code>delete<\/code> <b>без where<\/b> змінять/видалять УСІ рядки таблиці! Завжди спочатку пиши <code>where<\/code>."}, {"t": "h", "v": "Supabase: база даних у хмарі"}, {"t": "p", "v": "<b>Supabase<\/b> — сервіс, що дає справжню базу PostgreSQL (її використовують великі компанії) з безкоштовним планом. Плюс одразу готовий API, щоб звертатися до бази з JavaScript."}, {"t": "steps", "v": ["Зайди на <a href='https://supabase.com' target='_blank'>supabase.com<\/a> → <b>Start your project<\/b> → увійди через GitHub.", "<b>New project<\/b>: назва <code>polytsia<\/code>, придумай пароль бази (збережи!), регіон — <b>Central EU (Frankfurt)<\/b>, найближчий до нас.", "Зачекай 1–2 хвилини, поки проєкт створиться.", "Ліве меню → <b>SQL Editor<\/b> → встав код <code>create table<\/code> з прикладу вище → <b>Run<\/b>.", "Ліве меню → <b>Table Editor<\/b> → <code>items<\/code>: твоя таблиця! Додай кілька рядків кнопкою <b>Insert row<\/b> або через <code>insert<\/code> у SQL Editor."]}, {"t": "tip", "v": "Безкоштовний проєкт Supabase «засинає», якщо ним тиждень не користуватися. Нічого не губиться: просто зайди в панель і натисни <b>Restore<\/b>."}, {"t": "try", "v": "<!-- Тренажер: «виконай» SQL у голові й перевір себе -->\n<style>body{font-family:sans-serif} code{background:#eee;padding:2px 6px;border-radius:4px}<\/style>\n<p>Таблиця: Minecraft (гра, 5), Кобзар (книга, 5), Мавка (фільм, 4), Terraria (гра, 4), Portal 2 (гра, 3)<\/p>\n<p><code>select title from items where category = 'гра' and rating &gt; 3<\/code><\/p>\n<details><summary>Показати відповідь<\/summary><p>Minecraft, Terraria<\/p><\/details>\n<p><code>select count(*) from items where rating = 5<\/code><\/p>\n<details><summary>Показати відповідь<\/summary><p>2<\/p><\/details>", "title": "Тренажер SQL"}], "project": "Створи проєкт Supabase і таблицю <code>items<\/code> з полями під свою тему (можна додати свої: <code>year<\/code>, <code>image_url<\/code>). Через SQL Editor додай 6+ записів. Напиши 3 запити select з where і order by.", "check": ["Table Editor показує всі твої записи", "Спробуй вставити рядок з rating = 7: база має відмовити (спрацював <code>check<\/code>)", "Збережи всі свої SQL-запити у файл <code>sql/queries.sql<\/code> у проєкті"], "hw": [{"lvl": "Базовий", "v": "Пройди перші 6 уроків інтерактивного тренажера <a href='https://sqlbolt.com' target='_blank'>SQLBolt<\/a>."}, {"lvl": "Середній", "v": "Спроєктуй на папері таблицю для шкільної бібліотеки: які стовпці, які типи, що буде первинним ключем."}, {"lvl": "Зірочка ⭐", "v": "Дізнайся про <code>group by<\/code> і напиши запит: скільки речей у кожній категорії та середня оцінка."}], "quiz": [{"q": "Що таке первинний ключ?", "o": ["Пароль від бази", "Унікальний ідентифікатор кожного рядка", "Перший стовпець", "Назва таблиці"], "a": 1, "w": "Наприклад, id."}, {"q": "Який запит поверне всі записи з таблиці items?", "o": ["get items", "select * from items", "show items all", "items.select()"], "a": 1, "w": "* = усі стовпці."}, {"q": "Що станеться після delete from items без where?", "o": ["Нічого", "Видалиться перший рядок", "Видаляться ВСІ рядки", "Помилка"], "a": 2, "w": "Обережно з delete!"}], "mins": 45, "id": "sql", "terms": [{"t": "База даних", "d": "Програма на сервері, що надійно зберігає дані й швидко їх шукає. Дані лежать у таблицях.", "n": 29}, {"t": "Запис (рядок)", "d": "Один об'єкт у таблиці бази даних, наприклад одна гра.", "n": 29}, {"t": "Поле (стовпець)", "d": "Одна властивість усіх записів таблиці з певним типом: title — текст, rating — число.", "n": 29}, {"t": "Первинний ключ", "d": "Поле з унікальним значенням для кожного запису (зазвичай id), за яким запис точно знаходиться.", "n": 29}, {"t": "SQL", "d": "Мова запитів до бази даних: SELECT (отримати), INSERT (додати), UPDATE (змінити), DELETE (видалити).", "n": 29}, {"t": "Supabase", "d": "Хмарний сервіс: база PostgreSQL + готовий API + правила доступу. «Бекенд, який уже написали за тебе».", "n": 29}]}, {"n": 30, "block": "db", "title": "SQL-практикум: підрахунки, пошук і зв'язки", "sub": "Вчимося ставити базі складні питання: скільки, яка середня, хто найкращий, і як з'єднати дві таблиці.", "goals": ["рахувати через count, avg, sum, max, min", "групувати через group by", "шукати за шаблоном через like", "пов'язувати таблиці через зовнішній ключ і join"], "sections": [{"t": "h", "v": "Підрахунки (агрегатні функції)"}, {"t": "code", "lang": "sql", "v": "select count(*) from items;                      -- скільки всього\nselect avg(rating) from items;                   -- середня оцінка\nselect max(rating), min(rating) from items;      -- найкраща й найгірша\n\n-- скільки ігор з оцінкою 5?\nselect count(*) from items where category = 'гра' and rating = 5;", "run": false, "title": null, "note": null}, {"t": "h", "v": "Групування"}, {"t": "code", "lang": "sql", "v": "-- скільки речей і яка середня оцінка в кожній категорії\nselect category, count(*) as total, round(avg(rating), 1) as avg_rating\nfrom items\ngroup by category\norder by total desc;", "run": false, "title": null, "note": "<code>as<\/code> дає стовпцю зрозумілу назву. Результат — маленька таблиця: категорія | total | avg_rating."}, {"t": "h", "v": "Пошук за шаблоном і обмеження"}, {"t": "code", "lang": "sql", "v": "-- назви, що містять «craft» (без різниці великі/малі літери)\nselect * from items where title ilike '%craft%';\n\n-- топ-3 найновіших\nselect title, created_at from items order by created_at desc limit 3;", "run": false, "title": null, "note": null}, {"t": "h", "v": "Дві таблиці: відгуки до речей"}, {"t": "p", "v": "Одна гра може мати багато відгуків від різних людей. Тримати їх усі в одному рядку незручно, тому робимо <b>другу таблицю<\/b> і зв'язуємо через <b>зовнішній ключ<\/b> (foreign key):"}, {"t": "code", "lang": "sql", "v": "create table reviews (\n  id bigint generated always as identity primary key,\n  item_id bigint references items(id) on delete cascade,   -- зв'язок!\n  author text not null,\n  text text,\n  stars int check (stars between 1 and 5)\n);\n\ninsert into reviews (item_id, author, text, stars) values\n  (1, 'Марія', 'Найкраща гра для творчості', 5),\n  (1, 'Богдан', 'Трохи нудно самому', 4);\n\n-- JOIN: показати відгуки разом з назвою гри\nselect items.title, reviews.author, reviews.stars\nfrom reviews\njoin items on items.id = reviews.item_id;", "run": false, "title": "SQL Editor", "note": null}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 250\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif' font-size=\"15\">\n<text x=\"20\" y=\"26\" font-weight=\"700\" fill=\"#18A058\" font-size=\"17\">Таблиця items<\/text>\n<rect x=\"20\" y=\"40\" width=\"720\" height=\"40\" rx=\"8\" fill=\"#18A058\"/>\n<g fill=\"#fff\" font-weight=\"700\"><text x=\"40\" y=\"66\">id<\/text><text x=\"110\" y=\"66\">title<\/text><text x=\"350\" y=\"66\">category<\/text><text x=\"500\" y=\"66\">rating<\/text><text x=\"600\" y=\"66\">created_at<\/text><\/g>\n<g fill=\"#1D1B26\">\n<rect x=\"20\" y=\"84\" width=\"720\" height=\"38\" fill=\"#fff\" stroke=\"#E7E1D6\"/><text x=\"40\" y=\"108\">1<\/text><text x=\"110\" y=\"108\">Тіні забутих предків<\/text><text x=\"350\" y=\"108\">книга<\/text><text x=\"500\" y=\"108\">5<\/text><text x=\"600\" y=\"108\">2026-11-01<\/text>\n<rect x=\"20\" y=\"122\" width=\"720\" height=\"38\" fill=\"#F3FBF6\" stroke=\"#E7E1D6\"/><text x=\"40\" y=\"146\">2<\/text><text x=\"110\" y=\"146\">Minecraft<\/text><text x=\"350\" y=\"146\">гра<\/text><text x=\"500\" y=\"146\">4<\/text><text x=\"600\" y=\"146\">2026-11-02<\/text>\n<rect x=\"20\" y=\"160\" width=\"720\" height=\"38\" fill=\"#fff\" stroke=\"#E7E1D6\"/><text x=\"40\" y=\"184\">3<\/text><text x=\"110\" y=\"184\">Мавка. Лісова пісня<\/text><text x=\"350\" y=\"184\">фільм<\/text><text x=\"500\" y=\"184\">5<\/text><text x=\"600\" y=\"184\">2026-11-03<\/text>\n<\/g>\n<text x=\"380\" y=\"232\" text-anchor=\"middle\" fill=\"#6B6878\">↔ рядок = один запис       ↕ стовпець = одна властивість       id = унікальний ключ<\/text>\n<\/svg>", "cap": "Таблиця items. Кожен відгук у reviews «посилається» на рядок звідси через item_id."}, {"t": "tip", "v": "<code>on delete cascade<\/code>: якщо видалити гру, її відгуки видаляться автоматично. Без цього база не дасть видалити гру, на яку є посилання."}], "project": "У своїй базі напиши й збережи в <code>sql/queries.sql<\/code> 6 запитів: кількість, середня, групування за категоріями, пошук за шаблоном, топ-3, і створи таблицю <code>reviews<\/code> з 5+ відгуками та join-запитом.", "check": ["Supabase → Table Editor: таблиця reviews має стрілку-зв'язок з items", "Спробуй додати відгук з item_id = 9999: база має відмовити", "Кожен запит у файлі має коментар-пояснення"], "hw": [{"lvl": "Базовий", "v": "SQLBolt: уроки 7–12."}, {"lvl": "Середній", "v": "Запит: середня оцінка кожної гри за відгуками (join + group by)."}, {"lvl": "Зірочка ⭐", "v": "Спроєктуй базу для шкільної бібліотеки з 3 таблиць (книги, учні, видачі). Намалюй зв'язки і напиши create table."}], "quiz": [{"q": "Що поверне select count(*) from items?", "o": ["Усі записи", "Кількість записів", "Перший запис", "Назви стовпців"], "a": 1, "w": "count = скільки."}, {"q": "Навіщо group by category?", "o": ["Відсортувати", "Порахувати окремо для кожної категорії", "Видалити дублікати", "Створити категорію"], "a": 1, "w": "Групування."}, {"q": "Що таке зовнішній ключ?", "o": ["Пароль", "Поле, що посилається на id в іншій таблиці", "Перший стовпець", "Ключ API"], "a": 1, "w": "Зв'язок між таблицями."}], "mins": 45, "id": "sql2", "terms": [{"t": "Агрегація", "d": "Обчислення по багатьох рядках одразу: count (скільки), avg (середнє), sum, max, min.", "n": 30}, {"t": "JOIN", "d": "Об'єднання двох таблиць за спільним полем, наприклад відгуки + ігри за item_id.", "n": 30}]}, {"n": 31, "block": "db", "title": "Як браузер говорить із сервером: HTTP, API, fetch", "sub": "Клієнт, сервер, запит, відповідь, JSON. Вчимося завантажувати дані з інтернету через JavaScript.", "goals": ["пояснити, що таке API і HTTP-методи", "надсилати запити через fetch", "використовувати async / await і try / catch", "дивитися запити у вкладці Network"], "sections": [{"t": "h", "v": "Повна картина"}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 250\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif'>\n<defs><marker id=\"a4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1D1B26\"/><\/marker><\/defs>\n<rect x=\"15\" y=\"50\" width=\"200\" height=\"130\" rx=\"16\" fill=\"#FFE3D6\" stroke=\"#F0622E\" stroke-width=\"2\"/><text x=\"115\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"#1D1B26\">Фронтенд<\/text><text x=\"115\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6B6878\">HTML · CSS · JS<\/text><text x=\"115\" y=\"140\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6B6878\">в браузері<\/text>\n<rect x=\"280\" y=\"50\" width=\"200\" height=\"130\" rx=\"16\" fill=\"#DCE8FF\" stroke=\"#2F6FEB\" stroke-width=\"2\"/><text x=\"380\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"#1D1B26\">Бекенд<\/text><text x=\"380\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6B6878\">сервер, правила,<\/text><text x=\"380\" y=\"140\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6B6878\">секретні ключі<\/text>\n<rect x=\"545\" y=\"50\" width=\"200\" height=\"130\" rx=\"16\" fill=\"#D7F5E3\" stroke=\"#18A058\" stroke-width=\"2\"/><text x=\"645\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"#1D1B26\">База даних<\/text><text x=\"645\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6B6878\">таблиці, що<\/text><text x=\"645\" y=\"140\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6B6878\">зберігаються назавжди<\/text>\n<line x1=\"218\" y1=\"98\" x2=\"275\" y2=\"98\" stroke=\"#1D1B26\" stroke-width=\"2\" marker-end=\"url(#a4)\"/><line x1=\"277\" y1=\"132\" x2=\"220\" y2=\"132\" stroke=\"#1D1B26\" stroke-width=\"2\" marker-end=\"url(#a4)\"/>\n<line x1=\"483\" y1=\"98\" x2=\"540\" y2=\"98\" stroke=\"#1D1B26\" stroke-width=\"2\" marker-end=\"url(#a4)\"/><line x1=\"542\" y1=\"132\" x2=\"485\" y2=\"132\" stroke=\"#1D1B26\" stroke-width=\"2\" marker-end=\"url(#a4)\"/>\n<text x=\"247\" y=\"210\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1D1B26\">fetch → JSON<\/text><text x=\"512\" y=\"210\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1D1B26\">SQL<\/text>\n<text x=\"380\" y=\"30\" text-anchor=\"middle\" font-size=\"14\" fill=\"#6B6878\">Повний стек: що бачить користувач → хто приймає рішення → де лежать дані<\/text>\n<text x=\"380\" y=\"240\" text-anchor=\"middle\" font-size=\"13\" fill=\"#18A058\">Supabase = готовий бекенд + база в одному<\/text>\n<\/svg>", "cap": "Фронтенд — те, що ти вже вмієш. Сьогодні вчимося з'єднувати його з сервером."}, {"t": "p", "v": "<b>API<\/b> (Application Programming Interface) — це «меню ресторану» для програм: список адрес, за якими сервер приймає запити, і того, що він на них відповідає. Ти не заходиш на кухню (у базу) — ти робиш замовлення через офіціанта (API)."}, {"t": "h", "v": "HTTP: мова запитів"}, {"t": "table", "head": ["Метод", "Що означає", "Приклад"], "rows": [["<b>GET<\/b>", "Отримати дані", "Дай список ігор"], ["<b>POST<\/b>", "Створити нове", "Додай гру"], ["<b>PUT / PATCH<\/b>", "Змінити", "Зміни оцінку"], ["<b>DELETE<\/b>", "Видалити", "Видали гру №3"]]}, {"t": "table", "head": ["Код відповіді", "Значення"], "rows": [["<b>200<\/b> OK / <b>201<\/b> Created", "✅ Усе добре"], ["<b>400<\/b> Bad Request", "❌ Ти надіслав щось не те"], ["<b>401 / 403<\/b>", "🔒 Немає доступу"], ["<b>404<\/b> Not Found", "🤷 Такої адреси нема"], ["<b>500<\/b> Server Error", "💥 Сервер зламався"]]}, {"t": "h", "v": "fetch — запит з JavaScript"}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 240\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif'>\n<defs><marker id=\"a5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1D1B26\"/><\/marker><\/defs>\n<rect x=\"15\" y=\"20\" width=\"250\" height=\"200\" rx=\"14\" fill=\"#1D1B26\"/><text x=\"35\" y=\"50\" font-size=\"14\" fill=\"#9C98A8\" font-family='JetBrains Mono, monospace'>// браузер<\/text>\n<text x=\"35\" y=\"80\" font-size=\"14\" fill=\"#7FB0FF\" font-family='JetBrains Mono, monospace'>const res = await<\/text><text x=\"35\" y=\"102\" font-size=\"14\" fill=\"#E8A400\" font-family='JetBrains Mono, monospace'>  fetch('/api/items')<\/text><text x=\"35\" y=\"132\" font-size=\"14\" fill=\"#7FB0FF\" font-family='JetBrains Mono, monospace'>const data = await<\/text><text x=\"35\" y=\"154\" font-size=\"14\" fill=\"#E8A400\" font-family='JetBrains Mono, monospace'>  res.json()<\/text>\n<line x1=\"275\" y1=\"80\" x2=\"480\" y2=\"80\" stroke=\"#1D1B26\" stroke-width=\"2.5\" marker-end=\"url(#a5)\"/><text x=\"378\" y=\"68\" text-anchor=\"middle\" font-size=\"14\" fill=\"#1D1B26\">GET /api/items<\/text>\n<line x1=\"480\" y1=\"160\" x2=\"275\" y2=\"160\" stroke=\"#18A058\" stroke-width=\"2.5\" marker-end=\"url(#a5)\"/><text x=\"378\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#18A058\">200 OK + JSON<\/text>\n<rect x=\"490\" y=\"20\" width=\"255\" height=\"200\" rx=\"14\" fill=\"#fff\" stroke=\"#1D1B26\" stroke-width=\"2\"/><text x=\"510\" y=\"50\" font-size=\"14\" fill=\"#6B6878\" font-family='JetBrains Mono, monospace'>відповідь (JSON)<\/text>\n<text x=\"510\" y=\"82\" font-size=\"14\" fill=\"#1D1B26\" font-family='JetBrains Mono, monospace'>[<\/text><text x=\"525\" y=\"104\" font-size=\"14\" fill=\"#1D1B26\" font-family='JetBrains Mono, monospace'>{ \"id\": 1,<\/text><text x=\"540\" y=\"126\" font-size=\"14\" fill=\"#18A058\" font-family='JetBrains Mono, monospace'>\"title\": \"Minecraft\",<\/text><text x=\"540\" y=\"148\" font-size=\"14\" fill=\"#2F6FEB\" font-family='JetBrains Mono, monospace'>\"rating\": 4 }<\/text><text x=\"510\" y=\"170\" font-size=\"14\" fill=\"#1D1B26\" font-family='JetBrains Mono, monospace'>]<\/text>\n<\/svg>", "cap": "fetch надсилає запит, сервер повертає JSON, ми перетворюємо його на масив."}, {"t": "code", "lang": "javascript", "v": "// Погода в Києві — безкоштовний API без реєстрації (open-meteo.com)\nconst url = 'https://api.open-meteo.com/v1/forecast?latitude=50.45&longitude=30.52&current=temperature_2m';\n\nasync function loadWeather() {\n  try {\n    const response = await fetch(url);          // 1. надіслати запит, чекати\n    if (!response.ok) throw new Error(response.status);\n    const data = await response.json();         // 2. JSON → об'єкт, чекати\n    console.log(data);                          // подивись структуру!\n    const t = data.current.temperature_2m;\n    document.querySelector('#weather').textContent = `У Києві зараз ${t}°C`;\n  } catch (error) {\n    console.error('Не вдалося завантажити:', error);\n    document.querySelector('#weather').textContent = 'Погода недоступна 😢';\n  }\n}\n\nloadWeather();", "run": false, "title": "js/weather.js", "note": "Цей приклад запускай у себе через Live Server: пісочниця курсу не має доступу до інтернету."}, {"t": "h", "v": "async / await простими словами"}, {"t": "p", "v": "Запит у мережу триває якийсь час (мілісекунди або секунди). <code>await<\/code> каже: «зачекай на відповідь, а потім іди далі». Використовувати <code>await<\/code> можна лише всередині функції, позначеної <code>async<\/code>."}, {"t": "idea", "v": "Це як замовити піцу: зробив замовлення (<code>fetch<\/code>), <i>чекаєш<\/i> кур'єра (<code>await<\/code>), відкрив коробку (<code>.json()<\/code>), їси (виводиш на сторінку). А якщо піцу не привезли — <code>catch<\/code> 🍕"}, {"t": "h", "v": "Вкладка Network — рентген запитів"}, {"t": "steps", "v": ["F12 → <b>Network<\/b> → фільтр <b>Fetch/XHR<\/b>.", "Онови сторінку: з'явиться рядок з твоїм запитом.", "Клацни на нього: <b>Headers<\/b> (куди й яким методом), <b>Preview<\/b> (що відповів сервер, гарно розгорнуто), <b>Timing<\/b> (скільки часу)."]}, {"t": "p", "v": "Ще один безкоштовний тестовий API: <code>https://jsonplaceholder.typicode.com/users<\/code>. Відкрий цю адресу прямо в браузері — побачиш JSON."}], "project": "Додай у футер полиці віджет погоди твого міста (координати знайди в Google Maps). Покажи температуру, а якщо помилка — повідомлення. Перевір запит у Network.", "check": ["Network → Fetch/XHR: запит до open-meteo зі статусом 200", "Вимкни інтернет (або Network → Offline) → онови: показується повідомлення про помилку, а не порожнеча", "Console: у <code>data<\/code> видно повну структуру відповіді"], "hw": [{"lvl": "Базовий", "v": "Виведи список імен користувачів з <code>jsonplaceholder.typicode.com/users<\/code> на сторінку."}, {"lvl": "Середній", "v": "Сторінка «Факт про котів»: кнопка, що завантажує випадковий факт з <code>https://catfact.ninja/fact<\/code>."}, {"lvl": "Зірочка ⭐", "v": "Додай до погоди прогноз на 3 дні (параметр <code>daily<\/code> у документації open-meteo.com)."}], "quiz": [{"q": "Який HTTP-метод для отримання даних?", "o": ["POST", "GET", "DELETE", "PUT"], "a": 1, "w": "GET — отримати."}, {"q": "Що означає статус 404?", "o": ["Все добре", "Не знайдено", "Сервер зламався", "Немає доступу"], "a": 1, "w": "Not Found."}, {"q": "Навіщо await перед fetch?", "o": ["Щоб прискорити", "Щоб зачекати на відповідь сервера", "Щоб зашифрувати", "Без нього не працює консоль"], "a": 1, "w": "await чекає результат."}], "mins": 45, "id": "fetch", "terms": [{"t": "API", "d": "Набір адрес і правил, як програма може звертатися до сервера. «Меню ресторану» для програм.", "n": 31}, {"t": "HTTP", "d": "Мова, якою браузер і сервер обмінюються запитами й відповідями. Методи: GET, POST, PUT, DELETE.", "n": 31}, {"t": "Статус-код", "d": "Число у відповіді сервера: 200 — добре, 404 — не знайдено, 500 — помилка сервера.", "n": 31}, {"t": "fetch", "d": "Функція JS для надсилання запиту на сервер і отримання відповіді.", "n": 31}, {"t": "async / await", "d": "Спосіб писати код, що чекає на відповідь (наприклад, від сервера), не блокуючи сторінку.", "n": 31}]}, {"n": 32, "block": "db", "title": "Свій бекенд: сервер на Node.js + Express", "sub": "Пишемо справжній сервер з API: він приймає запити, перевіряє дані й зберігає їх. Тепер ти розумієш, як працює «кухня» будь-якого сайту.", "goals": ["пояснити, навіщо потрібен бекенд", "запустити сервер на Node.js і Express", "створити API-маршрути GET, POST, DELETE", "підключити фронтенд полиці до свого API"], "sections": [{"t": "h", "v": "Навіщо бекенд, якщо є фронтенд?"}, {"t": "cards", "v": [{"i": "🛡️", "h": "Правила", "p": "Фронтенд можна обійти (ти ж змінював сторінки в DevTools!). Тому перевірка даних має бути на сервері."}, {"i": "🔑", "h": "Секрети", "p": "Паролі до бази й ключі платних сервісів не можна класти в браузер: їх побачить кожен через F12."}, {"i": "🤝", "h": "Спільні дані", "p": "Сервер один для всіх: що додав ти, бачить і твій друг."}]}, {"t": "h", "v": "Встановлюємо Node.js"}, {"t": "p", "v": "<b>Node.js<\/b> — це JavaScript поза браузером. Той самий JS, але він може працювати з файлами й бути сервером."}, {"t": "steps", "v": ["Завантаж <b>LTS<\/b>-версію з <a href='https://nodejs.org' target='_blank'>nodejs.org<\/a> і встанови (на шкільних ПК потрібні права адміністратора; альтернатива — GitHub Codespaces, там Node вже є).", "У VS Code відкрий термінал: <b>Terminal → New Terminal<\/b> (<kbd>Ctrl<\/kbd>+<kbd>`<\/kbd>).", "Перевір: <code>node -v<\/code> має показати версію."]}, {"t": "h", "v": "Структура проєкту"}, {"t": "code", "lang": "text", "v": "polytsia-server/\n├── server.js        ← наш бекенд\n├── items.json       ← «база даних» у файлі (створиться сама)\n├── package.json     ← опис проєкту (створить npm)\n└── public/          ← фронтенд: index.html, css/, js/ з попередніх уроків\n    ├── index.html\n    ├── css/style.css\n    └── js/app.js", "run": false, "title": "Нова папка", "note": null}, {"t": "code", "lang": "bash", "v": "npm init -y          # створити package.json\nnpm install express  # встановити бібліотеку Express", "run": false, "title": "Термінал", "note": null}, {"t": "h", "v": "Код сервера"}, {"t": "code", "lang": "javascript", "v": "const express = require('express');\nconst fs = require('fs');\n\nconst app = express();\nconst PORT = 3000;\nconst FILE = 'items.json';\n\napp.use(express.json());              // розуміти JSON у запитах\napp.use(express.static('public'));    // віддавати фронтенд з папки public\n\nfunction readItems() {\n  if (!fs.existsSync(FILE)) return [];\n  return JSON.parse(fs.readFileSync(FILE, 'utf8'));\n}\nfunction writeItems(items) {\n  fs.writeFileSync(FILE, JSON.stringify(items, null, 2));\n}\n\n// GET /api/items — віддати всю колекцію\napp.get('/api/items', (req, res) => {\n  res.json(readItems());\n});\n\n// POST /api/items — додати нову річ (з перевіркою!)\napp.post('/api/items', (req, res) => {\n  const { title, author, category } = req.body;\n  const rating = Number(req.body.rating);\n\n  if (!title || title.length > 100) {\n    return res.status(400).json({ error: 'Назва обовʼязкова, до 100 символів' });\n  }\n  if (!(rating >= 1 && rating <= 5)) {\n    return res.status(400).json({ error: 'Оцінка має бути від 1 до 5' });\n  }\n\n  const items = readItems();\n  const item = { id: Date.now(), title, author, category, rating };\n  items.push(item);\n  writeItems(items);\n  res.status(201).json(item);\n});\n\n// DELETE /api/items/123 — видалити за id\napp.delete('/api/items/:id', (req, res) => {\n  const id = Number(req.params.id);\n  writeItems(readItems().filter(i => i.id !== id));\n  res.status(204).end();\n});\n\napp.listen(PORT, () => {\n  console.log(`✅ Сервер працює: http://localhost:${PORT}`);\n});", "run": false, "title": "server.js", "note": null}, {"t": "code", "lang": "bash", "v": "node --watch server.js   # --watch перезапускає сервер після кожного збереження", "run": false, "title": "Запуск", "note": "Відкрий <code>http://localhost:3000/api/items<\/code> — побачиш JSON. А <code>http://localhost:3000<\/code> — свою полицю. Зупинити сервер: <kbd>Ctrl<\/kbd>+<kbd>C<\/kbd>."}, {"t": "h", "v": "Фронтенд говорить з нашим API"}, {"t": "code", "lang": "javascript", "v": "let items = [];\n\nasync function loadItems() {\n  const res = await fetch('/api/items');\n  items = await res.json();\n  render();\n}\n\nasync function addItem(newItem) {\n  const res = await fetch('/api/items', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify(newItem)\n  });\n  if (!res.ok) {\n    const { error } = await res.json();\n    alert(error);                 // сервер сказав, що не так\n    return;\n  }\n  await loadItems();\n}\n\nasync function deleteItem(id) {\n  await fetch(`/api/items/${id}`, { method: 'DELETE' });\n  await loadItems();\n}\n\nloadItems();", "run": false, "title": "public/js/app.js — що змінюється", "note": "Функція render() і події залишаються з уроку 27. Замість localStorage викликаємо addItem / deleteItem."}, {"t": "warn", "v": "Експеримент для класу: прибери в HTML атрибут <code>max=\"5\"<\/code> і спробуй додати оцінку 10. Фронтенд пропустить, а сервер відповість <b>400<\/b>. Ось чому перевірка на сервері — обов'язкова."}, {"t": "tip", "v": "Цей сервер працює лише на твоєму комп'ютері (localhost). Щоб він був в інтернеті, його розміщують на хостингу (Render, Railway тощо). Але є шлях простіше: готовий бекенд + база в хмарі. Це наступний урок."}], "project": "Створи <code>polytsia-server<\/code>, перенеси фронтенд у <code>public/<\/code>, напиши server.js. Переведи полицю з localStorage на свій API: завантаження, додавання, видалення.", "check": ["Network: при додаванні видно запит <b>POST<\/b> /api/items зі статусом <b>201<\/b>", "Відкрий <code>items.json<\/code> у VS Code — там з'явились нові записи", "Відкрий полицю у двох вкладках: додай у першій, онови другу — річ є", "Термінал з сервером: якщо там помилка — читай її, вона каже рядок"], "hw": [{"lvl": "Базовий", "v": "Додай маршрут <code>GET /api/stats<\/code>, який повертає <code>{ count, average }<\/code>."}, {"lvl": "Середній", "v": "Додай маршрут <code>PATCH /api/items/:id<\/code> для зміни оцінки й кнопки «+» / «−» на картці."}, {"lvl": "Зірочка ⭐", "v": "Додай параметр пошуку: <code>GET /api/items?q=mine<\/code> фільтрує на сервері (<code>req.query.q<\/code>)."}], "quiz": [{"q": "Чому перевірку даних обов'язково робити на сервері?", "o": ["Сервер швидший", "Фронтенд може обійти будь-хто через DevTools", "Так красивіше", "Браузер не вміє перевіряти"], "a": 1, "w": "Сервер — останній рубіж."}, {"q": "Що робить app.get('/api/items', ...)?", "o": ["Видаляє items", "Створює маршрут, що відповідає на GET-запити за цією адресою", "Завантажує сторінку", "Встановлює Express"], "a": 1, "w": "Маршрут = адреса + метод + обробник."}, {"q": "Що таке localhost?", "o": ["Сайт Google", "Твій власний комп'ютер", "База даних", "Хостинг"], "a": 1, "w": "localhost = «цей комп'ютер»."}], "mins": 90, "id": "express", "terms": [{"t": "Фронтенд", "d": "Частина застосунку, яку бачить і з якою взаємодіє людина: HTML, CSS, JS у браузері.", "n": 32}, {"t": "Бекенд", "d": "Серверна частина: приймає запити, перевіряє дані, працює з базою й секретами.", "n": 32}, {"t": "Node.js", "d": "Програма, що запускає JavaScript поза браузером, наприклад як сервер.", "n": 32}, {"t": "npm", "d": "Менеджер пакетів Node.js: встановлює готові бібліотеки командою npm install.", "n": 32}, {"t": "Express", "d": "Популярна бібліотека для Node.js, з якою легко писати сервер і API-маршрути.", "n": 32}, {"t": "Маршрут (endpoint)", "d": "Адреса + метод, на які відповідає сервер, наприклад GET /api/items.", "n": 32}, {"t": "localhost", "d": "«Цей комп'ютер». Адреса, за якою відкривається сервер, запущений у тебе.", "n": 32}]}, {"n": 33, "block": "db", "title": "Полиця у хмарі: підключаємо Supabase", "sub": "Підключаємо полицю до справжньої бази даних. Тепер твою колекцію бачать усі, з будь-якого пристрою.", "goals": ["підключати бібліотеку supabase-js", "читати й додавати записи з JavaScript", "розуміти publishable і secret ключі", "налаштовувати правила доступу RLS"], "sections": [{"t": "h", "v": "Supabase = готовий бекенд"}, {"t": "p", "v": "Минулого уроку ми самі написали сервер з API й перевірками. Supabase дає все це готовим: <b>база PostgreSQL + автоматичний API + правила доступу + авторизація<\/b>. Ми пишемо лише фронтенд, а «кухню» тримає Supabase."}, {"t": "table", "head": ["", "Свій Express", "Supabase"], "rows": [["API", "Пишемо самі", "Готовий, генерується з таблиць"], ["Де дані", "Файл items.json", "Справжня база PostgreSQL"], ["Перевірки", "if у server.js", "<code>check<\/code> у таблиці + правила RLS"], ["Хостинг", "Треба шукати окремо", "Уже в хмарі"], ["Для чого добре", "Зрозуміти, як усе влаштовано", "Швидко зробити реальний продукт"]]}, {"t": "h", "v": "Крок 1. Правила доступу (RLS)"}, {"t": "p", "v": "<b>Row Level Security<\/b> — «охоронець» таблиці. Поки його не налаштуєш, з браузера нічого не можна прочитати. Дозволимо всім читати й додавати (для навчального проєкту це ок):"}, {"t": "code", "lang": "sql", "v": "alter table items enable row level security;\n\n-- усі можуть читати\ncreate policy \"read all\" on items\n  for select to anon using (true);\n\n-- усі можуть додавати\ncreate policy \"insert all\" on items\n  for insert to anon with check (true);", "run": false, "title": "SQL Editor", "note": null}, {"t": "h", "v": "Крок 2. Ключі"}, {"t": "steps", "v": ["Supabase → <b>Project Settings → API Keys<\/b> (або кнопка <b>Connect<\/b> вгорі).", "Скопіюй <b>Project URL<\/b> (вигляд <code>https://xxxx.supabase.co<\/code>).", "Скопіюй <b>Publishable key<\/b> (починається з <code>sb_publishable_<\/code>)."]}, {"t": "warn", "v": "<b>Publishable key<\/b> можна класти в браузер: він дає лише ті права, що дозволені RLS. <b>Secret key<\/b> — НІКОЛИ не клади у фронтенд і не викладай на GitHub: з ним можна все, навіть видалити базу. Його місце — лише на сервері (як у нашому Express)."}, {"t": "h", "v": "Крок 3. Код"}, {"t": "code", "lang": "html", "v": "<!-- замість <script src=\"js/app.js\" defer> -->\n<script type=\"module\" src=\"js/app.js\"><\/script>", "run": false, "title": "index.html", "note": null}, {"t": "code", "lang": "javascript", "v": "import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';\n\nconst SUPABASE_URL = 'https://ТВІЙ-ПРОЄКТ.supabase.co';\nconst SUPABASE_KEY = 'sb_publishable_...';\nconst db = createClient(SUPABASE_URL, SUPABASE_KEY);\n\nlet items = [];\n\n// ЧИТАННЯ: select * from items order by created_at desc\nasync function loadItems() {\n  countEl.textContent = 'Завантаження... ⏳';\n  const { data, error } = await db\n    .from('items')\n    .select('*')\n    .order('created_at', { ascending: false });\n\n  if (error) {\n    console.error(error);\n    countEl.textContent = 'Помилка завантаження 😢';\n    return;\n  }\n  items = data;\n  render();\n}\n\n// ДОДАВАННЯ: insert into items (...) values (...)\nasync function addItem(newItem) {\n  const { error } = await db.from('items').insert(newItem);\n  if (error) {\n    console.error(error);\n    alert('Не вдалося зберегти: ' + error.message);\n    return;\n  }\n  await loadItems();\n}\n\nformEl.addEventListener('submit', async (e) => {\n  e.preventDefault();\n  await addItem({\n    title: document.querySelector('#title').value,\n    author: document.querySelector('#author').value,\n    category: document.querySelector('#category').value,\n    rating: Number(document.querySelector('#rating').value),\n    review: document.querySelector('#review').value\n  });\n  formEl.reset();\n});\n\nloadItems();", "run": false, "title": "js/app.js", "note": "Решта (render, пошук, фільтр) — з уроку 27. Порівняй з SQL: <code>.from('items').select('*')<\/code> — це те саме, що <code>select * from items<\/code>!"}, {"t": "tip", "v": "Фільтрувати можна прямо в базі: <code>db.from('items').select('*').eq('category', 'гра')<\/code> — те саме, що <code>where category = 'гра'<\/code>. Є ще <code>.gt<\/code> (більше), <code>.lt<\/code> (менше), <code>.ilike<\/code> (пошук за текстом)."}, {"t": "tip", "v": "Хочеш, щоб нові речі з'являлися в усіх одразу, без оновлення сторінки? Дізнайся про <b>Supabase Realtime<\/b>, це вже рівень зірочки ⭐"}, {"t": "h", "v": "Що ми щойно зробили"}, {"t": "fig", "v": "<svg viewBox=\"0 0 760 250\" xmlns=\"http://www.w3.org/2000/svg\" font-family='Golos Text, system-ui, sans-serif'>\n<defs><marker id=\"a4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1D1B26\"/><\/marker><\/defs>\n<rect x=\"15\" y=\"50\" width=\"200\" height=\"130\" rx=\"16\" fill=\"#FFE3D6\" stroke=\"#F0622E\" stroke-width=\"2\"/><text x=\"115\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"#1D1B26\">Фронтенд<\/text><text x=\"115\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6B6878\">HTML · CSS · JS<\/text><text x=\"115\" y=\"140\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6B6878\">в браузері<\/text>\n<rect x=\"280\" y=\"50\" width=\"200\" height=\"130\" rx=\"16\" fill=\"#DCE8FF\" stroke=\"#2F6FEB\" stroke-width=\"2\"/><text x=\"380\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"#1D1B26\">Бекенд<\/text><text x=\"380\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6B6878\">сервер, правила,<\/text><text x=\"380\" y=\"140\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6B6878\">секретні ключі<\/text>\n<rect x=\"545\" y=\"50\" width=\"200\" height=\"130\" rx=\"16\" fill=\"#D7F5E3
